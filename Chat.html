<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<meta name="description" content="Secure Chat">
<title>Secure Chat</title>

<style>
:root{
  --green:#06c755;
  --green-dark:#00a948;
  --bg:#efeae2;
  --white:#fff;
  --ink:#17202a;
  --muted:#667085;
  --line:#e5e7eb;
  --panel:#f7f8fa;
  --dark:#07111f;
  --danger:#ef4444;
  --warning:#d97706;
  --ok:#047857;
  --blue:#4f8cff;
}
*{
  box-sizing:border-box;
}
html,body{
  width:100%;
  height:100%;
  margin:0;
}
body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
}
button,input,textarea,select{
  font:inherit;
}
button{
  cursor:pointer;
}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.app{
  width:100%;
  height:100dvh;
  display:grid;
  grid-template-columns:330px minmax(0,1fr);
}
.sidebar{
  background:#fff;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-width:0;
}
.brand{
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--green);
  color:white;
  font-weight:900;
}
.brand h1{
  margin:0;
  font-size:18px;
}
.brand small{
  color:var(--muted);
  font-size:11px;
}

.me{
  margin:12px;
  padding:12px;
  background:var(--panel);
  border-radius:15px;
}
.peerid{
  margin-top:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:800;
  letter-spacing:.18em;
  font-size:16px;
}
.my-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}
.my-actions>*{
  flex:1;
}

.search{
  padding:0 12px 10px;
}
.search input{
  width:100%;
  height:39px;
  border:0;
  border-radius:12px;
  outline:0;
  padding:0 13px;
  background:#f0f2f5;
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
}
.tabs button{
  flex:1;
  padding:10px 5px;
  border:0;
  background:#fff;
  color:var(--muted);
}
.tabs button.active{
  color:var(--green);
  border-bottom:2px solid var(--green);
  font-weight:800;
}

.list{
  flex:1;
  overflow:auto;
}
.item{
  width:100%;
  display:flex;
  gap:11px;
  align-items:center;
  padding:11px 13px;
  border:0;
  background:#fff;
  text-align:left;
}
.item:hover{
  background:#f6f7f9;
}
.item.active{
  background:#eaf9ef;
}
.avatar{
  flex:none;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,#dbeafe,#ede9fe);
  font-weight:800;
}
.item .txt{
  flex:1;
  min-width:0;
}
.item strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.item p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.time{
  color:#98a2b3;
  font-size:10px;
}

.main{
  min-width:0;
  display:grid;
  grid-template-rows:62px minmax(0,1fr) 76px;
}
.topbar{
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  gap:10px;
}
.top-title{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.top-title h2{
  margin:0;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.top-title small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}
.top-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.iconbtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#f3f4f6;
}
.iconbtn:hover{
  background:#e5e7eb;
}

.chat{
  min-width:0;
  overflow:auto;
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(255,255,255,.5),
      transparent 32%
    ),
    var(--bg);
}
.notice{
  align-self:center;
  padding:6px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.76);
  color:#6b7280;
  font-size:11px;
}
.bubble{
  max-width:min(72%,760px);
  display:flex;
  flex-direction:column;
  gap:3px;
}
.mine{
  align-self:flex-end;
}
.theirs{
  align-self:flex-start;
}
.msg{
  padding:8px 10px;
  border-radius:12px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 1px 1px rgba(0,0,0,.06);
}
.mine .msg{
  background:#d9fdd3;
  border-top-right-radius:4px;
}
.theirs .msg{
  background:#fff;
  border-top-left-radius:4px;
}
.meta{
  color:#7b8190;
  font-size:10px;
  padding:0 5px;
}
.file-msg{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 10px;
  border-radius:12px;
  background:rgba(255,255,255,.7);
}
.file-msg span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.composer{
  padding:11px;
  display:flex;
  gap:8px;
  border-top:1px solid var(--line);
  background:#f7f8fa;
}
.composer textarea{
  min-height:50px;
  max-height:160px;
  flex:1;
  resize:none;
  border:0;
  border-radius:14px;
  padding:11px 13px;
  outline:none;
  background:#fff;
}
.composer button{
  width:52px;
  border:0;
  border-radius:14px;
}
.send{
  background:var(--green);
  color:#fff;
  font-weight:900;
}
.attach{
  background:#fff;
}

.empty{
  max-width:500px;
  margin:auto;
  text-align:center;
  color:var(--muted);
  line-height:1.7;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  padding:16px;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(15,23,42,.52);
}
.modal.show{
  display:flex;
}
.panel{
  width:min(780px,100%);
  max-height:92dvh;
  overflow:auto;
  padding:18px;
  border-radius:22px;
  background:#fff;
  box-shadow:0 30px 100px rgba(0,0,0,.28);
}
.panel h3{
  margin:0 0 7px;
}
.panel p.description{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.field{
  margin-top:12px;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:0;
}
.field textarea{
  min-height:90px;
  resize:vertical;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}
.card b{
  display:block;
  font-size:12px;
  margin-bottom:6px;
}
.card small{
  display:block;
  color:var(--muted);
  line-height:1.5;
  font-size:11px;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
  margin-top:16px;
}
.btn{
  border:0;
  padding:10px 14px;
  border-radius:12px;
  background:#eef2f7;
}
.btn.primary{
  color:#fff;
  background:var(--green);
}
.btn.danger{
  color:#991b1b;
  background:#fee2e2;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border-radius:999px;
  background:#eef2f7;
  color:#475467;
  font-size:11px;
}
.status-pill.ok{
  color:#166534;
  background:#dcfce7;
}
.status-pill.warn{
  color:#92400e;
  background:#fef3c7;
}
.status-pill.bad{
  color:#991b1b;
  background:#fee2e2;
}

.video-stage{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  background:#030712;
}
.video-stage.show{
  display:block;
}
.remote-video{
  width:100%;
  height:100%;
  object-fit:contain;
}
.local-video{
  position:absolute;
  z-index:2;
  right:18px;
  top:18px;
  width:min(28vw,270px);
  aspect-ratio:16/9;
  object-fit:cover;
  background:#111827;
  border:2px solid #fff;
  border-radius:14px;
}
.call-name{
  position:absolute;
  top:18px;
  left:18px;
  color:#fff;
  background:rgba(17,24,39,.68);
  padding:8px 11px;
  border-radius:11px;
  font-weight:800;
}
.callbar{
  position:absolute;
  z-index:4;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:9px;
  border-radius:18px;
  background:rgba(17,24,39,.78);
  backdrop-filter:blur(12px);
}
.callbar button{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#374151;
  color:#fff;
  font-size:18px;
}
.callbar .hang{
  background:var(--danger);
}

.logbox{
  height:320px;
  overflow:auto;
  padding:11px;
  border-radius:12px;
  background:var(--dark);
  color:#d9e4f5;
  font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;
}
.port-result{
  max-height:200px;
  overflow:auto;
  padding:10px;
  border-radius:12px;
  background:var(--dark);
  color:#d9e4f5;
  font:11px/1.5 ui-monospace,monospace;
  white-space:pre-wrap;
}
.diag-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.diag-card{
  padding:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
}
.diag-card b{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}
.diag-card span{
  font:12px ui-monospace,monospace;
  overflow-wrap:anywhere;
}
.ok-text{
  color:var(--ok);
}
.bad-text{
  color:#b91c1c;
}
.ai-chat{
  height:380px;
  overflow:auto;
  padding:10px;
  border-radius:14px;
  background:#f7f8fa;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.ai-msg{
  max-width:88%;
  padding:10px 12px;
  border-radius:13px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.ai-msg.user{
  align-self:flex-end;
  background:#d9fdd3;
}
.ai-msg.bot{
  align-self:flex-start;
  background:#fff;
  border:1px solid var(--line);
}
.ai-thinking{
  display:flex;
  gap:5px;
  align-items:center;
}
.ai-orb{
  width:32px;
  height:32px;
  display:inline-grid;
  place-items:center;
  border-radius:50%;
  background:#111827;
  color:#fff;
  animation:aiPulse 1.1s infinite ease-in-out;
}
@keyframes aiPulse{
  0%,100%{
    transform:scale(.88) rotate(0deg);
    opacity:.65;
  }
  50%{
    transform:scale(1.08) rotate(8deg);
    opacity:1;
  }
}
.ai-dots span{
  animation:dotBlink 1.2s infinite;
}
.ai-dots span:nth-child(2){
  animation-delay:.2s;
}
.ai-dots span:nth-child(3){
  animation-delay:.4s;
}
@keyframes dotBlink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}
.progress{
  height:12px;
  overflow:hidden;
  border-radius:999px;
  background:#e5e7eb;
}
.progress-bar{
  width:0%;
  height:100%;
  background:var(--green);
  transition:width .15s;
}
.progress-label{
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}
.upload-preview{
  max-width:180px;
  max-height:180px;
  border-radius:12px;
  object-fit:contain;
}
.hidden{
  display:none!important;
}
.toast{
  position:fixed;
  z-index:500;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(10px);
  padding:10px 14px;
  border-radius:12px;
  color:#fff;
  background:#111827;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:760px){
  .app{
    grid-template-columns:1fr;
  }
  .sidebar{
    display:none;
  }
  .main{
    grid-column:1;
  }
  .bubble{
    max-width:88%;
  }
  .settings-grid,
  .grid2,
  .grid3,
  .diag-grid{
    grid-template-columns:1fr;
  }
  .topbar{
    padding:0 8px;
  }
  .local-video{
    width:150px;
    right:10px;
    top:58px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="brand">
    <div class="logo">S</div>
    <div>
      <h1>Secure Chat</h1>
      <small>Private P2P messenger</small>
    </div>
  </div>

  <div class="me">

    <div style="font-size:11px;color:#667085">
      あなたのPeer ID
    </div>

    <div
      id="myId"
      class="peerid"
    >
      ------
    </div>

    <div style="font-size:10px;color:#667085;margin-top:4px">
      ページ更新後も同じID
    </div>

    <div style="margin-top:5px">
      <span
        id="persistenceStatus"
        class="status-pill"
      >
        確認中
      </span>
    </div>

    <div style="margin-top:9px">

      <button
        class="btn primary"
        style="width:100%"
        id="aiChatBtn"
      >
        🤖 SecureAIとチャットする
      </button>

    </div>

    <div class="my-actions">

      <button
        class="btn"
        id="copyId"
      >
        IDコピー
      </button>

      <button
        class="btn"
        id="nameBtn"
      >
        名前
      </button>

      <button
        class="btn primary"
        id="inviteBtn"
      >
        招待
      </button>

    </div>

  </div>

  <div class="search">
    <input
      id="search"
      placeholder="チャット・フレンド検索"
    >
  </div>

  <div class="tabs">

    <button
      class="active"
      data-tab="chats"
    >
      チャット
    </button>

    <button
      data-tab="friends"
    >
      フレンド
    </button>

    <button
      data-tab="history"
    >
      履歴
    </button>

  </div>

  <div
    id="list"
    class="list"
  ></div>

</aside>


<main class="main">

<header class="topbar">

  <div class="top-title">

    <div
      id="topAvatar"
      class="avatar"
    >
      ?
    </div>

    <div>

      <h2 id="topName">
        Secure Chat
      </h2>

      <small id="topStatus">
        初期化中…
      </small>

    </div>

  </div>

  <div class="top-actions">

    <button
      class="iconbtn"
      id="aiBtn"
      title="SecureAI"
    >
      🤖
    </button>

    <button
      class="iconbtn"
      id="settingsBtn"
      title="設定"
    >
      ⚙️
    </button>

    <button
      class="iconbtn"
      id="logBtn"
      title="ログ"
    >
      📜
    </button>

    <button
      class="iconbtn"
      id="iceBtn"
      title="ICE"
    >
      🧪
    </button>

    <button
      class="iconbtn"
      id="groupBtn"
      title="グループ"
    >
      👥
    </button>

    <button
      class="iconbtn"
      id="friendBtn"
      title="フレンド"
    >
      ＋
    </button>

    <button
      class="iconbtn"
      id="loginBtn"
      title="Microsoft"
    >
      M
    </button>

    <button
      class="iconbtn"
      id="callBtn"
      title="ビデオ通話"
    >
      📹
    </button>

  </div>

</header>


<section
  id="chat"
  class="chat"
>

  <div
    id="empty"
    class="empty"
  >
    <b>Secure Chat</b>
    <br><br>
    Peer IDを相手に入力して接続すると
    暗号化チャットを開始できます。
    <br><br>
    📹 ビデオ通話
    ・
    🤖 SecureAI
    ・
    🧪 ICE診断
  </div>

</section>


<footer class="composer">

  <input
    id="fileInput"
    type="file"
    class="hidden"
    multiple
  >

  <button
    id="attachBtn"
    class="attach"
    title="ファイル"
  >
    📎
  </button>

  <button
    id="imageAiBtn"
    class="attach"
    title="画像をSecureAIへ"

  </button>

  <textarea
    id="message"

  ></textarea>

  <button
    id="send"

</footer>

</main>

</div>


<div
  id="modal"
  class="modal"
>
  <div
    id="panel"
    class="panel"
  ></div>
</div>


<div
  id="videoStage"
  class="video-stage"
>

  <video
    id="remoteVideo"
    class="remote-video"

    playsinline
  ></video>

  <video
    id="localVideo"
    class="local-video"

    muted
    playsinline
  ></video>

  <div
    id="callName"
    class="call-name"
  >
    Secure Chat
  </div>

  <div class="callbar">

    <button
      id="micBtn"
    >
      🎙️
    </button>

    <button
      id="camBtn"
    >
      📷
    </button>

    <button
      id="fullBtn"
    >
      ⛶
    </button>

    <button
      id="hangBtn"
      class="hang"
    >
      ☎
    </button>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>
'use strict';


/* =========================================================
   Secure Chat
   ========================================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   Constants
   ========================================================= */

const STORAGE = {
  id:
    'securechat.peerid.v5',

  name:
    'securechat.name.v5',

  password:
    'securechat.password.v5',

  settings:
    'securechat.settings.v5',

  data:
    'securechat.data.v5',

  ai:
    'securechat.ai.v5',

  auth:
    'securechat.ms.auth.v5'
};


/* =========================================================
   Safe storage
   ========================================================= */

const Store = {

  get(key,fallback=null){

    try{

      const value =
        localStorage.getItem(
          key
        );

      return value === null
        ? fallback
        : value;

    }catch(error){

      return fallback;

    }

  },

  set(key,value){

    try{

      localStorage.setItem(
        key,
        value
      );

      return true;

    }catch(error){

      console.warn(
        'Storage write failed',
        error
      );

      return false;

    }

  },

  remove(key){

    try{

      localStorage.removeItem(
        key
      );

      return true;

    }catch{

      return false;

    }

  }

};


/* =========================================================
   Error handling
   ========================================================= */

function errorMessage(error){

  if(!error){

    return 'unknown error';

  }

  if(
    error instanceof Error
  ){

    return (
      error.message ||
      error.name ||
      'unknown error'
    );

  }

  if(
    typeof error ===
      'string'
  ){

    return error;

  }

  try{

    return JSON.stringify(
      error
    );

  }catch{

    return String(
      error
    );

  }

}

function esc(value){

  return String(
    value
  ).replace(
    /[&<>"']/g,
    char =>
      ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      })[char]
  );

}


/* =========================================================
   Secure persistent Peer ID
   ========================================================= */

function validPeerId(
  value
){

  return /^\d{6}$/.test(
    String(
      value ||
      ''
    )
  );

}


function generatePeerId(){

  try{

    const buffer =
      new Uint32Array(1);

    crypto.getRandomValues(
      buffer
    );

    return String(
      (buffer[0] % 900000) +
      100000
    );

  }catch(error){

    console.error(
      'crypto random failed',
      error
    );

    /*
      最後のfallback。
      永続性が取れない場合も
      UI自体は起動できるようにする。
    */

    return String(
      Math.floor(
        100000 +
        Math.random() *
        900000
      )
    );

  }

}


function getPersistentPeerId(){

  const stored =
    Store.get(
      STORAGE.id,
      ''
    );

  if(
    validPeerId(
      stored
    )
  ){

    return stored;

  }

  const id =
    generatePeerId();

  const ok =
    Store.set(
      STORAGE.id,
      id
    );

  if(!ok){

    console.warn(
      'Peer ID persistence unavailable'
    );

  }

  return id;

}

/* =========================================================
   Random token
   ========================================================= */

function randomToken(){

  try{

    const buffer =
      new Uint32Array(4);

    crypto.getRandomValues(
      buffer
    );

    return [
      ...buffer
    ]
      .map(
        n =>
          n.toString(36)
      )
      .join('');

  }catch{

    return (
      Date.now() +
      Math.random()
    ).toString(36);

  }

}

function safeLog(
  level,
  event,
  details=''
){

  const item = {

    time:
      new Date().toISOString(),

    level:
      String(level),

    event:
      String(event),

    details:
      String(details || '')

  };

  state.logs.push(
    item
  );

  if(
    state.logs.length >
    500
  ){

    state.logs =
      state.logs.slice(
        -500
      );

  }

  console.debug(
    '[Secure Chat]',
    item
  );

  if(
    $('logView')
  ){

    $('logView').textContent =
      state.logs
        .map(
          x =>
            `[${new Date(
              x.time
            ).toLocaleTimeString()}] ` +
            `[${x.level}] ` +
            x.event +
            (
              x.details
                ? ` — ${x.details}`
                : ''
            )
        )
        .join('\n');

    $('logView').scrollTop =
      $('logView').scrollHeight;

  }

}

){

/* =========================================================
   Clipboard
   ========================================================= */

async function copyText(
  text
){

  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        String(text)
      );

      return true;

    }

  }catch(error){

    addLog(
      'WARN',
      'clipboard API failed',
      errorMessage(error)
    );

  }

  try{

    const area =
      document.createElement(
        'textarea'
      );

    area.value =
      String(text);

    area.style.position =
      'fixed';

    area.style.opacity =
      '0';

    document.body.appendChild(
      area
    );

    area.focus();

    area.select();

    area.setSelectionRange(
      0,
      area.value.length
    );

    const ok =
      document.execCommand(
        'copy'
      );

    area.remove();

    return !!ok;

  }catch(error){

    addLog(
      'ERROR',
      'clipboard fallback failed',
      errorMessage(error)
    );

    return false;

  }

}


/* =========================================================
   Signaling
   ========================================================= */

function wsUrl(
  host=state.settings.host,
  port=state.settings.port
){

  return (
    `${state.settings.scheme}://` +
    `${host}:${port}` +
    `${state.settings.path}` +
    `peerjs?key=` +
    encodeURIComponent(
      state.settings.key
    ) +
    `&id=` +
    encodeURIComponent(
      state.id
    ) +
    `&token=` +
    encodeURIComponent(
      state.peerToken
    ) +
    `&version=1.5.5`
  );

}


function signalSend(
  message
){

  try{

    if(
      state.ws &&
      state.ws.readyState ===
        WebSocket.OPEN
    ){

      state.ws.send(
        JSON.stringify(
          message
        )
      );

      addLog(
        'SIGNAL',
        `send ${message.type}`,
        message.dst
          ? `to=${message.dst}`
          : ''
      );

      return true;

    }

  }catch(error){

    addLog(
      'ERROR',
      'signal send failed',
      errorMessage(error)
    );

  }

  return false;

}


function connectSignal(){

  const primary =
    Number(
      state.settings.port
    );

  const ports =
    state.settings.fallbackEnabled
      ? [
          primary,
          ...state.settings
            .fallbackPorts
            .filter(
              p =>
                p !== primary
            )
        ]
      : [
          primary
        ];

  let index =
    0;

  state.wsReady =
    false;

  $('topStatus')
    .textContent =
    '接続中…';

  const attempt =
    () => {

      if(
        index >=
        ports.length
      ){

        state.wsReady =
          false;

        $('topStatus')
          .textContent =
          '接続失敗';

        $('topStatus')
          .className =
          'danger-text';

        addLog(
          'ERROR',
          'all signaling endpoints failed'
        );

        monitorSecurity();

        return;

      }

      const port =
        ports[index++];

      const url =
        wsUrl(
          state.settings.host,
          port
        );

      addLog(
        'INFO',
        'signaling attempt',
        `${state.settings.scheme}://${state.settings.host}:${port}`
      );

      let socket;

      try{

        socket =
          new WebSocket(
            url
          );

      }catch(error){

        addLog(
          'WARN',
          'WebSocket constructor failed',
          `port=${port} ${errorMessage(error)}`
        );

        if(
          state.settings
            .fallbackEnabled
        ){

          setTimeout(
            attempt,
            80
          );

        }

        return;

      }

      state.ws =
        socket;

      let opened =
        false;

      let completed =
        false;

      const timer =
        setTimeout(
          () => {

            if(completed){
              return;
            }

            completed =
              true;

            try{
              socket.close();
            }catch{}

            addLog(
              'WARN',
              'signaling timeout',
              `port=${port}`
            );

            if(
              state.settings
                .fallbackEnabled
            ){

              attempt();

            }

          },
          Math.max(
            1000,
            Number(
              state.settings
                .fallbackTimeout
            ) ||
            3500
          )
        );

      socket.onopen =
        () => {

          if(completed){
            return;
          }

          completed =
            true;

          opened =
            true;

          clearTimeout(
            timer
          );

          state.wsReady =
            true;

          state.activeEndpoint = {

            scheme:
              state.settings
                .scheme,

            host:
              state.settings
                .host,

            port

          };

          state.settings.port =
            port;

          saveAll();

          $('topStatus')
            .textContent =
            `オンライン · ${port}`;

          $('topStatus')
            .className =
            'online';

          addLog(
            'INFO',
            'WebSocket open',
            `${state.settings.scheme}://${state.settings.host}:${port}`
          );

          monitorSecurity();

        };

      socket.onerror =
        () => {

          addLog(
            'WARN',
            'WebSocket error',
            `port=${port}`
          );

        };

      socket.onclose =
        () => {

          clearTimeout(
            timer
          );

          if(!opened){

            if(
              state.settings
                .fallbackEnabled &&
              !completed
            ){

              completed =
                true;

              attempt();

            }

            return;

          }

          state.wsReady =
            false;

          $('topStatus')
            .textContent =
            'シグナリング切断';

          $('topStatus')
            .className =
            'danger-text';

          addLog(
            'WARN',
            'WebSocket closed',
            `port=${port}`
          );

        };

      socket.onmessage =
        event => {

          try{

            handleSignal(
              JSON.parse(
                event.data
              )
            );

          }catch(error){

            addLog(
              'ERROR',
              'signal parse failed',
              errorMessage(error)
            );

          }

        };

    };

  attempt();

}


/* =========================================================
   Signaling handlers
   ========================================================= */

function handleSignal(
  message
){

  try{

    const type =
      message.type;

    const payload =
      message.payload || {};

    const source =
      message.src;

    addLog(
      'SIGNAL',
      `recv ${type}`,
      source
        ? `from=${source}`
        : ''
    );

    if(
      type === 'OPEN'
    ){

      state.wsReady =
        true;

      return;

    }

    if(
      type === 'ID-TAKEN'
    ){

      toast(
        'Peer IDが使用中です'
      );

      addLog(
        'ERROR',
        'peer id taken'
      );

      return;

    }

    if(
      type ===
        'PEER-UNAVAILABLE' ||
      type ===
        'EXPIRE'
    ){

      toast(
        '相手のPeer IDが見つかりません'
      );

      return;

    }

    if(!source){
      return;
    }

    const key =
      `${source}::${payload.connectionId || ''}`;

    let connection =
      state.connections.get(
        key
      ) ||
      state.connections.get(
        source
      );

    if(
      type === 'OFFER'
    ){

      connection =
        createConnection(
          source,
          payload.connectionId,
          payload.type ===
            'media'
            ? 'media'
            : 'data',
          false,
          payload.metadata
        );

      state.connections.set(
        key,
        connection
      );

      if(
        payload.type ===
          'media'
      ){

        handleIncomingCall(
          connection,
          payload.metadata
        );

      }else{

        handleDataOffer(
          connection,
          payload
        );

      }

      return;

    }

    if(connection){

      handleRTCMessage(
        connection,
        message
      );

    }

  }catch(error){

    addLog(
      'ERROR',
      'handleSignal failed',
      errorMessage(error)
    );

  }

}


/* =========================================================
   WebRTC
   ========================================================= */

function rtcConfig(){

  return {

    iceServers:[
      {
        urls:
          'stun:stun.l.google.com:19302'
      },
      {
        urls:[
          'turn:eu-0.turn.peerjs.com:3478',
          'turn:us-0.turn.peerjs.com:3478'
        ],
        username:
          'peerjs',
        credential:
          'peerjsp'
      }
    ],

    sdpSemantics:
      'unified-plan'

  };

}


function createConnection(
  remote,
  connectionId,
  kind,
  initiator,
  metadata
){

  const pc =
    new RTCPeerConnection(
      rtcConfig()
    );

  const connection = {

    remote,

    connectionId,

    kind,

    initiator,

    metadata:
      metadata || {},

    pc,

    dc:null,

    pendingCandidates:[],

    remoteStream:
      new MediaStream()

  };

  addLog(
    'INFO',
    'RTCPeerConnection created',
    `${kind} -> ${remote}`
  );

  pc.onicecandidate =
    event => {

      try{

        if(
          event.candidate
        ){

          addLog(
            'ICE',
            'candidate',
            `${event.candidate.protocol || ''} ${event.candidate.address || ''}:${event.candidate.port || ''}`
          );

          signalSend({

            type:
              'CANDIDATE',

            payload:{
              candidate:
                event.candidate,

              connectionId
            },

            dst:
              remote

          });

        }else{

          addLog(
            'ICE',
            'candidate gathering complete',
            remote
          );

        }

      }catch(error){

        addLog(
          'ERROR',
          'ICE candidate handling failed',
          errorMessage(error)
        );

      }

    };

  pc.onicecandidateerror =
    event => {

      addLog(
        'WARN',
        'ICE candidate error',
        `${event.url || ''} code=${event.errorCode || ''} ${event.errorText || ''}`
      );

    };

  pc.onicegatheringstatechange =
    () => {

      addLog(
        'ICE',
        'gathering state',
        `${remote}: ${pc.iceGatheringState}`
      );

    };

  pc.oniceconnectionstatechange =
    () => {

      addLog(
        'ICE',
        'connection state',
        `${remote}: ${pc.iceConnectionState}`
      );

      if(
        pc.iceConnectionState ===
          'failed'
      ){

        addLog(
          'ERROR',
          'ICE failed',
          remote
        );

        readIceStats(
          pc
        ).then(
          stats =>
            addLog(
              'ICE',
              'failure stats',
              JSON.stringify({
                local:
                  stats.localCandidates.length,
                remote:
                  stats.remoteCandidates.length,
                pairs:
                  stats.candidatePairs.length
              })
            )
        ).catch(
          error =>
            addLog(
              'ERROR',
              'ICE failure stats failed',
              errorMessage(error)
            )
        );

      }

    };

  pc.onconnectionstatechange =
    () => {

      addLog(
        'RTC',
        'connection state',
        `${remote}: ${pc.connectionState}`
      );

      if(
        pc.connectionState ===
          'connected'
      ){

        monitorSecurity(
          pc
        );

      }

      if(
        pc.connectionState ===
          'failed'
      ){

        /*
          アプリ切替などで一時的に
          WebRTC状態が悪化した場合に
          ICE restartを試す。
        */

        scheduleIceRestart(
          connection
        );

      }

    };

  pc.onsignalingstatechange =
    () =>
      addLog(
        'RTC',
        'signaling state',
        `${remote}: ${pc.signalingState}`
      );

  pc.ontrack =
    event => {

      try{

        if(
          event.track
        ){

          connection.remoteStream
            .addTrack(
              event.track
            );

        }

        if(
          kind === 'media'
        ){

          $('remoteVideo')
            .srcObject =
            connection.remoteStream;

        }

      }catch(error){

        addLog(
          'ERROR',
          'remote track failed',
          errorMessage(error)
        );

      }

    };

  pc.ondatachannel =
    event => {

      connection.dc =
        event.channel;

      bindDataChannel(
        connection
      );

    };

  return connection;

}


function bindDataChannel(
  connection
){

  const channel =
    connection.dc;

  if(!channel){
    return;
  }

  channel.onopen =
    () => {

      addLog(
        'DATA',
        'channel open',
        connection.remote
      );

      renderList();

      sendEncryptedPacket(
        connection.remote,
        {
          type:
            'hello',

          name:
            state.name
        }
      ).catch(
        error =>
          addLog(
            'WARN',
            'hello send failed',
            errorMessage(error)
          )
      );

    };

  channel.onclose =
    () =>
      addLog(
        'DATA',
        'channel close',
        connection.remote
      );

  channel.onerror =
    error =>
      addLog(
        'ERROR',
        'channel error',
        errorMessage(error)
      );

  channel.onmessage =
    async event => {

      try{

        const packet =
          JSON.parse(
            event.data
          );

        const object =
          await decryptPacket(
            packet
          );

        await receivePacket(
          connection.remote,
          object
        );

      }catch(error){

        addLog(
          'ERROR',
          'receive/decrypt failed',
          errorMessage(error)
        );

        toast(
          '受信データを処理できませんでした'
        );

      }

    };

}


async function createOffer(
  connection,
  type
){

  try{

    const offer =
      await connection.pc
        .createOffer();

    await connection.pc
      .setLocalDescription(
        offer
      );

    signalSend({

      type:
        'OFFER',

      payload:{

        sdp:
          connection.pc.localDescription,

        type,

        connectionId:
          connection.connectionId,

        metadata:{
          name:
            state.name
        }

      },

      dst:
        connection.remote

    });

  }catch(error){

    addLog(
      'ERROR',
      'createOffer failed',
      errorMessage(error)
    );

    throw error;

  }

}


async function handleDataOffer(
  connection,
  payload
){

  try{

    await connection.pc
      .setRemoteDescription(
        payload.sdp
      );

    for(
      const candidate
      of
      connection.pendingCandidates
        .splice(0)
    ){

      try{

        await connection.pc
          .addIceCandidate(
            candidate
          );

      }catch(error){

        addLog(
          'WARN',
          'queued ICE failed',
          errorMessage(error)
        );

      }

    }

    const answer =
      await connection.pc
        .createAnswer();

    await connection.pc
      .setLocalDescription(
        answer
      );

    signalSend({

      type:
        'ANSWER',

      payload:{

        sdp:
          connection.pc.localDescription,

        type:
          'data',

        connectionId:
          connection.connectionId

      },

      dst:
        connection.remote

    });

  }catch(error){

    addLog(
      'ERROR',
      'data offer failed',
      errorMessage(error)
    );

  }

}


async function handleRTCMessage(
  connection,
  message
){

  try{

    const payload =
      message.payload || {};

    if(
      message.type ===
        'ANSWER'
    ){

      await connection.pc
        .setRemoteDescription(
          payload.sdp
        );

      return;

    }

    if(
      message.type ===
        'CANDIDATE'
    ){

      if(
        connection.pc
          .remoteDescription
      ){

        await connection.pc
          .addIceCandidate(
            payload.candidate
          );

      }else{

        connection.pendingCandidates
          .push(
            payload.candidate
          );

      }

    }

  }catch(error){

    addLog(
      'ERROR',
      'RTC message failed',
      errorMessage(error)
    );

  }

}

/* =========================================================
   ICE restart
   ========================================================= */

function scheduleIceRestart(
  connection
){

  clearTimeout(
    connection.restartTimer
  );

  connection.restartTimer =
    setTimeout(
      async () => {

        try{

          if(
            connection.pc.signalingState !==
              'stable'
          ){

            return;

          }

          addLog(
            'ICE',
            'attempting ICE restart',
            connection.remote
          );

          const offer =
            await connection.pc
              .createOffer({
                iceRestart:true
              });

          await connection.pc
            .setLocalDescription(
              offer
            );

          signalSend({

            type:
              'OFFER',

            payload:{

              sdp:
                connection.pc.localDescription,

              type:
                connection.kind,

              connectionId:
                connection.connectionId,

              metadata:{
                name:
                  state.name
              }

            },

            dst:
              connection.remote

          });

        }catch(error){

          addLog(
            'WARN',
            'ICE restart failed',
            errorMessage(error)
          );

        }

      },
      1200
    );

}


/* =========================================================
   Crypto
   ========================================================= */

const encoder =
  new TextEncoder();

const decoder =
  new TextDecoder();


function base64(
  value
){

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(
        value
      )
    )
  );

}


function unbase64(
  value
){

  const raw =
    atob(
      value
    );

  return Uint8Array.from(
    raw,
    char =>
      char.charCodeAt(0)
  );

}


async function deriveKey(
  password,
  salt
){

  const base =
    await crypto.subtle
      .importKey(
        'raw',
        encoder.encode(
          password
        ),
        'PBKDF2',
        false,
        [
          'deriveKey'
        ]
      );

  return crypto.subtle
    .deriveKey(
      {
        name:
          'PBKDF2',

        salt,

        iterations:
          150000,

        hash:
          'SHA-256'
      },
      base,
      {
        name:
          'AES-GCM',

        length:
          256
      },
      false,
      [
        'encrypt',
        'decrypt'
      ]
    );

}


async function encryptObject(
  object,
  password
){

  if(!password){

    throw new Error(
      '共有パスフレーズが設定されていません'
    );

  }

  const salt =
    crypto.getRandomValues(
      new Uint8Array(16)
    );

  const iv =
    crypto.getRandomValues(
      new Uint8Array(12)
    );

  const key =
    await deriveKey(
      password,
      salt
    );

  const ciphertext =
    await crypto.subtle
      .encrypt(
        {
          name:
            'AES-GCM',
          iv
        },
        key,
        encoder.encode(
          JSON.stringify(
            object
          )
        )
      );

  return {

    version:
      2,

    algorithm:
      'AES-256-GCM',

    kdf:
      'PBKDF2-SHA256',

    salt:
      base64(
        salt
      ),

    iv:
      base64(
        iv
      ),

    ciphertext:
      base64(
        ciphertext
      )

  };

}


async function decryptObject(
  packet,
  password
){

  if(
    !packet ||
    !packet.ciphertext ||
    !packet.iv ||
    !packet.salt
  ){

    throw new Error(
      '暗号化パケットが不正です'
    );

  }

  const key =
    await deriveKey(
      password,
      unbase64(
        packet.salt
      )
    );

  const plaintext =
    await crypto.subtle
      .decrypt(
        {
          name:
            'AES-GCM',

          iv:
            unbase64(
              packet.iv
            )
        },
        key,
        unbase64(
          packet.ciphertext
        )
      );

  return JSON.parse(
    decoder.decode(
      plaintext
    )
  );

}


async function encryptPacket(
  object
){

  return encryptObject(
    object,
    state.password
  );

}


async function decryptPacket(
  packet
){

  return decryptObject(
    packet,
    state.password
  );

}

function findDataConnection(

){

      connection.remote ===
        remote &&
      connection.kind ===
        'data' &&
      connection.dc?.readyState ===

  );

}


async function sendEncryptedPacket(
  remote,
  object
){

  const connection =
    findDataConnection(
      remote
    );

  if(!connection){

    throw new Error(
      'P2P DataChannelが接続されていません'
    );

  }

  const packet =
    await encryptPacket(
      object
    );

  connection.dc.send(
    JSON.stringify(
      packet
    )
  );

}


async function receivePacket(
  remote,
  object
){

  if(
    object.type ===
      'hello'
  ){

    addFriend(
      remote,
      object.name ||
        remote,
      false
    );

    return;

  }

  if(
    object.type ===
      'friend-request'
  ){

    addFriend(
      remote,
      object.name ||
        remote,
      false
    );

    toast(
      'フレンド申請を受信しました'
    );

    return;

  }

  if(
    object.type ===
      'chat'
  ){

    state.chats.push({

      id:
        crypto.randomUUID(),

      peer:
        remote,

      from:
        remote,

      text:
        object.text,

      time:
        Date.now()

    });

    trimData();

    saveAll();

    if(
      state.selected ===
        remote
    ){

      renderChat(
        remote
      );

    }

    renderList();

    return;

  }

  if(
    object.type ===
      'file'
  ){

    await receiveFile(
      remote,
      object
    );

    return;

  }

  if(
    object.type ===
      'group-message'
  ){

    state.chats.push({

      id:
        crypto.randomUUID(),

      peer:
        remote,

      group:
        object.group,

      from:
        remote,

      text:
        object.text,

      time:
        Date.now()

    });

    trimData();

    saveAll();

    if(
      state.selected ===
        remote
    ){

      renderChat(
        remote
      );

    }

    return;

  }

}


/* =========================================================
   File transfer
   ========================================================= */

const MAX_INLINE_FILE =
  12 * 1024 * 1024;


async function fileToBase64(
  file
){

  if(
    file.size >
      MAX_INLINE_FILE
  ){

    throw new Error(
      '現在の単一HTML版では12MBを超えるファイルは送信できません'
    );

  }

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => {

          try{

            const result =
              String(
                reader.result
              );

            const comma =
              result.indexOf(',');

            resolve(
              comma >= 0
                ? result.slice(
                    comma + 1
                  )
                : result
            );

          }catch(error){

            reject(
              error
            );

          }

        };

      reader.onerror =
        () =>
          reject(
            reader.error ||
            new Error(
              'FileReader failed'
            )
          );

      reader.readAsDataURL(
        file
      );

    }
  );

}


async function sendFile(
  file,
  remote
){

  if(!file){
    return;
  }

  if(
    file.size >
      MAX_INLINE_FILE
  ){

    throw new Error(
      '12MBを超えるファイルは現在の単一HTML版では送れません'
    );

  }

  const data =
    await fileToBase64(
      file
    );

  await sendEncryptedPacket(
    remote,
    {

      type:
        'file',

      id:
        crypto.randomUUID(),

      name:
        file.name,

      mime:
        file.type ||
        'application/octet-stream',

      size:
        file.size,

      data

    }
  );

  state.chats.push({

    id:
      crypto.randomUUID(),

    peer:
      remote,

    from:
      state.id,

    file:{
      name:
        file.name,

      mime:
        file.type,

      size:
        file.size,

      local:true
    },

    time:
      Date.now()

  });

  trimData();

  saveAll();

  renderChat(
    remote
  );

}


async function receiveFile(
  remote,
  object
){

  try{

    const byteString =
      atob(
        object.data
      );

    const bytes =
      new Uint8Array(
        byteString.length
      );

    for(
      let i=0;
      i<byteString.length;
      i++
    ){

      bytes[i] =
        byteString.charCodeAt(
          i
        );

    }

    const blob =
      new Blob(
        [bytes],
        {
          type:
            object.mime
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    state.chats.push({

      id:
        object.id,

      peer:
        remote,

      from:
        remote,

      file:{
        name:
          object.name,

        mime:
          object.mime,

        size:
          object.size,

        url
      },

      time:
        Date.now()

    });

    trimData();

    saveAll();

    renderChat(
      remote
    );

    toast(
      `${object.name} を受信しました`
    );

  }catch(error){

    addLog(
      'ERROR',
      'file receive failed',
      errorMessage(error)
    );

    toast(
      'ファイル受信に失敗しました'
    );

  }

}

){

  }else if(

  saveAll();
  renderList();

        name:

        addLog(

async function startCall(
  remote
){

  if(!remote){

    toast(
      '通話相手を選択してください'
    );

    return;

  }

  try{

    if(
      !state.password
    ){

      openPasswordModal();
      return;

    }

    await getMedia();

    const connection =
      createConnection(
        remote,
        `media_${randomToken()}`,

        }
      );

    state.connections.set(

    );

    );

      of

    ){

      );

    }

      );

      );

    );

    );

      'ERROR',
      'start call failed',
      errorMessage(error)
    );

    toast(
      '通話を開始できません: ' +
      errorMessage(error)
    );

  }

}


async function handleIncomingCall(
  connection,
  metadata
){

  try{

    addLog(
      'CALL',
      'incoming call',
      connection.remote
    );

    try{

      alert(
        `📞 Secure Chat\n` +
        `${metadata?.name || connection.remote}` +
        ` からビデオ通話がかかってきました。`
      );

    }catch{}

    const accepted =
      confirm(
        `${metadata?.name || connection.remote}` +
        ' からビデオ通話です。受けますか？'
      );

    if(!accepted){

      connection.pc.close();

      addLog(
        'CALL',
        'incoming call rejected',
        connection.remote
      );

      return;

    }

    await getMedia();

    state.calls.set(
      connection.remote,
      connection
    );

    for(
      const track
      of
      state.localStream.getTracks()
    ){

      connection.pc.addTrack(
        track,
        state.localStream
      );

    }

    await connection.pc
      .setRemoteDescription(
        connection.pendingOffer
      );

    connection.pendingOffer =
      null;

    for(
      const candidate
      of
      connection.pendingCandidates
        .splice(0)
    ){

      try{

        await connection.pc
          .addIceCandidate(
            candidate
          );

      }catch(error){

        addLog(
          'WARN',
          'incoming ICE add failed',
          errorMessage(error)
        );

      }

    }

    const answer =
      await connection.pc
        .createAnswer();

    await connection.pc
      .setLocalDescription(
        answer
      );

    signalSend({

      type:
        'ANSWER',

      payload:{

        sdp:
          connection.pc.localDescription,

        type:
          'media',

        connectionId:
          connection.connectionId

      },

      dst:
        connection.remote

    });

    $('callName')
      .textContent =
      metadata?.name ||
      connection.remote;

    $('videoStage')
      .classList.add(
        'show'
      );

    saveCall(
      connection.remote,
      'incoming'
    );

    await requestWakeLock();

  }catch(error){

    addLog(
      'ERROR',
      'incoming call failed',
      errorMessage(error)
    );

    toast(
      '通話を受けられません'
    );

    try{
      connection.pc.close();
    }catch{}

    stopLocalMedia();

  }

}

/* =========================================================
   Security monitor
   ========================================================= */

async function monitorSecurity(
  pc=null
){

  const problems = [];

  if(
    !window.isSecureContext &&
    location.hostname !==
      'localhost' &&
    location.hostname !==
      '127.0.0.1'
  ){

    problems.push(
      'HTTPS等の安全なコンテキストではありません'
    );

  }

  if(
    !state.ws ||
    state.ws.readyState !==
      WebSocket.OPEN
  ){

    problems.push(
      'WSSシグナリングが接続されていません'
    );

  }

  if(pc){

    try{

      const stats =
        await pc.getStats();

      const dtlsStates=[];

      stats.forEach(
        item => {

          if(
            item.type ===
              'transport' &&
            item.dtlsState
          ){

            dtlsStates.push(
              item.dtlsState
            );

          }

        }
      );

      if(
        dtlsStates.length &&
        dtlsStates.every(
          value =>
            value ===
              'failed' ||
            value ===
              'closed'
        )
      ){

        problems.push(
          'WebRTC DTLS状態が正常ではありません'
        );

      }

    }catch(error){

      addLog(
        'WARN',
        'security stats failed',
        errorMessage(error)
      );

    }

  }

  if(
    problems.length
  ){

    const code =
      problems.join('|');

    if(
      state.lastSecurityAlert !==
        code
    ){

      state.lastSecurityAlert =
        code;

      addLog(
        'SECURITY',
        'security warning',
        problems.join('\n')
      );

      try{

        alert(
          '⚠️ Secure Chat セキュリティ警告\n\n' +
          problems.join('\n') +
          '\n\n' +
          'これは傍受を断定するものではありません。'
        );

      }catch{}

    }

    return false;

  }

  return true;

}


/* =========================================================
   ICE diagnostics
   ========================================================= */

async function readIceStats(
  pc
){

  const result={

    candidatePairs:[],

    localCandidates:[],

    remoteCandidates:[],

    transports:[]

  };

  try{

    const stats =
      await pc.getStats();

    stats.forEach(
      report => {

        if(
          report.type ===
            'candidate-pair' &&
          (
            report.state ===
              'succeeded' ||
            report.nominated
          )
        ){

          result.candidatePairs.push({

            state:
              report.state,

            nominated:
              !!report.nominated,

            protocol:
              report.protocol,

            rtt:
              report.currentRoundTripTime,

            bytesSent:
              report.bytesSent,

            bytesReceived:
              report.bytesReceived

          });

        }

        if(
          report.type ===
            'local-candidate'
        ){

          result.localCandidates.push({

            type:
              report.candidateType,

            protocol:
              report.protocol,

            address:
              report.address ||
              report.ip,

            port:
              report.port,

            url:
              report.url

          });

        }

        if(
          report.type ===
            'remote-candidate'
        ){

          result.remoteCandidates.push({

            type:
              report.candidateType,

            protocol:
              report.protocol,

            address:
              report.address ||
              report.ip,

            port:
              report.port

          });

        }

        if(
          report.type ===
            'transport'
        ){

          result.transports.push({

            dtls:
              report.dtlsState,

            ice:
              report.iceState

          });

        }

      }
    );

  }catch(error){

    addLog(
      'ERROR',
      'getStats failed',
      errorMessage(error)
    );

  }

  return result;

}


async function runIceDiagnostic(){

  let pc=null;

  const report={

    webRTC:
      !!window.RTCPeerConnection,

    media:
      !!navigator.mediaDevices
        ?.getUserMedia,

    websocket:
      wsStateText(),

    started:
      new Date().toISOString()

  };

  try{

    pc =
      new RTCPeerConnection(
        rtcConfig()
      );

    pc.createDataChannel(
      'securechat-ice-test'
    );

    pc.onicecandidateerror =
      event =>
        addLog(
          'WARN',
          'ICE test candidate error',
          `${event.url || ''} ${event.errorCode || ''} ${event.errorText || ''}`
        );

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    const timeout =
      Date.now() +
      8000;

    while(
      pc.iceGatheringState !==
        'complete' &&
      Date.now() <
        timeout
    ){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            150
          )
      );

    }

    report.iceGatheringState =
      pc.iceGatheringState;

    report.iceConnectionState =
      pc.iceConnectionState;

    report.stats =
      await readIceStats(
        pc
      );

  }catch(error){

    report.error =
      errorMessage(error);

    addLog(
      'ERROR',
      'ICE diagnostic failed',
      report.error
    );

  }finally{

    try{
      pc?.close();
    }catch{}

  }

  showIceReport(
    report
  );

  return report;

}

   Port tests
   ========================================================= */

async function testPort(
  port
){

  return new Promise(
    resolve => {

      const start =
        performance.now();

      let done =
        false;

      let socket;

      try{

        socket =
          new WebSocket(
            wsUrl(
              state.settings.host,
              port
            )
          );

      }catch{

        resolve({
          port,
          ok:false,
          reason:'constructor'
        });

        return;

      }

      const timer =
        setTimeout(
          () => {

            if(done){
              return;
            }

            done =
              true;

            try{
              socket.close();
            }catch{}

            resolve({

              port,

              ok:false,

              reason:'timeout',

              ms:
                Math.round(
                  performance.now() -
                  start
                )

            });

          },
          Math.min(
            5000,
            state.settings
              .fallbackTimeout
          )
        );

      socket.onopen =
        () => {

          if(done){
            return;
          }

          done =
            true;

          clearTimeout(
            timer
          );

          const ms =
            Math.round(
              performance.now() -
              start
            );

          try{
            socket.close();
          }catch{}

          resolve({

            port,

            ok:true,

            ms

          });

        };

      socket.onerror =
        () => {

          if(done){
            return;
          }

          done =
            true;

          clearTimeout(
            timer
          );

          try{
            socket.close();
          }catch{}

          resolve({

            port,

            ok:false,

            reason:'error',

            ms:
              Math.round(
                performance.now() -
                start
              )

          });

        };

    }
  );

}


async function testPorts(){

  const ports =
    [
      ...new Set([
        state.settings.port,

  showModal(`

    <p class="description">
      診断だけを行います。

    </div>

    <div class="actions">

      <button

        閉じる
      </button>

    </div>

  `);

  const result=[];

  for(

    of ports
  ){

  );

}

function normalizeAI(
  text
){

  return String(
    text ||
    ''
  )
    .normalize(
      'NFKC'
    )
    .toLowerCase()
    .replace(
      /[\s　]+/g,
      ' '
    )
    .trim();

}

   SecureAI Site Control
   ========================================================= */

function aiCanControl(){

function aiSetSetting(
  key,
  value
){

  if(
    !aiCanControl()
  ){

    throw new Error(
      'SecureAIのサイト操作権限がOFFです'
    );

  }

  const allowed = new Set([

    'port',

    'scheme',

    'fallbackEnabled',

    'fallbackPorts',

    'fallbackTimeout',

    'aiModel',

    'aiModelUrl'

  ]);

  if(
    !allowed.has(
      key
    )
  ){

    throw new Error(
      'SecureAIにはこの設定を変更する権限がありません'
    );

  }

  if(
    key ===
      'port'
  ){

    const port =
      Number(
        value
      );

    if(
      port < 1 ||
      port > 65535
    ){

      throw new Error(
        'ポート番号が不正です'
      );

    }

    state.settings.port =
      port;

  }else if(
    key ===
      'scheme'
  ){

    if(
      value !==
        'ws' &&
      value !==
        'wss'
    ){

      throw new Error(
        '通信方式が不正です'
      );

    }

    state.settings.scheme =
      value;

  }else if(
    key ===
      'fallbackEnabled'
  ){

    state.settings
      .fallbackEnabled =
      Boolean(value);

  }else if(
    key ===
      'fallbackPorts'
  ){

    if(
      !Array.isArray(value)
    ){

      throw new Error(
        'fallbackPorts must be array'
      );

    }

    state.settings
      .fallbackPorts =
      [
        ...new Set(
          value
            .map(Number)
            .filter(
              port =>
                port > 0 &&
                port < 65536
            )
        )
      ];

  }else if(
    key ===
      'fallbackTimeout'
  ){

    state.settings
      .fallbackTimeout =
      Math.max(
        1000,
        Math.min(
          15000,
          Number(value) ||
            3500
        )
      );

  }else{

    state.settings[key] =
      String(
        value
      );

  }

  saveAll();

  addLog(
    'INFO',
    'SecureAI changed site setting',
    key
  );

}


/* =========================================================
   SecureAI endpoint
   ========================================================= */

async function endpointAIAnswer(
  question,
  imageData=''
){

  const endpoint =
    state.settings.aiEndpoint;

  if(!endpoint){

    throw new Error(
      'AI Endpointが設定されていません'
    );

  }

  const messages = [

    ...state.aiHistory
      .slice(-10)
      .map(
        item => ({
          role:
            item.role,
          content:
            item.text
        })
      ),

    {
      role:
        'user',

      content:
        imageData
          ? [
              {
                type:
                  'text',
                text:
                  question
              },
              {
                type:
                  'image_url',
                image_url:{
                  url:
                    imageData
                }
              }
            ]
          : question

    }

  ];

  const headers = {

    'Content-Type':
      'application/json'

  };

  if(
    state.settings.aiApiKey
  ){

    headers.Authorization =
      `Bearer ${
        state.settings.aiApiKey
      }`;

  }

  const response =
    await fetch(
      endpoint,
      {

        method:
          'POST',

        headers,

        body:
          JSON.stringify({

            model:
              state.settings.aiModel ||
              undefined,

            messages,

            temperature:
              .7

          })

      }
    );

  if(
    !response.ok
  ){

    throw new Error(
      `AI Endpoint HTTP ${response.status}`
    );

  }

  const data =
    await response.json();

  const answer =
    data?.choices?.[0]?.message?.content ||
    data?.choices?.[0]?.text;

  if(!answer){

    throw new Error(
      'AIレスポンス形式を解釈できません'
    );

  }

  return String(
    answer
  );

}


/* =========================================================
   AI model downloader
   ========================================================= */

async function downloadAIModel(){

  const url =
    state.settings.aiModelUrl;

  if(!url){

    toast(
      '設定にモデルURLを入力してください'
    );

    return;

  }

  const progress =
    $('modelProgress');

  const bar =
    $('modelProgressBar');

  const label =
    $('modelProgressLabel');

  if(
    progress
  ){

    progress.classList.remove(
      'hidden'
    );

    bar.style.width =
      '0%';

    label.textContent =
      '接続中…';

  }

  try{

    const response =
      await fetch(
        url
      );

    if(
      !response.ok
    ){

      throw new Error(
        `モデルHTTP ${response.status}`
      );

    }

    const total =
      Number(
        response.headers.get(
          'Content-Length'
        )
      ) || 0;

    const reader =
      response.body?.getReader();

    if(!reader){

      throw new Error(
        'ReadableStreamが利用できません'
      );

    }

    const chunks=[];

    let received=0;

    while(true){

      const {
        done,
        value
      } =
        await reader.read();

      if(done){
        break;
      }

      chunks.push(
        value
      );

      received +=
        value.byteLength;

      if(total){

        const percent =
          Math.min(
            100,
            received /
              total *
              100
          );

        bar.style.width =
          `${percent}%`;

        label.textContent =
          `${percent.toFixed(1)}% ` +
          `(${formatBytes(received)} / ${formatBytes(total)})`;

      }else{

        label.textContent =
          `${formatBytes(received)} 受信中…`;

      }

    }

    const blob =
      new Blob(
        chunks
      );

    /*
      モデルそのものの形式は
      推論エンジンによって違う。
      ここではIndexedDBへ保存し、
      後段のSecureAI backendが利用できる形にする。
    */

    await saveAIModel(
      blob
    );

    bar.style.width =
      '100%';

    label.textContent =
      `完了 (${formatBytes(received)})`;

    addLog(
      'INFO',
      'AI model downloaded',
      formatBytes(received)
    );

    toast(
      'AIモデルを保存しました'
    );

  }catch(error){

    addLog(
      'ERROR',
      'AI model download failed',
      errorMessage(error)
    );

    if(label){

      label.textContent =
        'ダウンロード失敗: ' +
        errorMessage(error);

    }

    toast(
      'AIモデルのダウンロードに失敗しました'
    );

  }

}


function formatBytes(
  bytes
){

  if(
    !Number.isFinite(
      bytes
    )
  ){

    return '0 B';

  }

  const units =
    ['B','KB','MB','GB'];

  let index =
    0;

  let value =
    bytes;

  while(
    value >= 1024 &&
    index <
      units.length - 1
  ){

    value /=
      1024;

    index++;

  }

  return (
    value.toFixed(
      value >= 10
        ? 0
        : 1
    ) +
    ' ' +
    units[index]
  );

}


/* =========================================================
   IndexedDB AI model storage
   ========================================================= */

function openAIModelDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          'SecureChatAI',
          1
        );

      request.onupgradeneeded =
        () => {

          if(
            !request.result
              .objectStoreNames
              .contains(
                'models'
              )
          ){

            request.result
              .createObjectStore(
                'models'
              );

          }

        };

      request.onsuccess =
        () =>
          resolve(
            request.result
          );

      request.onerror =
        () =>
          reject(
            request.error ||
            new Error(
              'IndexedDB error'
            )
          );

    }
  );

}


async function saveAIModel(
  blob
){

  const db =
    await openAIModelDB();

  return new Promise(
    (resolve,reject)=>{

      const transaction =
        db.transaction(
          'models',
          'readwrite'
        );

      transaction
        .objectStore(
          'models'
        )
        .put(
          blob,
          'active'
        );

      transaction.oncomplete =
        () => {

          db.close();

          resolve();

        };

      transaction.onerror =
        () => {

          db.close();

          reject(
            transaction.error ||
            new Error(
              'model save failed'
            )
          );

        };

    }
  );

}

async function askSecureAI(
  question,
  imageData=''
){

  const text =
    String(
      question ||
      ''
    ).trim();

  if(!text && !imageData){

    return;

  }

  addAIMessage(
    'user',
    imageData
      ? `${text}\n[画像添付]`
      : text
  );

  addAIThinking();

  try{

    let answer;

    const mode =
      state.settings.aiModelMode;

    if(
      mode ===
        'endpoint' ||
      (
        mode ===
          'auto' &&
        state.settings.aiEndpoint
      )
    ){

      try{

        answer =
          await endpointAIAnswer(
            text,
            imageData
          );

      }catch(error){

        addLog(
          'WARN',
          'remote AI failed, fallback',
          errorMessage(error)
        );

        answer =
          localAIAnswer(
            text
          );

      }

    }else{

      answer =
        localAIAnswer(
          text
        );

    }

    state.aiHistory.push({

      role:
        'user',

      text,

      time:
        Date.now()

    });

    state.aiHistory.push({

      role:
        'assistant',

      text:
        answer,

      time:
        Date.now()

    });

    state.aiHistory =
      state.aiHistory.slice(
        -60
      );

    saveAll();

    return answer;

  }catch(error){

    addLog(
      'ERROR',
      'SecureAI failure',
      errorMessage(error)
    );

    return (
      'SecureAI内部でエラーが発生しました。\n' +
      'ログを確認してください。'
    );

  }finally{

    removeAIThinking();

  }

}

async function backupData(){

  const encrypted =
    confirm(
      'バックアップを暗号化しますか？'
    );

  const ext =
    prompt(
      '拡張子を入力してください（dat / json / txtなど）',
      encrypted
        ? 'dat'
        : 'json'
    );

  if(
    !ext
  ){

    return;

  }

  const safeExt =
    ext
      .trim()
      .replace(
        /[^a-zA-Z0-9]/g,
        ''
      ) ||
    'json';

  let data = {

    version:
      5,

    created:
      new Date().toISOString(),

    app:
      'Secure Chat',

    peerId:
      state.id,

    name:
      state.name,

    chats:
      state.chats,

    friends:
      state.friends,

    groups:
      state.groups,

    calls:
      state.callHistory,

    settings:
      state.settings

  };

  let text;

  if(
    encrypted
  ){

    const password =
      prompt(
        'バックアップ用パスフレーズ'
      );

    if(!password){

      return;

    }

    const packet =
      await encryptObject(
        data,
        password
      );

    text =
      JSON.stringify(
        packet,
        null,
        2
      );

  }else{

    text =
      JSON.stringify(
        data,
        null,
        2
      );

    if(
      safeExt ===
        'txt'
    ){

      text =
        [
          'Secure Chat Backup',
          '',
          text
        ].join(
          '\n'
        );

    }

  }

  const blob =
    new Blob(
      [text],
      {
        type:
          'application/octet-stream'
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const anchor =
    document.createElement(
      'a'
    );

  anchor.href =
    url;

  anchor.download =
    `secure-chat-backup.${safeExt}`;

  anchor.click();

  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    3000
  );

}

/* =========================================================
   Microsoft OAuth PKCE
   ========================================================= */

function randomBase64Url(
  bytes=32
){

  const buffer =
    crypto.getRandomValues(
      new Uint8Array(
        bytes
      )
    );

  let binary =
    '';

  for(
    const byte
    of buffer
  ){

    binary +=
      String.fromCharCode(
        byte
      );

  }

  return btoa(
    binary
  )
    .replace(
      /\+/g,
      '-'
    )
    .replace(
      /\//g,
      '_'
    )
    .replace(
      /=+$/g,
      ''
    );

}


async function sha256Base64Url(
  input
){

  const hash =
    await crypto.subtle.digest(
      'SHA-256',
      encoder.encode(
        input
      )
    );

  return base64(
    hash
  )
    .replace(
      /\+/g,
      '-'
    )
    .replace(
      /\//g,
      '_'
    )
    .replace(
      /=+$/g,
      ''
    );

}


async function microsoftLogin(){

  const clientId =
    state.settings
      .microsoftClientId;

  if(!clientId){

    showSettings();

    toast(
      'Microsoft Client IDを設定してください'
    );

    return;

  }

  const verifier =
    randomBase64Url(
      48
    );

  const challenge =
    await sha256Base64Url(
      verifier
    );

  const redirectUri =
    location.href.split('#')[0];

  sessionStorage.setItem(
    'securechat.ms.verifier',
    verifier
  );

  const params =
    new URLSearchParams({

      client_id:
        clientId,

      response_type:
        'code',

      redirect_uri:
        redirectUri,

      response_mode:
        'query',

      scope:
        state.settings
          .microsoftScopes,

      code_challenge:
        challenge,

      code_challenge_method:
        'S256',

      state:
        randomBase64Url(24)

    });

  location.href =
    `https://login.microsoftonline.com/` +
    `${state.settings.microsoftTenant}` +
    `/oauth2/v2.0/authorize?` +
    params.toString();

}


async function handleMicrosoftCallback(){

  const params =
    new URLSearchParams(
      location.search
    );

  const code =
    params.get(
      'code'
    );

  if(!code){
    return false;
  }

  const verifier =
    sessionStorage.getItem(
      'securechat.ms.verifier'
    );

  if(!verifier){

    toast(
      'Microsoft認証の状態が見つかりません'
    );

    return false;

  }

  const clientId =
    state.settings
      .microsoftClientId;

  if(!clientId){

    return false;

  }

  const body =
    new URLSearchParams({

      client_id:
        clientId,

      grant_type:
        'authorization_code',

      code,

      redirect_uri:
        location.href.split('?')[0],

      code_verifier:
        verifier,

      scope:
        state.settings
          .microsoftScopes

    });

  try{

    const response =
      await fetch(
        `https://login.microsoftonline.com/` +
        `${state.settings.microsoftTenant}` +
        `/oauth2/v2.0/token`,
        {
          method:
            'POST',

          headers:{
            'Content-Type':
              'application/x-www-form-urlencoded'
          },

          body
        }
      );

    if(
      !response.ok
    ){

      throw new Error(
        `Microsoft token HTTP ${response.status}`
      );

    }

    const data =
      await response.json();

    state.msAuth = {

      accessToken:
        data.access_token ||
        '',

      idToken:
        data.id_token ||
        '',

      account:
        null

    };

    Store.set(
      STORAGE.auth,
      JSON.stringify(
        state.msAuth
      )
    );

    history.replaceState(
      {},
      '',
      location.pathname +
      location.hash
    );

    addLog(
      'INFO',
      'Microsoft login success'
    );

    toast(
      'Microsoftアカウントでログインしました'
    );

    return true;

  }catch(error){

    addLog(
      'ERROR',
      'Microsoft login failed',
      errorMessage(error)
    );

    toast(
      'Microsoftログインに失敗しました'
    );

    return false;

  }

}


/* =========================================================
   Wake Lock / background call stability
   ========================================================= */

async function requestWakeLock(){

  try{

    if(
      !('wakeLock' in navigator)
    ){

      return;

    }

    state.wakeLock =
      await navigator.wakeLock
        .request(
          'screen'
        );

    addLog(
      'MEDIA',
      'wake lock acquired'
    );

    state.wakeLock
      .addEventListener(
        'release',
        () =>
          addLog(
            'MEDIA',
            'wake lock released'
          )
      );

  }catch(error){

    addLog(
      'WARN',
      'wake lock unavailable',
      errorMessage(error)
    );

  }

}


async function reAcquireWakeLock(){

  if(
    state.calls.size >
      0
  ){

    await requestWakeLock();

  }

}


document.addEventListener(
  'visibilitychange',
  () => {

    if(
      document.visibilityState ===
        'visible'
    ){

      reAcquireWakeLock();

      for(
        const connection
        of
        state.connections.values()
      ){

        if(
          connection.pc.connectionState ===
            'failed' ||
          connection.pc.iceConnectionState ===
            'failed'
        ){

          scheduleIceRestart(
            connection
          );

        }

      }

      addLog(
        'INFO',
        'page became visible'
      );

    }else{

      addLog(
        'INFO',
        'page became hidden'
      );

    }

  }
);


/* =========================================================
   Stop media
   ========================================================= */

function stopLocalMedia(){

  if(
    state.localStream
  ){

    for(
      const track
      of
      state.localStream.getTracks()
    ){

      try{
        track.stop();
      }catch{}

    }

    state.localStream =
      null;

  }

  $('localVideo')
    .srcObject =
    null;

}


function hangup(){

  try{

    for(
      const connection
      of
      state.connections.values()
    ){

      if(
        connection.kind ===
          'media'
      ){

        try{
          connection.pc.close();
        }catch{}

      }

    }

    state.calls.clear();

    stopLocalMedia();

    $('remoteVideo')
      .srcObject =
      null;

    $('videoStage')
      .classList.remove(
        'show'
      );

    state.wakeLock
      ?.release?.();

    state.wakeLock =
      null;

    addLog(
      'CALL',
      'call ended'
    );

  }catch(error){

    addLog(
      'ERROR',
      'hangup failed',
      errorMessage(error)
    );

  }

}
