*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}.app{height:100dvh;display:grid;grid-template-columns:330px 1fr;grid-template-rows:1fr}.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{height:62px;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted);display:block;font-size:11px}.me{margin:12px;padding:12px;background:#f7f8fa;border-radius:14px}.peerid{font:700 15px ui-monospace,monospace;letter-spacing:.12em}.my-actions{display:flex;gap:8px;margin-top:9px}.search{padding:0 12px 10px}.search input{width:100%;height:39px;border:0;border-radius:12px;background:#f0f2f5;padding:0 13px;outline:none}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:#fff;padding:10px 6px;color:var(--muted);cursor:pointer}.tabs button.active{color:var(--green);font-weight:700;border-bottom:2px solid var(--green)}.list{overflow:auto;flex:1}.item{display:flex;gap:11px;padding:11px 13px;border:0;background:#fff;width:100%;text-align:left;cursor:pointer}.item:hover{background:#f6f7f9}.item.active{background:#eaf9ef}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-weight:800;flex:none}.item .txt{min-width:0;flex:1}.item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item p{margin:4px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#98a2b3;flex:none}.main{min-width:0;display:grid;grid-template-rows:62px 1fr 76px;position:relative}.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.top-title{display:flex;gap:11px;align-items:center}.top-title h2{font-size:16px;margin:0}.top-title small{display:block;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:7px}.iconbtn{border:0;background:#f3f4f6;width:38px;height:38px;border-radius:12px;cursor:pointer}.iconbtn:hover{background:#e5e7eb}.chat{overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.45),transparent 30%),var(--bg)}.notice{align-self:center;background:rgba(255,255,255,.72);padding:6px 11px;border-radius:12px;color:#6b7280;font-size:11px}.bubble{max-width:min(72%,700px);display:flex;flex-direction:column;gap:3px}.bubble.mine{align-self:flex-end}.bubble.theirs{align-self:flex-start}.msg{padding:8px 10px;border-radius:12px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;overflow-wrap:anywhere}.mine .msg{background:#d9fdd3;border-top-right-radius:4px}.theirs .msg{background:#fff;border-top-left-radius:4px}.meta{font-size:10px;color:#7b8190;padding:0 5px}.composer{background:#f7f8fa;border-top:1px solid var(--line);display:flex;gap:8px;padding:11px}.composer textarea{flex:1;resize:none;border:0;border-radius:14px;padding:11px 13px;min-height:50px;outline:none;background:#fff}.send{border:0;background:var(--green);color:#fff;width:52px;border-radius:14px;cursor:pointer;font-weight:800}.empty{margin:auto;text-align:center;color:var(--muted);max-width:480px;line-height:1.7}.modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.panel{width:min(640px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 28px 80px rgba(0,0,0,.24)}.panel h3{margin:0 0 6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;outline:none}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.btn{border:0;background:#eef2f7;padding:10px 14px;border-radius:12px;cursor:pointer}.btn.primary{background:var(--green);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.video-stage{position:fixed;inset:0;background:#030712;z-index:70;display:none}.video-stage.show{display:block}.remote-video{width:100%;height:100%;object-fit:contain;background:#030712}.local-video{position:absolute;right:18px;top:18px;width:min(28vw,260px);aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.8);background:#111827}.callbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;background:rgba(17,24,39,.78);backdrop-filter:blur(12px);padding:9px;border-radius:18px}.callbar button{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;background:#374151;color:#fff;font-size:18px}.callbar .hang{background:var(--danger)}.callname{position:absolute;left:18px;top:18px;color:#fff;background:rgba(17,24,39,.62);padding:8px 11px;border-radius:11px;font-weight:700}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.online{color:#0aaf4b}.danger-text{color:var(--danger)}.diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.settings-card{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:12px}.settings-card b{display:block;font-size:12px;margin-bottom:5px}.settings-card small{display:block;color:var(--muted);line-height:1.5}.ai-chat{height:320px;overflow:auto;background:#f7f8fa;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}.ai-msg{max-width:86%;padding:9px 11px;border-radius:12px;line-height:1.5;white-space:pre-wrap}.ai-msg.user{align-self:flex-end;background:#d9fdd3}.ai-msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line)}.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#eef2f7;color:#475467;font-size:11px}.status-pill.ok{background:#dcfce7;color:#166534}.status-pill.warn{background:#fef3c7;color:#92400e}.port-list{max-height:150px;overflow:auto;background:#07111f;color:#d9e4f5;border-radius:12px;padding:9px;font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap}.diag-card{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:10px}.diag-card b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.diag-card span{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.logbox{height:300px;overflow:auto;background:#07111f;color:#d9e4f5;border-radius:12px;padding:11px;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.okmark{color:#047857}.badmark{color:#b91c1c}@media(max-width:760px){.settings-grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{display:none}.main{grid-column:1}.bubble{max-width:88%}.grid2{grid-template-columns:1fr}.local-video{width:150px;right:10px;top:56px}.topbar{padding:0 10px}}
</style>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">S</div><div><h1>Secure Chat</h1><small>Private P2P messenger</small></div></div>
    <div class="me"><div style="font-size:11px;color:#667085">あなたのPeer ID</div><div id="myId" class="peerid">------</div><div style="font-size:10px;color:#667085;margin-top:4px">🔒 更新後も同じIDを保持</div><div style="margin-top:9px"><button class="btn primary" style="width:100%" id="aiChatBtn">🤖 SecureAIとチャットする</button></div><div class="my-actions"><button class="btn" id="copyId">IDをコピー</button><button class="btn" id="nameBtn">名前設定</button><button class="btn primary" id="inviteBtn">招待リンク</button></div></div>
    <div class="search"><input id="search" placeholder="チャット・フレンドを検索"></div>
    <div class="tabs"><button class="active" data-tab="chats">チャット</button><button data-tab="friends">フレンド</button><button data-tab="history">履歴</button></div>
    <div id="list" class="list"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-title"><div class="avatar" id="topAvatar">?</div><div><h2 id="topName">Secure Chat</h2><small id="topStatus">Peer IDを発行中…</small></div></div>
      <div class="top-actions"><button class="iconbtn" id="aiBtn" title="SecureAIとチャット">🤖</button><button class="iconbtn" id="settingsBtn" title="設定">⚙️</button><button class="iconbtn" id="logBtn" title="ログ">📜</button><button class="iconbtn" id="iceBtn" title="ICE診断">🧪</button><button class="iconbtn" id="groupBtn" title="グループ">👥</button><button class="iconbtn" id="friendBtn" title="フレンド追加">＋</button><button class="iconbtn" id="callBtn" title="ビデオ通話">📹</button></div>
    </header>
    <section id="chat" class="chat"><div class="empty" id="empty"><b>Secure Chat</b><br>Peer IDを相手に渡して接続すると、ここから暗号化チャットできます。<br><br>ビデオ通話はカメラ・マイクの許可が必要です。</div></section>
    <footer class="composer"><textarea id="message" placeholder="メッセージ…  Ctrl+Enterで送信"></textarea><button class="send" id="send">➤</button></footer>
  </main>
</div>

<div class="modal" id="modal"><div class="panel" id="panel"></div></div>
<div class="video-stage" id="videoStage"><video id="remoteVideo" class="remote-video" autoplay playsinline></video><video id="localVideo" class="local-video" autoplay muted playsinline></video><div class="callname" id="callName">Secure Chat</div><div class="callbar"><button id="micBtn">🎙️</button><button id="camBtn">📷</button><button id="switchCamBtn">🔄</button><button id="hangBtn" class="hang">☎</button></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/*
  Secure Chat single-file build.
  - No external CDN.
  - No third-party library source is copied into this file.
  - Uses browser Web Crypto + WebRTC directly.
  - Uses PeerServer signalling protocol messages so the page can still use
    PeerJS Cloud/PeerServer as a broker without shipping PeerJS itself.
  Important: signalling is external; message/call media travels peer-to-peer
  when WebRTC can establish a direct path. Automatic port fallback is opt-in
  and OFF by default; it never bypasses the browser or network firewall.
*/
const $=id=>document.getElementById(id);
const DB='SecureChatDB_v3';
const LS={id:'securechat.peerid',name:'securechat.name',password:'securechat.pass',settings:'securechat.settings'};
const safeStore={
  get(key,fallback=null){try{const v=localStorage.getItem(key);return v===null?fallback:v}catch(e){return fallback}},
  set(key,value){try{localStorage.setItem(key,value);return true}catch(e){return false}},
  remove(key){try{localStorage.removeItem(key);return true}catch(e){return false}}
};
function validPeerId(x){return /^\d{6}$/.test(String(x||''));}
function getPersistentPeerId(){
  const old=safeStore.get(LS.id,'');
  if(validPeerId(old)) return old;
  const id=makeId();
  safeStore.set(LS.id,id);
  return id;
}
const state={
 id:getPersistentPeerId(), name:safeStore.get(LS.name,'ユーザー')||'ユーザー', peerToken:randomToken(), ws:null, wsReady:false,
 peerServerHost:'0.peerjs.com', peerServerPort:443, peerServerPath:'/', peerServerKey:'peerjs', peerScheme:'wss', fallbackPorts:[443,8443,8080,80], fallbackEnabled:false, fallbackTimeoutMs:3500, activeEndpoint:null, fallbackTried:false,
 selected:null, connections:new Map(), calls:new Map(), localStream:null, chats:[], friends:[], callsHistory:[], groups:[], logs:[], lastSecurityAlert:'', aiHistory:[]
};
function makeId(){ let a=''; const n=new Uint32Array(1); do{crypto.getRandomValues(n); a=String(n[0]%900000+100000)}while(a==='000000'); return a; }
function randomToken(){const a=new Uint32Array(3);crypto.getRandomValues(a);return [...a].map(x=>x.toString(36)).join('');}
function now(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
function save(){safeStore.set(LS.id,state.id);safeStore.set(LS.name,state.name);safeStore.set(LS.password,safeStore.get(LS.password,'')||'');try{safeStore.set(DB+'::data',JSON.stringify({chats:state.chats,friends:state.friends,callsHistory:state.callsHistory,groups:state.groups,logs:state.logs.slice(-500),aiHistory:state.aiHistory.slice(-40)}))}catch(e){addLog?.('ERROR','storage save failed',e.message)}}
function load(){try{const d=JSON.parse(safeStore.get(DB+'::data','{}')||'{}');state.chats=Array.isArray(d.chats)?d.chats:[];state.friends=Array.isArray(d.friends)?d.friends:[];state.callsHistory=Array.isArray(d.callsHistory)?d.callsHistory:[];state.groups=Array.isArray(d.groups)?d.groups:[];state.logs=Array.isArray(d.logs)?d.logs:[];state.aiHistory=Array.isArray(d.aiHistory)?d.aiHistory:[]}catch(e){state.chats=[];state.friends=[];state.callsHistory=[];state.groups=[];state.logs=[];state.aiHistory=[]}}
load();
function loadSettings(){try{const x=JSON.parse(safeStore.get(LS.settings,'{}')||'{}');if(typeof x.host==='string'&&x.host)state.peerServerHost=x.host;if(Number.isInteger(x.port)&&x.port>0&&x.port<65536)state.peerServerPort=x.port;if(typeof x.path==='string'&&x.path)state.peerServerPath=x.path;if(typeof x.key==='string'&&x.key)state.peerServerKey=x.key;if(x.scheme==='ws'||x.scheme==='wss')state.peerScheme=x.scheme;if(Array.isArray(x.ports)&&x.ports.length)state.fallbackPorts=[...new Set(x.ports.map(Number).filter(v=>v>0&&v<65536))];if(typeof x.enabled==='boolean')state.fallbackEnabled=x.enabled;if(Number.isInteger(x.timeout)&&x.timeout>=1000)state.fallbackTimeoutMs=Math.min(x.timeout,15000)}catch(e){addLog?.('WARN','settings load failed',e.message)}}
function saveSettings(){const ok=safeStore.set(LS.settings,JSON.stringify({host:state.peerServerHost,port:state.peerServerPort,path:state.peerServerPath,key:state.peerServerKey,scheme:state.peerScheme,ports:state.fallbackPorts,enabled:state.fallbackEnabled,timeout:state.fallbackTimeoutMs}));if(!ok)toast('設定を保存できませんでした');}
loadSettings();
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.addEventListener('error',e=>{try{addLog('ERROR','uncaught error',`${e.message||'unknown'} @ ${e.filename||''}:${e.lineno||''}:${e.colno||''}`)}catch{}});
window.addEventListener('unhandledrejection',e=>{try{addLog('ERROR','unhandled rejection',String(e.reason?.message||e.reason||'unknown'))}catch{}});

function avatarText(n){return (n||'?').trim().slice(0,1).toUpperCase();}

/* ---------- diagnostics / secure local log ---------- */
function addLog(level,event,details=''){
  const item={time:new Date().toISOString(),level,event,details:String(details||'')};
  state.logs.push(item); if(state.logs.length>500)state.logs=state.logs.slice(-500);
  const line=`[${new Date(item.time).toLocaleTimeString()}] [${level}] ${event}${item.details?' — '+item.details:''}`;
  console.debug('[Secure Chat]',line);
  if($('logView')){$('logView').textContent=state.logs.map(x=>`[${new Date(x.time).toLocaleTimeString()}] [${x.level}] ${x.event}${x.details?' — '+x.details:''}`).join('\
');$('logView').scrollTop=$('logView').scrollHeight;}
}
function securityAlert(code,message){
  if(state.lastSecurityAlert===code)return;
  state.lastSecurityAlert=code;
  addLog('SECURITY','security warning',message);
  try{alert('⚠️ Secure Chat セキュリティ警告\
\
'+message+'\
\
これは傍受を断定するものではなく、安全な通信条件を確認できない状態を通知しています。')}catch{}
  toast('⚠️ セキュリティ警告');
}
async function monitorSecurity(pc=null){
  const problems=[];
  if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') problems.push('このページはHTTPS等の安全なコンテキストではありません。カメラ/マイクやWebRTCの安全性に影響する可能性があります。');
  if(!state.ws || state.ws.readyState!==WebSocket.OPEN) problems.push('シグナリング用WSSが接続されていません。接続先を確認してください。');
  if(pc){
    try{
      const stats=await pc.getStats();
      const dtls=[]; stats.forEach(r=>{if(r.type==='transport'&&r.dtlsState)dtls.push(r.dtlsState)});
      if(dtls.length&&dtls.every(s=>s==='failed'||s==='closed')) problems.push('WebRTCのDTLS暗号化トランスポートが正常状態ではありません。通話/データ接続を確認してください。');
    }catch(e){addLog('WARN','security stats check failed',e.message)}
  }
  if(problems.length) securityAlert(problems.join('|'),problems.join('\
'));
  return problems.length===0;
}
function openNameModal(){
  showModal(`<h3>👤 表示名</h3><p style="color:#667085;font-size:12px">相手に表示する名前を設定します。名前は端末内に保存されます。</p><div class="field"><label>表示名</label><input id="nameOnlyField" maxlength="40" value="${esc(state.name)}" placeholder="あなたの名前"></div><div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="saveNameOnly">保存</button></div>`);
  $('saveNameOnly').onclick=()=>{state.name=$('nameOnlyField').value.trim()||'ユーザー';safeStore.set(LS.name,state.name);$('topStatus').textContent=state.wsReady?'オンライン':'シグナリング切断';save();closeModal();toast('表示名を保存しました');addLog('INFO','display name changed')};
}


async function copyText(text){
  // HTTPS/localhost等でClipboard APIが使える場合
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){
    addLog('WARN','clipboard API failed',e.message);
  }
  // file:// 等でも使える可能性がある旧式フォールバック
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.opacity='0';
    ta.style.pointerEvents='none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){
    addLog('ERROR','clipboard fallback failed',e.message);
    return false;
  }
}

function wsStateText(){return state.ws?['CONNECTING','OPEN','CLOSING','CLOSED'][state.ws.readyState]||String(state.ws.readyState):'NONE'}
function collectConnectionSnapshot(){
  return [...state.connections.values()].map(c=>({remote:c.remote,kind:c.kind,state:c.pc.connectionState,ice:c.pc.iceConnectionState,gather:c.pc.iceGatheringState,sdp:c.pc.signalingState,dc:c.dc?.readyState||'-'}));
}
async function readIceStats(pc){
  const out={candidatePairs:[],localCandidates:[],remoteCandidates:[],codecs:[],inbound:[],outbound:[]};
  try{
    const stats=await pc.getStats();
    stats.forEach(r=>{
      if(r.type==='candidate-pair' && (r.state==='succeeded'||r.nominated)){
        out.candidatePairs.push({state:r.state,nominated:!!r.nominated,local:r.localCandidateId,remote:r.remoteCandidateId,protocol:r.protocol,bytesSent:r.bytesSent,bytesReceived:r.bytesReceived,rtt:r.currentRoundTripTime});
      } else if(r.type==='local-candidate') out.localCandidates.push({id:r.id,type:r.candidateType,protocol:r.protocol,address:r.address||r.ip,port:r.port,url:r.url});
      else if(r.type==='remote-candidate') out.remoteCandidates.push({id:r.id,type:r.candidateType,protocol:r.protocol,address:r.address||r.ip,port:r.port});
      else if(r.type==='codec') out.codecs.push({mime:r.mimeType,clock:r.clockRate});
      else if(r.type==='inbound-rtp') out.inbound.push({kind:r.kind,packetsLost:r.packetsLost,packetsReceived:r.packetsReceived});
      else if(r.type==='outbound-rtp') out.outbound.push({kind:r.kind,packetsLost:r.packetsLost,packetsSent:r.packetsSent});
    });
  }catch(e){addLog('ERROR','getStats failed',e.message);}
  return out;
}
async function runIceDiagnostic(targetPc=null){
  const report={startedAt:new Date().toISOString(),browser:navigator.userAgent,webRTC:!!window.RTCPeerConnection,webSocket:!!window.WebSocket,media:!!navigator.mediaDevices?.getUserMedia,wsState:wsStateText(),peerId:state.id,connections:collectConnectionSnapshot(),iceServers:['stun:stun.l.google.com:19302','turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478']};
  addLog('INFO','ICE diagnostic started',`WebSocket=${report.wsState}, connections=${report.connections.length}`);
  let pc=targetPc;
  let owned=false;
  try{
    if(!pc){
      owned=true;
      pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]});
      report.events=[];
      pc.onicecandidate=e=>addLog('INFO','diagnostic ICE candidate',e.candidate?`${e.candidate.type} ${e.candidate.protocol||''} ${e.candidate.address||''}:${e.candidate.port||''}`:'end-of-candidates');
      pc.onicecandidateerror=e=>addLog('WARN','diagnostic ICE candidate error',`${e.url||''} code=${e.errorCode||''} ${e.errorText||''}`);
      pc.onicegatheringstatechange=()=>addLog('INFO','ICE gathering state',pc.iceGatheringState);

      pc.onconnectionstatechange=()=>addLog('INFO','Peer connection state',pc.connectionState);
      pc.createDataChannel('ice-diagnostic');
      const offer=await pc.createOffer({offerToReceiveAudio:false,offerToReceiveVideo:false});
      await pc.setLocalDescription(offer);
      const deadline=Date.now()+8000;
      while(pc.iceGatheringState!=='complete' && Date.now()<deadline) await new Promise(r=>setTimeout(r,200));
    }
    report.after=collectConnectionSnapshot();
    report.stats=await readIceStats(pc);
    report.result={gathering:pc.iceGatheringState,ice:pc.iceConnectionState,connection:pc.connectionState};
    addLog('INFO','ICE diagnostic finished',`gather=${report.result.gathering}, ice=${report.result.ice}, localCandidates=${report.stats.localCandidates.length}`);
  }catch(e){report.error=e.message;addLog('ERROR','ICE diagnostic failed',e.message)}

}

/* ---------- WebCrypto application-layer encryption ---------- */
const enc=new TextEncoder(), dec=new TextDecoder();
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
function b64(u){return btoa(String.fromCharCode(...new Uint8Array(u)));}
function u8(s){const x=atob(s);return Uint8Array.from(x,c=>c.charCodeAt(0));}
async function encryptJSON(obj,pass){if(!pass)throw Error('共有パスフレーズを設定してください');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return {v:2,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',salt:b64(salt),iv:b64(iv),ct:b64(ct)};}
async function decryptJSON(packet,pass){const key=await deriveKey(pass,u8(packet.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(packet.iv)},key,u8(packet.ct));return JSON.parse(dec.decode(pt));}

/* ---------- PeerServer signalling subset, written independently ---------- */
function wsUrl(host=state.peerServerHost,port=state.peerServerPort){return `${state.peerScheme}://${host}:${port}${state.peerServerPath}peerjs?key=${encodeURIComponent(state.peerServerKey)}&id=${encodeURIComponent(state.id)}&token=${encodeURIComponent(state.peerToken)}&version=1.5.5`;}
function signalSend(m){if(state.ws&&state.ws.readyState===1){state.ws.send(JSON.stringify(m));addLog('SIGNAL',`send ${m.type}`,m.dst?`to=${m.dst}`:'');return true}addLog('WARN','signal send skipped','WebSocket not open');return false}
function connectSignal(){clearTimeout(state.signalRetryTimer);state.fallbackTried=false;const primary=state.peerServerPort;const candidates=state.fallbackEnabled?[primary,...state.fallbackPorts.filter(p=>p!==primary)]:[primary];let index=0;state.ws=null;state.wsReady=false;$('topStatus').textContent='接続中…';const next=()=>{if(index>=candidates.length){state.wsReady=false;$('topStatus').textContent='接続失敗';$('topStatus').className='danger-text';addLog('ERROR','signaling failed',JSON.stringify(candidates));monitorSecurity();return}const port=candidates[index++];state.peerServerPort=port;const url=wsUrl(state.peerServerHost,port);addLog('INFO','trying signaling endpoint',`${state.peerScheme}://${state.peerServerHost}:${port}`);let opened=false,done=false;let sock;try{sock=new WebSocket(url)}catch(e){addLog('WARN','WebSocket constructor failed',`port=${port}`);setTimeout(next,50);return}state.ws=sock;const timer=setTimeout(()=>{if(done)return;done=true;try{sock.close()}catch{}addLog('WARN','signaling endpoint timeout',`port=${port}`);if(state.fallbackEnabled){state.fallbackTried=true;next()}},state.fallbackTimeoutMs);sock.onopen=()=>{if(done)return;done=true;opened=true;clearTimeout(timer);state.wsReady=true;state.activeEndpoint={scheme:state.peerScheme,host:state.peerServerHost,port};saveSettings();$('topStatus').textContent=`オンライン · ${port}`;$('topStatus').className='online';addLog('INFO','WebSocket open',url.replace(state.peerToken,'***'));monitorSecurity()};sock.onerror=()=>addLog('WARN','WebSocket error',`port=${port}`);sock.onclose=()=>{clearTimeout(timer);if(!opened){if(!done){done=true;if(state.fallbackEnabled){state.fallbackTried=true;next()}}return}state.wsReady=false;$('topStatus').textContent='シグナリング切断';$('topStatus').className='danger-text';addLog('WARN','WebSocket close',`port=${port}`)};sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handleSignal(m)}};next()}
function handleSignal(m){
  const type=m.type, p=m.payload||{}, src=m.src;
  addLog('SIGNAL',`recv ${type}`,src?`from=${src}`:'');
  if(type==='OPEN'){state.wsReady=true;$('topStatus').textContent='オンライン';$('topStatus').className='online';return;}
  if(type==='ID-TAKEN'){toast('Peer IDが使用中です。ページを更新して再取得してください');return;}
  if(type==='PEER-UNAVAILABLE'||type==='EXPIRE'){toast('相手のPeer IDが見つかりません');return;}
  if(!src)return;
  const key=src+'::'+(p.connectionId||'');
  let c=state.connections.get(key)||state.connections.get(src);
  if(type==='OFFER'){
    c=makeRTCPeer(src,p.connectionId,p.type==='media'?'media':'data',false,p);
    state.connections.set(key,c);
    if(p.type==='media') incomingCall(c,p.metadata); else incomingDataOffer(c,p);
    return;
  }
  if(c) handleRTCSignal(c,m);
}
function makePC(remote,connectionId,kind,initiator,meta){
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}],sdpSemantics:'unified-plan'});
  const c={remote,connectionId,kind,pc,dc:null,initiator,meta,remoteStream:new MediaStream(),pendingCandidates:[]};
  addLog('INFO','RTCPeerConnection created',`kind=${kind}, remote=${remote}`);
  pc.onicecandidate=e=>{if(e.candidate){addLog('ICE','candidate',`${e.candidate.candidateType||''} ${e.candidate.protocol||''} ${e.candidate.address||''}`);signalSend({type:'CANDIDATE',payload:{candidate:e.candidate,connectionId},dst:remote});}else addLog('ICE','candidate gathering complete',`remote=${remote}`);};
  pc.onicecandidateerror=e=>addLog('WARN','ICE candidate error',`remote=${remote}, code=${e.errorCode||''}, url=${e.url||''}, ${e.errorText||''}`);
  pc.onicegatheringstatechange=()=>addLog('ICE','gathering state',`${remote}: ${pc.iceGatheringState}`);
  pc.oniceconnectionstatechange=()=>{addLog('ICE','connection state',`${remote}: ${pc.iceConnectionState}`);if(pc.iceConnectionState==='failed')readIceStats(pc).then(st=>addLog('ICE','failure stats',JSON.stringify({local:st.localCandidates.length,remote:st.remoteCandidates.length,pairs:st.candidatePairs.length})));};

  pc.onsignalingstatechange=()=>addLog('RTC','signaling state',`${remote}: ${pc.signalingState}`);
  pc.ontrack=e=>{addLog('MEDIA','remote track',`${remote}: ${e.track.kind}`);if(kind==='media'){$('remoteVideo').srcObject||($('remoteVideo').srcObject=c.remoteStream);c.remoteStream.addTrack(e.track)}};

async function testSinglePort(port){

    const t0=performance.now();let finished=false;let sock;
    try{sock=new WebSocket(wsUrl(state.peerServerHost,port))}catch(e){resolve({port,ok:false,ms:0,error:'constructor'});return}
    const timeout=setTimeout(()=>{if(finished)return;finished=true;try{sock.close()}catch{}resolve({port,ok:false,ms:Math.round(performance.now()-t0),error:'timeout'})},Math.min(state.fallbackTimeoutMs,5000));
    sock.onopen=()=>{if(finished)return;finished=true;clearTimeout(timeout);const ms=Math.round(performance.now()-t0);try{sock.close()}catch{}resolve({port,ok:true,ms})};
    sock.onerror=()=>{if(finished)return;finished=true;clearTimeout(timeout);try{sock.close()}catch{}resolve({port,ok:false,ms:Math.round(performance.now()-t0),error:'error'})};
  });
}

 {keys:['peerid','peer id','id','6桁','更新','リロード'],tag:'identity',answer:()=>`現在のPeer IDは ${state.id}。6桁のIDをlocalStorageへ保存し、次回ロード時に同じ値を再利用します。保存領域が利用できない環境でも、画面上は動作を続けますが永続化は保証できません。`},
 {keys:['ice','stun','turn','candidate','nat'],tag:'ice',answer:()=>`ICE診断ではICE gathering/connection state、host/srflx/relay候補、candidate error、RTTを確認できます。設定から実行できます。relayだけならTURN経路、srflxが無ければSTUN到達性やNAT/ネットワーク制限を確認してください。`},
 {keys:['port','ポート','wss','websocket','接続先','フォールバック'],tag:'network',answer:()=>`現在のシグナリング先は ${state.peerServerHost}:${state.peerServerPort} (${state.peerScheme})。自動フォールバックは ${state.fallbackEnabled?'ON':'OFF'}。OFFなら勝手に切り替えません。設定の「接続先をテスト」は診断だけです。`},
 {keys:['call','通話','ビデオ','カメラ','マイク'],tag:'call',answer:()=>`ビデオ通話は相手を選んで📹。通話中は🎙️/📷で音声・映像を切替。ブラウザのカメラ・マイク権限が必要です。`},
 {keys:['log','ログ','エラー','診断'],tag:'logs',answer:()=>`ログにはINFO/WARN/ERROR/RTC/ICE/CALLなどを記録します。メッセージ本文、パスフレーズ、暗号鍵はログへ入れない設計です。`},
 {keys:['security','安全','傍受','盗聴','暗号'],tag:'security',answer:()=>`Secure ChatはWebRTCのDTLSやWSS、ICE状態を監視し、異常を危険兆候として知らせます。ただしブラウザ単体では「誰かが傍受している」と断定はできません。`},
 {keys:['name','名前','表示名'],tag:'name',answer:()=>`現在の表示名は「${state.name}」。左上の「名前設定」から変更できます。`},
 {keys:['hello','こんにちは','help','使い方','何ができる'],tag:'help',answer:()=>`私はSecureAIです。Secure Chatの現在状態を参照しながら、ID、ICE、ポート、フォールバック、通話、ログ、セキュリティについて案内します。`}
];
function aiScore(q,keys){const text=aiNormalize(q);let score=0;for(const k of keys){const n=aiNormalize(k);if(!n)continue;if(text.includes(n))score+=n.length>2?3:1;const toks=aiTokens(n);for(const t of toks){if(t&&text.includes(t))score+=1}}return score}
function secureAIAnswer(q){
  const text=String(q||'').trim();if(!text)return '質問を入力してください。';
  const normalized=aiNormalize(text);
  if(/^(設定|せってい)$/.test(normalized)){showSettings();return '設定を開きました。';}
  if(/^(iceテスト|ice 診断|ice診断)$/.test(normalized)){runIceDiagnostic();return 'ICE診断を開始しました。';}
  if(/^(ログ|log)$/.test(normalized)){showLogs();return 'ログを開きました。';}
  if(/^(状態|ステータス|status)$/.test(normalized)){return `WSS=${state.wsReady?'接続':'未接続'} / PeerID=${state.id} / 相手=${state.selected||'なし'} / 通話=${[...state.calls.values()].length?'あり':'なし'} / fallback=${state.fallbackEnabled?'ON':'OFF'}`;}
  const ranked=AI_KB.map(x=>({...x,score:aiScore(text,x.keys)})).sort((a,b)=>b.score-a.score);
  const best=ranked[0];
  if(best?.score>=2)return best.answer();
  if(/今|現在|状態|status|どう/.test(aiNormalize(text))){
    return `現在状態: ${state.wsReady?'WSS接続中':'WSS未接続'} / WebRTC=${!!window.RTCPeerConnection} / PeerID=${state.id} / 選択相手=${state.selected||'なし'} / フォールバック=${state.fallbackEnabled?'ON':'OFF'}`;
  }
  return `その質問はまだ私のローカル知識ベースにありません。SecureAIは外部APIを使わず、このHTML内の知識とSecure Chatの実行状態から回答します。現在は「ID」「ICE」「ポート」「フォールバック」「通話」「ログ」「セキュリティ」「名前」に対応しています。`;
}

function openSecureAI(){
  showModal(`<h3>🤖 SecureAI</h3><p style="color:#667085;font-size:12px">外部APIなし。このHTML内のローカルAIエンジンが、会話履歴とSecure Chatの現在状態を参照します。</p><div id="aiChat" class="ai-chat"></div><div class="field"><label>質問</label><input id="aiInput" maxlength="500" placeholder="例：今のICE状態を教えて"></div><div class="actions"><button class="btn" data-close>閉じる</button><button class="btn primary" id="aiAsk">質問する</button></div>`);
  const chat=$('aiChat');
  const history=state.aiHistory.slice(-12);
  if(!history.length){chat.insertAdjacentHTML('beforeend','<div class="ai-msg bot">こんにちは！SecureAIです 🤖<br>Secure Chatの状態、ICE、ポート、通話、ログなどを質問できます。</div>')}
  history.forEach(m=>chat.insertAdjacentHTML('beforeend',`<div class="ai-msg ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`));
  const ask=()=>{
    try{
      const input=$('aiInput');if(!input)return;const q=input.value.trim();if(!q)return;
      const answer=secureAIAnswer(q);
      state.aiHistory.push({role:'user',text:q,time:Date.now()});
      state.aiHistory.push({role:'bot',text:answer,time:Date.now()});
      state.aiHistory=state.aiHistory.slice(-40);save();
      chat.insertAdjacentHTML('beforeend',`<div class="ai-msg user">${esc(q)}</div><div class="ai-msg bot">${esc(answer)}</div>`);
      chat.scrollTop=chat.scrollHeight;input.value='';input.focus();
    }catch(e){addLog('ERROR','SecureAI failed',e.message);toast('SecureAIでエラーが発生しました')}
  };
  $('aiAsk').onclick=ask;
  $('aiInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ask()}};
}

/* ---------- UI ---------- */
function renderList(){const tab=document.querySelector('.tabs button.active')?.dataset.tab||'chats',q=$('search').value.trim().toLowerCase(),list=$('list');let html='';if(tab==='friends'){state.friends.filter(f=>(f.name+' '+f.id).toLowerCase().includes(q)).forEach(f=>html+=`<button class="item ${state.selected===f.id?'active':''}" data-peer="${esc(f.id)}"><span class="avatar">${esc(avatarText(f.name))}</span><span class="txt"><strong>${esc(f.name)}</strong><p>${esc(f.id)}</p></span></button>`);if(!html)html='<div style="padding:20px;color:#667085;font-size:13px">まだフレンドがいません。</div>'}
else if(tab==='history'){state.callsHistory.forEach(c=>html+=`<div class="item"><span class="avatar">☎</span><span class="txt"><strong>${esc(contactName(c.id))}</strong><p>${c.direction==='outgoing'?'発信':'着信'}・${new Date(c.time).toLocaleString()}</p></span></div>`);if(!html)html='<div style="padding:20px;color:#667085;font-size:13px">通話履歴はありません。</div>'}
else{const ids=[...new Set(state.chats.map(c=>c.peer))];ids.filter(id=>!q||contactName(id).toLowerCase().includes(q)||id.includes(q)).forEach(id=>{const arr=state.chats.filter(c=>c.peer===id);const x=arr.at(-1);html+=`<button class="item ${state.selected===id?'active':''}" data-peer="${esc(id)}"><span class="avatar">${esc(avatarText(contactName(id)))}</span><span class="txt"><strong>${esc(contactName(id))}</strong><p>${esc(x?.text||'会話を開始')}</p></span><span class="time">${x?new Date(x.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</span></button>`});state.friends.filter(f=>!ids.includes(f.id)&&(!q||f.name.toLowerCase().includes(q)||f.id.includes(q))).forEach(f=>html+=`<button class="item" data-peer="${esc(f.id)}"><span class="avatar">${esc(avatarText(f.name))}</span><span class="txt"><strong>${esc(f.name)}</strong><p>新しいチャット</p></span></button>`);if(!html)html='<div style="padding:20px;color:#667085;font-size:13px">チャットを選択するか、＋から相手を追加してください。</div>'}
list.innerHTML=html;list.querySelectorAll('[data-peer]').forEach(e=>e.onclick=()=>selectPeer(e.dataset.peer));}
function renderChat(peer){state.selected=peer;$('topName').textContent=contactName(peer);$('topAvatar').textContent=avatarText(contactName(peer));$('topStatus').textContent=(state.connections.get(peer)?'P2P接続済み':'未接続・接続ボタンから開始');const chat=$('chat');const arr=state.chats.filter(c=>c.peer===peer);chat.innerHTML='<div class="notice">🔒 アプリ層暗号化チャット</div>';if(!arr.length){chat.innerHTML+='<div class="empty"><b>'+esc(contactName(peer))+'</b> との会話を開始しましょう。</div>'}arr.forEach(m=>{const mine=m.from===state.id;chat.insertAdjacentHTML('beforeend',`<div class="bubble ${mine?'mine':'theirs'}"><div class="msg">${esc(m.text)}</div><div class="meta">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`)});chat.scrollTop=chat.scrollHeight;}
function selectPeer(peer){state.selected=peer;renderChat(peer);renderList();}
function showModal(content){$('panel').innerHTML=content;$('modal').classList.add('show');$('panel').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){$('modal').classList.remove('show')}

$('myId').textContent=state.id;$('settingsBtn').onclick=showSettings;$('aiBtn').onclick=openSecureAI;$('aiChatBtn').onclick=openSecureAI;$('nameBtn').onclick=openNameModal;$('copyId').onclick=async()=>{const ok=await copyText(state.id);toast(ok?'Peer IDをコピーしました':'コピーできませんでした。IDを選択して手動でコピーしてください')};$('inviteBtn').onclick=()=>{const u=new URL(location.href);u.hash='peer='+state.id;copyText(u.toString());showModal(`<h3>招待リンク</h3><p style="color:#667085">このリンクを共有すると、相手側にあなたのPeer IDがセットされます。</p><div class="field"><input id="inviteField" value="${esc(u.toString())}" readonly></div><div class="actions"><button class="btn" data-close>閉じる</button><button class="btn primary" id="copyInvite">コピー</button></div>`);$('copyInvite').onclick=async()=>{const ok=await copyText(u.toString());toast(ok?'招待リンクをコピーしました':'コピーできませんでした。リンクを選択して手動でコピーしてください')}};
$('friendBtn').onclick=()=>showModal(`<h3>フレンド追加</h3><div class="field"><label>Peer ID（6桁）</label><input id="peerField" inputmode="numeric" maxlength="6" placeholder="123456"></div><div class="field"><label>相手の表示名（任意）</label><input id="friendNameField" placeholder="友だち"></div><div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="addFriend">追加して接続</button></div>`);
$('groupBtn').onclick=()=>showModal(`<h3>グループチャット</h3><p style="color:#667085">この単一HTML版では、グループは端末内の会話コンテナとして管理し、参加者ごとのP2P接続へ個別送信します。</p><div class="field"><label>グループ名</label><input id="groupName" placeholder="グループ"></div><div class="field"><label>参加者Peer ID（カンマ区切り）</label><textarea id="groupPeers" placeholder="123456,234567"></textarea></div><div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="createGroup">作成</button></div>`);
$('createGroup')?.addEventListener('click',()=>{const name=$('groupName').value.trim()||'グループ',peers=$('groupPeers').value.split(',').map(x=>x.trim()).filter(Boolean);state.groups.push({id:crypto.randomUUID(),name,peers,created:Date.now()});save();closeModal();toast('グループを作成しました');});
$('addFriend')?.addEventListener('click',()=>{const id=$('peerField').value.trim(),name=$('friendNameField').value.trim()||id;if(!/^\d{6}$/.test(id)){toast('6桁のPeer IDを入力してください');return}addFriend(id,name,false);connectData(id);closeModal();selectPeer(id);});
$('callBtn').onclick=()=>{if(!state.selected){toast('相手を選択してください');return}callPeer(state.selected)};$('send').onclick=()=>doSend();$('message').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();doSend()}};
function doSend(){const text=$('message').value.trim();const peer=state.selected;if(!text||!peer)return;const obj={type:'chat',text};if(!sendPacket(peer,obj))return;state.chats.push({id:crypto.randomUUID(),peer,from:state.id,text,time:Date.now()});state.chats=state.chats.slice(-1000);save();$('message').value='';renderChat(peer);renderList();}
$('logBtn').onclick=showLogs;$('iceBtn').onclick=()=>runIceDiagnostic();$('micBtn').onclick=()=>{const t=state.localStream?.getAudioTracks?.()[0];if(t){t.enabled=!t.enabled;$('micBtn').textContent=t.enabled?'🎙️':'🔇'}};$('camBtn').onclick=()=>{const t=state.localStream?.getVideoTracks?.()[0];if(t){t.enabled=!t.enabled;$('camBtn').textContent=t.enabled?'📷':'🚫'}};$('switchCamBtn').onclick=()=>toast('Chromebookではカメラ切替デバイス選択を次版で追加できます');$('hangBtn').onclick=()=>{hangup();toast('通話を終了しました')};$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderList()});$('search').oninput=renderList;

function bootInvite(){const m=location.hash.match(/peer=(\d{6})/);if(m){setTimeout(()=>{$('friendBtn').click();setTimeout(()=>{$('peerField').value=m[1]},0)},150)}}
addLog('INFO','Secure Chat boot',`Peer ID=${state.id}`);if(safeStore.get(LS.id,'')!==state.id)addLog('WARN','Peer ID persistence unavailable','localStorage is blocked or unavailable');addLog('INFO','SecureAI engine','embedded-local-v2');addLog('INFO','fallback mode',`enabled=${state.fallbackEnabled}; ports=${state.fallbackPorts.join(',')}`);addLog('INFO','WebRTC support',`${!!window.RTCPeerConnection}; getUserMedia=${!!navigator.mediaDevices?.getUserMedia}`);connectSignal();renderList();bootInvite();setTimeout(()=>monitorSecurity(),1500);
window.addEventListener('beforeunload',()=>{try{state.ws?.close()}catch{}save()});
</script>
