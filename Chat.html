<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<meta name="description" content="Secure Chat">
<title>Secure Chat</title>

<style>
:root{
  --green:#06c755;
  --green2:#00a948;
  --bg:#efeae2;
  --surface:#fff;
  --surface2:#f7f8fa;
  --surface3:#eef1f4;
  --ink:#17202a;
  --muted:#667085;
  --line:#e5e7eb;
  --danger:#ef4444;
  --warning:#f59e0b;
  --blue:#4f8cff;
  --shadow:0 22px 70px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{
  height:100dvh;
  display:grid;
  grid-template-columns:330px minmax(0,1fr);
}
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-width:0;
}
.brand{
  height:64px;
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  font-weight:900;
}
.brand h1{font-size:17px;margin:0}
.brand small{font-size:11px;color:var(--muted)}
.me{
  margin:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--surface2);
}
.peerid{
  margin-top:3px;
  font:800 17px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.14em;
}
.my-actions,.mini-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:9px;
}
.search{padding:0 12px 10px}
.search input{
  width:100%;
  height:40px;
  border:0;
  outline:none;
  border-radius:13px;
  background:var(--surface3);
  padding:0 13px;
}
.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
}
.tabs button{
  flex:1;
  border:0;
  background:var(--surface);
  color:var(--muted);
  padding:10px 5px;
}
.tabs button.active{
  color:var(--green2);
  font-weight:800;
  border-bottom:2px solid var(--green);
}
.list{
  flex:1;
  overflow:auto;
}
.item{
  width:100%;
  border:0;
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  text-align:left;
}
.item:hover{background:#f7f8fa}
.item.active{background:#eaf9ef}
.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#dbeafe,#ede9fe);
  font-weight:900;
  flex:none;
}
.item .txt{flex:1;min-width:0}
.item strong{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.item p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.item .time{
  color:#98a2b3;
  font-size:10px;
}
.main{
  min-width:0;
  display:grid;
  grid-template-rows:64px auto minmax(0,1fr) auto;
}
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 14px;
}
.top-title{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}
.top-title .avatar{
  width:40px;
  height:40px;
}
.top-title h2{
  margin:0;
  font-size:16px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.top-title small{
  display:block;
  color:var(--muted);
  font-size:11px;
}
.top-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:6px;
}
.iconbtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#f1f3f5;
}
.actionbar{
  display:none;
  flex-wrap:wrap;
  gap:7px;
  padding:8px 11px;
  background:#f8fafc;
  border-bottom:1px solid var(--line);
}
.actionbar button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:7px 10px;
  font-size:12px;
}
.chat{
  min-height:0;
  overflow:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.5),transparent 32%),
    var(--bg);
}
.notice{
  align-self:center;
  border-radius:12px;
  background:rgba(255,255,255,.76);
  color:#667085;
  padding:6px 10px;
  font-size:11px;
}
.empty{
  max-width:560px;
  margin:auto;
  padding:30px;
  text-align:center;
  color:var(--muted);
  line-height:1.7;
}
.message-row{
  display:flex;
  align-items:flex-end;
}
.message-row.mine{justify-content:flex-end}
.message-row.theirs{justify-content:flex-start}
.message-shell{
  max-width:min(78%,760px);
}
.bubble{
  border-radius:13px;
  padding:9px 11px;
  line-height:1.48;
  overflow-wrap:anywhere;
  box-shadow:0 1px 2px rgba(0,0,0,.07);
  background:#fff;
}
.mine .bubble{
  background:#d9fdd3;
  border-top-right-radius:4px;
}
.theirs .bubble{
  border-top-left-radius:4px;
}
.msg-content p{margin:.2em 0 .65em}
.msg-content p:last-child{margin-bottom:0}
.msg-content pre{
  margin:7px 0;
  border-radius:10px;
  background:#111827;
  color:#e5e7eb;
  padding:10px;
  overflow:auto;
  font:12px/1.45 ui-monospace,monospace;
}
.msg-content code{
  background:#111827;
  color:#fff;
  border-radius:5px;
  padding:1px 4px;
  font:12px ui-monospace,monospace;
}
.msg-content ul{
  padding-left:20px;
}
.mention{
  color:#008a40;
  font-weight:800;
}
.message-meta{
  padding:3px 4px 0;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:10px;
  color:#7b8190;
}
.reactions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:5px;
}
.reaction{
  border:1px solid #d8dde3;
  background:#fff;
  border-radius:999px;
  padding:2px 7px;
  font-size:11px;
}
.attachment{
  margin-top:7px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.76);
  border-radius:11px;
  padding:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.attachment-preview{
  max-width:260px;
  max-height:200px;
  object-fit:contain;
  border-radius:10px;
}
.replybar{
  display:none;
  padding:7px 10px 0;
  gap:7px;
}
.replybar.show{display:flex}
.reply-pill{
  flex:1;
  padding:8px 10px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  font-size:11px;
}
.composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:10px;
  background:var(--surface2);
  border-top:1px solid var(--line);
}
.composer textarea{
  flex:1;
  min-height:50px;
  max-height:180px;
  resize:none;
  border:0;
  outline:none;
  border-radius:14px;
  padding:11px 13px;
  background:#fff;
}
.btn{
  border:0;
  border-radius:11px;
  padding:9px 12px;
  background:#eef2f7;
  font-weight:650;
}
.btn.primary{background:var(--green);color:#fff}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.ghost{background:transparent}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(15,23,42,.56);
}
.modal.show{display:flex}
.panel{
  width:min(960px,100%);
  max-height:92dvh;
  overflow:auto;
  border-radius:22px;
  background:#fff;
  box-shadow:var(--shadow);
  padding:17px;
}
.panel h3{margin:0 0 7px}
.panel h4{margin:18px 0 7px}
.help{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.field{margin-top:10px}
.field label{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:12px;
}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 10px;
  background:#fff;
  outline:none;
}
.field textarea{
  min-height:90px;
  resize:vertical;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:7px;
  margin-top:15px;
}
.card{
  padding:11px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#f7f8fa;
}
.card b{font-size:12px}
.card small{
  display:block;
  color:var(--muted);
  line-height:1.5;
  margin-top:4px;
}
.feature-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.feature-card{
  border:1px solid var(--line);
  border-radius:13px;
  padding:9px;
  background:#fff;
}
.feature-card label{
  display:flex;
  gap:8px;
  align-items:flex-start;
}
.feature-card b{font-size:12px}
.feature-card small{
  display:block;
  color:var(--muted);
  margin-top:2px;
  line-height:1.45;
}
.pill{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:999px;
  background:#eef2f7;
  color:#475467;
  font-size:11px;
}
.pill.ok{background:#dcfce7;color:#166534}
.pill.warn{background:#fef3c7;color:#92400e}
.pill.bad{background:#fee2e2;color:#991b1b}
.logbox,.codebox{
  border-radius:12px;
  background:#07111f;
  color:#d9e4f5;
  padding:10px;
  font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;
  overflow:auto;
}
.logbox{height:300px}
.codebox{max-height:360px}
.ai-layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(220px,.8fr);
  gap:10px;
}
.ai-chat{
  height:400px;
  overflow:auto;
  padding:10px;
  border-radius:14px;
  background:#f7f8fa;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.ai-msg{
  max-width:88%;
  border-radius:12px;
  padding:9px 11px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.ai-msg.user{
  align-self:flex-end;
  background:#d9fdd3;
}
.ai-msg.bot{
  align-self:flex-start;
  background:#fff;
  border:1px solid var(--line);
}
.ai-thinking{
  display:flex;
  align-items:center;
  gap:8px;
}
.ai-orb{
  width:28px;
  height:28px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#111827;
  color:#fff;
  animation:pulse 1.05s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
.stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px dashed #e5e7eb;
  font-size:12px;
}
.stat:last-child{border-bottom:0}
.progress{
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#e5e7eb;
}
.progress div{
  height:100%;
  width:0;
  background:var(--green);
}
.video-stage{
  display:none;
  position:fixed;
  inset:0;
  z-index:150;
  background:#030712;
}
.video-stage.show{display:block}
.remote-video{
  width:100%;
  height:100%;
  object-fit:contain;
}
.local-video{
  position:absolute;
  top:15px;
  right:15px;
  width:min(29vw,280px);
  aspect-ratio:16/9;
  object-fit:cover;
  border:2px solid #fff;
  border-radius:14px;
  background:#111827;
}
.call-name{
  position:absolute;
  top:15px;
  left:15px;
  padding:8px 10px;
  background:rgba(17,24,39,.66);
  color:#fff;
  border-radius:11px;
  font-weight:800;
}
.callbar{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  gap:9px;
  padding:9px;
  background:rgba(17,24,39,.8);
  border-radius:18px;
  backdrop-filter:blur(12px);
}
.callbar button{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#374151;
  color:#fff;
}
.callbar .hang{background:var(--danger)}
.context-menu{
  position:fixed;
  display:none;
  z-index:300;
  min-width:190px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  box-shadow:0 20px 55px rgba(0,0,0,.18);
  padding:5px;
}
.context-menu.show{display:block}
.context-menu button{
  width:100%;
  text-align:left;
  border:0;
  background:#fff;
  border-radius:8px;
  padding:8px 9px;
}
.context-menu button:hover{background:#f4f5f7}
.subtle{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.warnbox{
  border-radius:12px;
  border:1px solid #fed7aa;
  color:#9a3412;
  background:#fff7ed;
  padding:9px;
  font-size:11px;
  line-height:1.5;
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
}
@media(max-width:760px){
  .grid2,.grid3,.feature-grid,.ai-layout{
    grid-template-columns:1fr;
  }
  .message-shell{max-width:91%}
  .local-video{
    width:155px;
    right:10px;
    top:58px;
  }
}

.sc-version-corner{position:fixed;right:7px;bottom:5px;z-index:500;color:#98a2b3;font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.58;pointer-events:none;user-select:none}
.ai-wide-btn{min-width:142px;justify-content:center;letter-spacing:.01em}
.top-actions .ai-wide-btn{width:auto;height:38px;border-radius:12px;padding:0 14px;font-weight:800}
.sticker-dock{display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 35px rgba(0,0,0,.08);padding:10px;max-height:290px;overflow:auto}
.sticker-dock.show{display:block}
.sticker-dock-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sticker-dock-title{font-size:12px;font-weight:800}
.sticker-grid-line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.sticker-tile{border:0;background:transparent;border-radius:14px;padding:7px;min-height:74px;cursor:pointer;display:grid;place-items:center;transition:.15s transform,.15s background}
.sticker-tile:hover{background:var(--surface2);transform:translateY(-1px)}
.sticker-tile img{width:100%;height:88px;object-fit:contain;display:block}
.sticker-empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:12px}
.sticker-create{display:flex;gap:7px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.sticker-create .btn{flex:none}
.sticker-message-img{display:block;width:min(220px,60vw);max-height:220px;object-fit:contain;border-radius:14px}
.ai-quick-examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ai-quick-examples button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 9px;font-size:11px}
.ai-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}
.ai-kpi .card{padding:8px}
.ai-kpi b{display:block;font-size:13px}
.ai-kpi small{color:var(--muted)}
@media(max-width:760px){.sticker-grid-line{grid-template-columns:repeat(3,minmax(0,1fr))}.sticker-dock{max-height:250px}.sticker-tile img{height:78px}}


/* direct peer / profile / diagnostics */
.peer-connect{margin:0 12px 10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.peer-connect-row{display:flex;gap:7px;align-items:center}
.peer-connect-row input{min-width:0;flex:1;height:38px;border:1px solid var(--line);border-radius:11px;padding:0 10px;background:var(--surface);color:var(--ink);outline:none}
.peer-connect-row .btn{height:38px;white-space:nowrap}
.peer-connect small{display:block;margin-top:6px;color:var(--muted);font-size:10px;line-height:1.45}
.list-connect{display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-size:11px;font-weight:800;color:var(--green2);cursor:pointer}
.list-connect:hover{filter:brightness(.96)}
.profile-card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center}
.profile-avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-size:32px;font-weight:900;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.test-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.test-row:last-child{border-bottom:0}
.test-detail{color:var(--muted);font-size:11px;text-align:right}
.test-ok{color:#166534}.test-warn{color:#92400e}
@media(max-width:760px){.peer-connect-row{gap:5px}.list-connect{padding:4px 6px}.profile-card{grid-template-columns:64px 1fr}.profile-avatar{width:64px;height:64px}}
</style>
</head>

<body>

<div class="app">
  <aside class="sidebar">

    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Secure Chat</h1>
        <small>P2P Messenger + AI</small>
      </div>
    </div>

    <section class="me">
      <div style="font-size:11px;color:#667085">
        あなたのPeer ID
      </div>

      <div id="myId" class="peerid">
        ------
      </div>

      <div class="subtle" style="margin-top:4px">
        🔒 6桁・端末内に保存
      </div>

      <div class="my-actions">
        <button class="btn primary ai-wide-btn" id="openAiQuick">
          🤖 SecureAI
        </button>
        <button class="btn" id="copyId">
          IDコピー
        </button>
        <button class="btn" id="nameBtn">
          名前
        </button>
        <button class="btn" id="profileBtn">
          👤 プロフィール
        </button>
        <button class="btn" id="inviteBtn">
          招待
        </button>
      </div>
    </section>

    <section class="peer-connect">
      <div style="font-size:11px;color:#667085;margin-bottom:6px">直接P2P接続</div>
      <div class="peer-connect-row">
        <input id="directPeerId" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="相手のPeer ID（6桁）">
        <button class="btn primary" id="directConnectBtn" type="button">接続</button>
      </div>
      <small>フレンド登録をせず、Peer IDだけで接続できます。</small>
    </section>

    <div class="search">
      <input
        id="search"
        placeholder="チャット・フレンドを検索"
      >
    </div>

    <div class="tabs">
      <button class="active" data-tab="chats">
        チャット
      </button>
      <button data-tab="friends">
        フレンド
      </button>
      <button data-tab="history">
        履歴
      </button>
    </div>

    <div class="direct-peer-side">
      <div class="direct-peer-label">🔗 Peer IDで直接接続</div>

function uid(prefix='id'){
  if(crypto.randomUUID){
    return prefix+'_'+crypto.randomUUID();

  const x=new Uint32Array(3);
  crypto.getRandomValues(x);

  return prefix+'_'+[
    x[0].toString(36),
    x[1].toString(36),
    x[2].toString(36)
  ].join('');
}

function randHex(bytes=24){

}

function esc(v){

    c=>({

      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',

function formatBytes(n){
  n=Number(n)||0;

  const units=[
    'B',
    'KB',
    'MB',
    'GB',
    'TB'
  ];

  let i=0;
  let x=n;

  while(
    x>=1024 &&
    i<units.length-1
  ){
    x/=1024;
    i++;
  }

  return `${x.toFixed(
    x>=10||i===0?0:1
  )} ${units[i]}`;
}

async function copyText(text){

      await navigator.clipboard.writeText(
        String(text)
      );
      return true;
    }
  }catch{}

    document.body.appendChild(t);

    t.select();

    const ok=document.execCommand('copy');

    t.remove();

    return ok;
  }catch{

  }

/* =========================================================
   IndexedDB
   ========================================================= */

class Database{
  constructor(name,version){
    this.name=name;
    this.version=version;
    this.db=null;
  }

  async open(){
    if(this.db){
      return this.db;
    }

    this.db=await new Promise(
      (resolve,reject)=>{
        const req=
          indexedDB.open(
            this.name,
            this.version
          );

        req.onupgradeneeded=()=>{
          const db=req.result;
          const tx=req.transaction;

          const storeNames=[
            'messages',
            'friends',
            'groups',
            'calls',
            'logs',
            'stickers',
            'customEmojis',
            'aiMemory',
            'aiIndex',
            'meta'
          ];

          for(
            const name of storeNames
          ){
            if(
              !db.objectStoreNames.contains(
                name
              )
            ){
              db.createObjectStore(
                name,
                {keyPath:'id'}
              );
            }
          }

          const messages=
            tx.objectStore(
              'messages'
            );

          if(
            !messages.indexNames.contains(
              'peerTime'
            )
          ){
            messages.createIndex(
              'peerTime',
              ['peer','time'],
              {unique:false}
            );
          }

          if(
            !messages.indexNames.contains(
              'time'
            )
          ){
            messages.createIndex(
              'time',
              'time',
              {unique:false}
            );
          }

          const aiIndex=
            tx.objectStore(
              'aiIndex'
            );

          if(
            !aiIndex.indexNames.contains(
              'kind'
            )
          ){
            aiIndex.createIndex(
              'kind',
              'kind',
              {unique:false}
            );
          }
        };

        req.onsuccess=()=>{
          req.result.onversionchange=()=>{
            req.result.close();
          };

          resolve(
            req.result
          );
        };

        req.onerror=()=>{
          reject(
            req.error||
            new Error(
              'IndexedDB open failed'
            )
          );
        };
      }
    );

    return this.db;
  }

  async put(store,value){
    const db=await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            store,
            'readwrite'
          );

        tx.objectStore(
          store
        ).put(value);

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error||
            new Error('IDB put failed')
          );
      }
    );
  }

  async bulkPut(store,values){
    if(!values?.length)return true;

    const db=await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            store,
            'readwrite'
          );

        const os=
          tx.objectStore(store);

        for(
          const value of values
        ){
          os.put(value);
        }

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error||
            new Error('IDB bulk put failed')
          );
      }
    );
  }

  async get(store,key){
    const db=await this.open();

    return new Promise(
      (resolve,reject)=>{
        const req=
          db.transaction(
            store,
            'readonly'
          ).objectStore(
            store
          ).get(key);

        req.onsuccess=
          ()=>resolve(req.result);

        req.onerror=
          ()=>reject(req.error);
      }
    );
  }

  async all(store){
    const db=await this.open();

    return new Promise(
      (resolve,reject)=>{
        const req=
          db.transaction(
            store,
            'readonly'
          ).objectStore(
            store
          ).getAll();

        req.onsuccess=
          ()=>resolve(req.result||[]);

        req.onerror=
          ()=>reject(req.error);
      }
    );
  }

  async clear(store){
    const db=await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            store,
            'readwrite'
          );

        tx.objectStore(
          store
        ).clear();

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(tx.error);
      }
    );
  }

  async delete(store,key){
    const db=await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            store,
            'readwrite'
          );

        tx.objectStore(
          store
        ).delete(key);

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(tx.error);
      }
    );
  }
}

function securityWarning(

  if(
    state.security.lastAlert===key

  state.security.lastAlert=

  state.security.warnings.push({
    key,
    time:now(),
    message

  addLog(
    'SECURITY',
    'security warning',
    message
  );

  try{
    alert(
      '⚠️ Secure Chat セキュリティ警告\n\n'+
      message+
      '\n\n'+
      'これは傍受・盗聴を断定するものではありません。'
    );
  }catch{}

  toast(
    '⚠️ セキュリティ警告'
  );
}

async function monitorSecurity(
  pc=null
){
  const issues=[];

  if(
    !window.isSecureContext &&
    location.hostname!=='localhost' &&
    location.hostname!=='127.0.0.1'
  ){
    issues.push(
      'HTTPS等の安全なコンテキストではありません。'
    );
  }

  if(
    !state.ws ||
    state.ws.readyState!==WebSocket.OPEN
  ){
    issues.push(
      'シグナリングWebSocketが接続されていません。'
    );
  }

  if(pc){
    try{
      const stats=
        await pc.getStats();

      const dtls=[];

      stats.forEach(
        r=>{
          if(
            r.type==='transport' &&
            r.dtlsState
          ){
            dtls.push(
              r.dtlsState
            );
          }
        }
      );

      if(
        dtls.length &&
        dtls.every(
          s=>s==='failed'||s==='closed'
        )
      ){
        issues.push(
          'WebRTC DTLSトランスポートが正常状態ではありません。'
        );
      }
    }catch{}
  }

  if(
    issues.length
  ){
    securityWarning(
      issues.join('|'),
      issues.join('\n')
    );

    return false;
  }

  return true;
}

/* =========================================================
   Crypto
   ========================================================= */

async function deriveKey(
  password,
  salt
){
  const keyMaterial=
    await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );

  return crypto.subtle.deriveKey(
    {
      name:'PBKDF2',
      salt,
      iterations:220000,
      hash:'SHA-256'
    },
    keyMaterial,
    {
      name:'AES-GCM',
      length:256
    },
    false,
    ['encrypt','decrypt']
  );
}

function b64Encode(bytes){
  bytes=
    bytes instanceof Uint8Array
      ?bytes
      :new Uint8Array(bytes);

  let s='';
  const step=0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=step
  ){
    s+=String.fromCharCode(
      ...bytes.subarray(
        i,
        i+step
      )
    );
  }

  return btoa(s);
}

function b64Decode(text){
  const s=atob(text);
  const out=
    new Uint8Array(
      s.length
    );

  for(
    let i=0;
    i<s.length;
    i++
  ){
    out[i]=s.charCodeAt(i);
  }

  return out;
}

async function encryptJSON(
  value,
  password
){
  if(!password){
    throw new Error(
      '共有パスフレーズが設定されていません'
    );
  }

  const salt=
    crypto.getRandomValues(
      new Uint8Array(16)
    );

  const iv=
    crypto.getRandomValues(
      new Uint8Array(12)
    );

  const key=
    await deriveKey(
      password,
      salt
    );

  const ciphertext=
    await crypto.subtle.encrypt(
      {
        name:'AES-GCM',
        iv
      },
      key,
      enc.encode(
        JSON.stringify(value)
      )
    );

  return {
    v:5,
    alg:'AES-256-GCM',
    kdf:'PBKDF2-SHA256',
    salt:b64Encode(salt),
    iv:b64Encode(iv),
    ct:b64Encode(ciphertext)
  };
}

async function decryptJSON(
  packet,
  password
){
  const key=
    await deriveKey(
      password,
      b64Decode(packet.salt)
    );

  const plaintext=
    await crypto.subtle.decrypt(
      {
        name:'AES-GCM',
        iv:b64Decode(packet.iv)
      },
      key,
      b64Decode(packet.ct)
    );

  return JSON.parse(
    dec.decode(
      plaintext
    )
  );
}

/* =========================================================
   Signalling
   ========================================================= */

function signalURL(
  port=state.peerServer.port
){
  return (
    `${state.peerServer.scheme}://`+
    `${state.peerServer.host}:${port}`+
    `${state.peerServer.path}`+
    `peerjs?key=${encodeURIComponent(
      state.peerServer.key
    )}`+
    `&id=${encodeURIComponent(state.id)}`+
    `&token=${encodeURIComponent(state.token)}`+
    `&version=1.5.5`
  );
}

function signalSend(
  packet
){
  if(
    state.ws?.readyState===WebSocket.OPEN
  ){
    state.ws.send(
      JSON.stringify(packet)
    );

    addLog(
      'SIGNAL',
      `send ${packet.type}`,
      packet.dst?
        `to=${packet.dst}`:
        ''
    );

    return true;
  }

  return false;
}

function signalingPorts(){
  const main=
    Number(
      state.peerServer.port
    );

  if(
    !state.peerServer.fallbackEnabled
  ){
    return [main];
  }

  return [
    main,
    ...state.peerServer.fallbackPorts.filter(
      p=>Number(p)!==main
    )
  ];
}

function connectSignal(){
  clearTimeout(
    state.signalTimer
  );

  state.ws=null;
  state.wsReady=false;

  setTopStatus(
    '接続中…'
  );

  const ports=
    signalingPorts();

  let index=0;

  const next=()=>{
    if(
      index>=ports.length
    ){
      setTopStatus(
        'シグナリング接続失敗'
      );

      addLog(
        'ERROR',
        'signaling failed',
        ports.join(',')
      );

      if(
        featureOn('autoReconnect')
      ){
        state.signalTimer=
          setTimeout(
            connectSignal,
            2500
          );
      }

      monitorSecurity();

      return;
    }

    const port=
      ports[index++];

    let ws;

    try{
      ws=
        new WebSocket(
          signalURL(port)
        );
    }catch(e){
      addLog(
        'WARN',
        'websocket constructor',
        e.message
      );

      setTimeout(
        next,
        80
      );

      return;
    }

    state.ws=ws;

    let finished=false;
    let opened=false;

    const timer=
      setTimeout(
        ()=>{
          if(finished)return;

          finished=true;

          try{
            ws.close();
          }catch{}

          if(
            state.peerServer.fallbackEnabled
          ){
            next();
          }else{
            state.wsReady=false;
            setTopStatus('シグナリング接続タイムアウト');
            addLog('WARN','WebSocket timeout',`port=${port}`);
            monitorSecurity();
          }
        },
        Math.max(
          1000,
          state.peerServer.fallbackTimeoutMs
        )
      );

    ws.onopen=()=>{
      if(finished)return;

      finished=true;
      opened=true;

      clearTimeout(
        timer
      );

      state.wsReady=true;

      state.activeEndpoint={
        scheme:state.peerServer.scheme,
        host:state.peerServer.host,
        port
      };

      setTopStatus(
        `オンライン · ${port}`
      );

      addLog(
        'INFO',
        'WebSocket open',
        `${state.peerServer.scheme}://${state.peerServer.host}:${port}`
      );

      monitorSecurity();

      reconnectKnownPeers();
    };

    ws.onerror=()=>{
      addLog(
        'WARN',
        'WebSocket error',
        `port=${port}`
      );
    };

    ws.onclose=()=>{
      clearTimeout(
        timer
      );

      state.wsReady=false;

      if(!opened){
        if(
          !finished &&
          state.peerServer.fallbackEnabled
        ){
          finished=true;
          next();
        }
        return;
      }

      setTopStatus(
        'シグナリング切断'
      );

      if(
        featureOn('autoReconnect')
      ){
        state.signalTimer=
          setTimeout(
            connectSignal,
            2500
          );
      }
    };

    ws.onmessage=e=>{
      let packet;

      try{
        packet=
          JSON.parse(
            e.data
          );
      }catch{
        return;
      }

      handleSignal(
        packet
      );
    };
  };

  next();
}

function handleSignal(
  packet
){
  const remote=
    packet.src;

  const payload=
    packet.payload||{};

  if(
    packet.type==='OPEN'
  ){
    state.wsReady=true;
    setTopStatus('オンライン');
    return;
  }

  if(
    packet.type==='ID-TAKEN'
  ){
    toast(
      'Peer IDが使用中です。更新して再取得してください。'
    );
    return;
  }

  if(
    packet.type==='PEER-UNAVAILABLE'||
    packet.type==='EXPIRE'
  ){
    toast(
      '相手のPeer IDが見つかりません'
    );
    return;
  }

  if(!remote)return;

  if(
    packet.type==='OFFER'
  ){
    handleOffer(
      remote,
      payload
    );
    return;
  }

  if(
    packet.type==='ANSWER'
  ){
    handleAnswer(
      remote,
      payload
    );
    return;
  }

  if(
    packet.type==='CANDIDATE'
  ){
    handleCandidate(
      remote,
      payload
    );
  }
}

/* =========================================================
   RTC
   ========================================================= */

function getIceServers(){
  return [
    {
      urls:
        'stun:stun.l.google.com:19302'
    },
    {
      urls:[
        'turn:eu-0.turn.peerjs.com:3478',
        'turn:us-0.turn.peerjs.com:3478'
      ],
      username:'peerjs',
      credential:'peerjsp'
    }
  ];
}

function createRTC(
  remote,
  kind,
  initiator,
  metadata={}
){
  const connectionId=
    uid(kind);

  const pc=
    new RTCPeerConnection({
      iceServers:
        getIceServers(),
      sdpSemantics:
        'unified-plan'
    });

  const c={
    remote,
    kind,
    initiator,
    connectionId,
    metadata,
    pc,

    control:null,
    file:null,

    pendingCandidates:[],

    remoteStream:
      new MediaStream(),

    incomingFiles:new Map(),
    outgoingFiles:new Map()
  };

  state.connections.set(
    remote+'::'+connectionId,
    c
  );

  pc.onicecandidate=e=>{
    if(e.candidate){
      signalSend({
        type:'CANDIDATE',
        dst:remote,
        payload:{
          connectionId,
          candidate:e.candidate
        }
      });
    }
  };

  pc.onicecandidateerror=e=>{
    addLog(
      'WARN',
      'ICE candidate error',
      `${remote} ${e.errorCode||''} ${e.errorText||''}`
    );
  };

  pc.oniceconnectionstatechange=()=>{
    addLog(
      'ICE',
      'connection state',
      `${remote}: ${pc.iceConnectionState}`
    );

    if(
      pc.iceConnectionState==='failed' &&
      kind==='data'
    ){
      tryRestartIce(c);
    }
  };

  pc.onconnectionstatechange=()=>{
    addLog(
      'RTC',
      'connection state',
      `${remote}: ${pc.connectionState}`
    );

    if(
      pc.connectionState==='connected'
    ){
      toast(
        `${contactName(remote)} とP2P接続しました`
      );

      monitorSecurity(pc);
      renderList();
    }

    if(
      pc.connectionState==='closed'||
      pc.connectionState==='failed'
    ){
      renderList();
    }
  };

  pc.ondatachannel=e=>{
    if(
      e.channel.label==='secure-control'
    ){
      c.control=
        e.channel;

      bindControlChannel(c);
    }

    if(
      e.channel.label==='secure-file'
    ){
      c.file=
        e.channel;

      bindFileChannel(c);
    }
  };

  pc.ontrack=e=>{
    if(
      e.streams?.[0]
    ){
      c.remoteStream=
        e.streams[0];
    }else{
      c.remoteStream.addTrack(
        e.track
      );
    }

    if(
      kind==='media'
    ){
      $('remoteVideo').srcObject=
        c.remoteStream;
    }
  };

  return c;
}

function findDataConnection(
  remote
){
  for(
    const c of state.connections.values()
  ){
    if(
      c.remote===remote &&
      c.kind==='data' &&
      c.pc.connectionState!=='closed'
    ){
      return c;
    }
  }

  return null;
}

function bindControlChannel(c){
  if(!c.control)return;

  const ch=c.control;

  ch.onopen=()=>{
    addLog(
      'DATA',
      'control open',
      c.remote
    );

    sendControlObject(
      c.remote,
      {
        type:'hello',
        name:state.name,
        features:state.settings.features,
        version:APP.version
      }
    ).catch(()=>{});

    renderList();
  };

  ch.onclose=()=>{
    addLog(
      'DATA',
      'control close',
      c.remote
    );
  };

  ch.onerror=e=>{
    addLog(
      'ERROR',
      'control error',
      `${c.remote}: ${e?.message||'unknown'}`
    );
  };

  ch.onmessage=async e=>{
    try{
      const wrapper=
        JSON.parse(
          e.data
        );

      const password=
        localGet(
          APP.keys.password,
          ''
        );

      const object=
        wrapper?.encrypted
          ?await decryptJSON(
              wrapper.value,
              password
            )
          :wrapper;

      await receivePacket(
        c.remote,
        object
      );

    }catch(err){
      addLog(
        'WARN',
        'control decode failed',
        err.message
      );
    }
  };
}

function bindFileChannel(c){
  if(!c.file)return;

  const ch=c.file;

  ch.binaryType=
    'arraybuffer';

  ch.onopen=()=>{
    addLog(
      'FILE',
      'file channel open',
      c.remote
    );
  };

  ch.onclose=()=>{
    addLog(
      'FILE',
      'file channel close',
      c.remote
    );
  };

  ch.onerror=e=>{
    addLog(
      'ERROR',
      'file channel error',
      `${c.remote}: ${e?.message||'unknown'}`
    );
  };

  ch.onmessage=e=>{
    receiveFileFrame(
      c,
      e.data
    ).catch(
      err=>{
        addLog(
          'ERROR',
          'file frame failed',
          err.message
        );
      }
    );
  };
}

async function sendControlObject(
  remote,
  object
){
  let c=
    findDataConnection(remote);

  if(
    !c ||
    c.control?.readyState!=='open'
  ){
    c=
      await ensureDataConnection(
        remote
      );
  }

  const password=
    localGet(
      APP.keys.password,
      ''
    );

  if(!password){
    throw new Error(
      '共有パスフレーズを設定してください'
    );
  }

  const encrypted=
    await encryptJSON(
      object,
      password
    );

  await waitChannel(
    c.control,
    8000
  );

  c.control.send(
    JSON.stringify({
      encrypted:true,
      value:encrypted
    })
  );
}

function waitChannel(
  channel,
  timeout=8000
){
  if(
    channel?.readyState==='open'
  ){
    return Promise.resolve();
  }

  return new Promise(
    (resolve,reject)=>{
      const start=now();

      const timer=
        setInterval(
          ()=>{
            if(
              channel?.readyState==='open'
            ){
              clearInterval(timer);
              resolve();
              return;
            }

            if(
              now()-start>timeout
            ){
              clearInterval(timer);
              reject(
                new Error(
                  'DataChannel接続待ちがタイムアウトしました'
                )
              );
            }
          },
          120
        );
    }
  );
}

async function ensureDataConnection(
  remote
){
  let c=
    findDataConnection(remote);

  if(
    c &&
    c.control?.readyState==='open'
  ){
    return c;
  }

  if(
    c &&
    c.pc.connectionState!=='closed'
  ){
    try{
      c.pc.close();
    }catch{}
  }

  c=
    createRTC(
      remote,
      'data',
      true,
      {name:state.name}
    );

  c.control=
    c.pc.createDataChannel(
      'secure-control',
      {
        ordered:true
      }
    );

  c.file=
    c.pc.createDataChannel(
      'secure-file',
      {
        ordered:true
      }
    );

  bindControlChannel(c);
  bindFileChannel(c);

  await createOffer(c);

  return c;
}

async function createOffer(
  c,
  options
){
  const offer=
    await c.pc.createOffer(
      options
    );

  await c.pc.setLocalDescription(
    offer
  );

  signalSend({
    type:'OFFER',
    dst:c.remote,
    payload:{
      connectionId:c.connectionId,
      kind:c.kind,
      sdp:c.pc.localDescription,
      metadata:c.metadata
    }
  });
}

async function tryRestartIce(c){
  if(
    c.pc.signalingState!=='stable'
  ){
    return;
  }

  try{
    await createOffer(
      c,
      {iceRestart:true}
    );
  }catch(e){
    addLog(
      'WARN',
      'ICE restart failed',
      `${c.remote}: ${e.message}`
    );
  }
}

async function handleOffer(
  remote,
  payload
){
  const key=
    remote+'::'+payload.connectionId;

  let c=
    state.connections.get(key);

  if(!c){
    c=
      createRTC(
        remote,
        payload.kind==='media'
          ?'media'
          :'data',
        false,
        payload.metadata||{}
      );
  }

  try{
    await c.pc.setRemoteDescription(
      payload.sdp
    );

    for(
      const candidate of
      c.pendingCandidates.splice(0)
    ){
      try{
        await c.pc.addIceCandidate(
          candidate
        );
      }catch{}
    }

    if(
      c.kind==='media'
    ){
      const accept=
        confirm(
          `${c.metadata?.name||remote} からビデオ通話です。\n受けますか？`
        );

      playNotificationSound();

      if(!accept){
        c.pc.close();
        return;
      }

      await ensureMedia();

      for(
        const track of
        state.localStream.getTracks()
      ){
        c.pc.addTrack(
          track,
          state.localStream
        );
      }
    }else{
      /*
        For a data answerer, the offer should
        have incoming data channels. No local
        createDataChannel is necessary.
      */
    }

    const answer=
      await c.pc.createAnswer();

    await c.pc.setLocalDescription(
      answer
    );

    signalSend({
      type:'ANSWER',
      dst:remote,
      payload:{
        connectionId:c.connectionId,
        kind:c.kind,
        sdp:c.pc.localDescription
      }
    });

    if(
      c.kind==='media'
    ){
      $('videoStage')
        .classList
        .add('show');

      $('callName').textContent=
        c.metadata?.name||
        contactName(remote);

      state.callPeer=
        remote;

      ensureWakeLock();

      saveCall(
        remote,
        'incoming'
      );
    }

  }catch(e){
    addLog(
      'ERROR',
      'handle offer failed',
      `${remote}: ${e.message}`
    );
  }
}

async function handleAnswer(
  remote,
  payload
){
  const c=
    state.connections.get(
      remote+'::'+payload.connectionId
    );

  if(!c)return;

  try{
    await c.pc.setRemoteDescription(
      payload.sdp
    );

    for(
      const candidate of
      c.pendingCandidates.splice(0)
    ){
      try{
        await c.pc.addIceCandidate(
          candidate
        );
      }catch{}
    }

  }catch(e){
    addLog(
      'ERROR',
      'answer failed',
      `${remote}: ${e.message}`
    );
  }
}

async function handleCandidate(
  remote,
  payload
){
  const c=
    state.connections.get(
      remote+'::'+payload.connectionId
    );

  if(!c)return;

  try{
    if(
      c.pc.remoteDescription
    ){
      await c.pc.addIceCandidate(
        payload.candidate
      );
    }else{
      c.pendingCandidates.push(
        payload.candidate
      );
    }
  }catch{}
}

/* =========================================================
   Incoming / outgoing messages
   ========================================================= */

function baseMessage(
  peer,
  text,
  extra={}
){
  return {
    id:uid('msg'),
    peer,
    from:state.id,
    to:peer,
    type:'chat',
    text:String(text||''),
    time:now(),
    edited:false,
    deleted:false,
    replyTo:extra.replyTo||null,
    threadRoot:extra.threadRoot||null,
    reactions:{},
    attachment:extra.attachment||null,
    groupId:extra.groupId||null
  };
}

async function storeMessage(message){
  state.chats.push(
    message
  );

  if(
    state.storageReady
  ){
    await db.put(
      'messages',
      message
    ).catch(()=>{});
  }

  if(
    featureOn('aiDatabase')
  ){
    await indexMessage(
      message
    );
  }
}

async function updateMessage(
  message
){
  const i=
    state.chats.findIndex(
      m=>m.id===message.id
    );

  if(i>=0){
    state.chats[i]=message;
  }

  if(
    state.storageReady
  ){
    await db.put(
      'messages',
      message
    ).catch(()=>{});
  }
}

async function deleteMessagePermanent(
  id
){
  const index=
    state.chats.findIndex(
      m=>m.id===id
    );

  if(index<0)return;

  state.chats.splice(
    index,
    1
  );

  if(
    state.storageReady
  ){
    await db.delete(
      'messages',
      id
    ).catch(()=>{});
  }
}

async function sendText(){
  const peer=
    state.selected;

  if(!peer){
    toast(
      '相手を選択してください'
    );
    return;
  }

  const input=
    $('message');

  const text=
    input.value.trim();

  if(!text)return;

  if(
    state.editingId
  ){
    const message=
      state.chats.find(
        m=>m.id===state.editingId
      );

    if(!message){
      state.editingId=null;
      renderComposerState();
      return;
    }

    if(
      message.from!==state.id
    ){
      toast(
        '自分のメッセージだけ編集できます'
      );
      return;
    }

    message.text=
      text;

    message.edited=
      true;

    message.editedAt=
      now();

    try{
      await sendControlObject(
        peer,
        {
          type:'edit',
          message
        }
      );

      await updateMessage(
        message
      );

      input.value='';

      state.editingId=null;

      renderComposerState();
      renderChat(peer);

    }catch(e){
      toast(
        e.message
      );
    }

    return;
  }

  const message=
    baseMessage(
      peer,
      text,
      {
        replyTo:
          state.replyTo?.id||
          null,

        threadRoot:
          state.replyTo?.threadRoot||
          state.replyTo?.id||
          null
      }
    );

  try{
    await sendControlObject(
      peer,
      {
        type:'chat',
        message
      }
    );

    await storeMessage(
      message
    );

    processLocalMentions(
      text
    );

    input.value='';

    state.replyTo=null;

    renderComposerState();
    renderChat(peer);
    renderList();

  }catch(e){
    toast(
      e.message
    );

    addLog(
      'ERROR',
      'send message failed',
      e.message
    );
  }
}

async function receivePacket(
  remote,
  object
){
  if(!object?.type)return;

  if(
    object.type==='hello'
  ){
    await addFriend(
      remote,
      object.name||remote,
      false
    );
    return;
  }

  if(
    object.type==='friend-request'
  ){
    await addFriend(
      remote,
      object.name||remote,
      true
    );

    toast(
      `${object.name||remote} からフレンド申請`
    );

    return;
  }

  if(
    object.type==='chat'
  ){
    const message={
      ...object.message,

      id:
        object.message?.id||
        uid('msg'),

      peer:remote,
      from:remote,
      to:state.id
    };

    await storeMessage(
      message
    );

    if(
      featureOn('mentions')
    ){
      processRemoteMentions(
        remote,
        message.text
      );
    }

    notifyIncoming(
      message
    );

    if(
      state.selected===remote
    ){
      renderChat(remote);
    }else{
      state.unread[remote]=
        (
          state.unread[remote]||
          0
        )+1;
    }

    renderList();

    return;
  }

  if(
    object.type==='edit'
  ){
    const message=
      object.message;

    if(!message)return;

    const local=
      state.chats.find(
        m=>m.id===message.id
      );

    if(local){
      Object.assign(
        local,
        message
      );

      await updateMessage(
        local
      );

      if(
        state.selected===remote
      ){
        renderChat(
          remote
        );
      }
    }

    return;
  }

  if(
    object.type==='delete'
  ){
    const local=
      state.chats.find(
        m=>m.id===object.messageId
      );

    if(local){
      local.deleted=true;
      local.text='';
      await updateMessage(
        local
      );

      if(
        state.selected===remote
      ){
        renderChat(remote);
      }
    }

    return;
  }

  if(
    object.type==='reaction'
  ){
    const local=
      state.chats.find(
        m=>m.id===object.messageId
      );

    if(local){
      if(!local.reactions){
        local.reactions={};
      }

      const list=
        local.reactions[
          object.reaction
        ]||
        [];

      if(
        !list.includes(remote)
      ){
        list.push(remote);
      }else{
        list.splice(
          list.indexOf(remote),
          1
        );
      }

      local.reactions[
        object.reaction
      ]=list;

      await updateMessage(
        local
      );

      renderChat(
        remote
      );
    }

    return;
  }

  if(
    object.type==='group-invite'
  ){
    const group=
      object.group;

    if(!group)return;

    const exists=
      state.groups.some(
        g=>g.id===group.id
      );

    if(!exists){
      state.groups.push(
        group
      );

      if(
        state.storageReady
      ){
        await db.put(
          'groups',
          group
        ).catch(()=>{});
      }

      renderList();

      toast(
        `👥 ${group.name} に招待されました`
      );
    }

    return;
  }

  if(
    object.type==='file-offer'
  ){
    receiveFileOffer(
      remote,
      object.offer
    );

    return;
  }

  if(
    object.type==='group-chat'
  ){
    const message=
      baseMessage(
        object.groupId,
        object.text
      );

    message.groupId=
      object.groupId;

    message.from=
      remote;

    await storeMessage(
      message
    );

    renderList();

    return;
  }
}

function playNotificationSound(){
  if(
    !featureOn('notificationSound')
  ){
    return;
  }

  try{
    const AudioContext=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioContext)return;

    const ctx=
      new AudioContext();

    const oscillator=
      ctx.createOscillator();

    const gain=
      ctx.createGain();

    oscillator.frequency.value=
      760;

    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .06,
      ctx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime+.16
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime+.17
    );
  }catch{}
}

function browserNotify(
  title,
  body
){
  if(
    !featureOn('browserNotify')

  }catch{}
}

/* =========================================================
   File Transfer
   ========================================================= */

const transfers={
  outgoing:new Map(),
  incoming:new Map()
};

async function sendFiles(
  files
){
  if(
    !featureOn('files')
  ){
    toast(
      '設定からファイル送信をONにしてください'
    );
    return;
  }

  const peer=
    state.selected;

  if(!peer){
    toast(
      '相手を選択してください'
    );
    return;
  }

  for(
    const file of files
  ){
    if(
      file.size>
      state.settings.fileMaxBytes
    ){
      toast(
        `${file.name} がサイズ上限を超えています`
      );
      continue;
    }

    try{
      const c=
        await ensureDataConnection(
          peer
        );

      await waitChannel(
        c.file,
        9000
      );

      const transferId=
        uid('transfer');

      const chunkSize=
        state.settings.fileChunkSize;

      const totalChunks=
        Math.ceil(
          file.size/chunkSize
        );

      const meta={
        transferId,
        name:file.name,
        size:file.size,
        mime:
          file.type||
          'application/octet-stream',
        lastModified:
          file.lastModified,
        chunkSize,
        totalChunks
      };

      transfers.outgoing.set(
        transferId,
        {
          file,
          meta
        }
      );

      await sendControlObject(
        peer,
        {
          type:'file-offer',
          offer:meta
        }
      );

      const localMessage=
        baseMessage(
          peer,
          file.name,
          {
            attachment:{
              name:file.name,
              size:file.size,
              mime:meta.mime,
              outgoing:true
            }
          }
        );

      localMessage.type='file';

      await storeMessage(
        localMessage
      );

      renderChat(
        peer
      );

      let offset=0;
      let index=0;

      while(
        offset<file.size
      ){
        await waitChannel(
          c.file,
          9000
        );

        while(
          c.file.bufferedAmount>
          chunkSize*4
        ){
          await new Promise(
            resolve=>
              setTimeout(
                resolve,
                10
              )
          );
        }

        const end=
          Math.min(
            offset+
              chunkSize,
            file.size
          );

        const chunk=
          new Uint8Array(
            await file.slice(
              offset,
              end
            ).arrayBuffer()
          );

        const header=
          enc.encode(
            JSON.stringify({
              kind:'chunk',
              transferId,
              index,
              total:totalChunks,
              size:chunk.byteLength
            })+
            '\n'
          );

        const frame=
          new Uint8Array(
            header.byteLength+
            chunk.byteLength
          );

        frame.set(
          header,
          0
        );

        frame.set(
          chunk,
          header.byteLength
        );

        c.file.send(
          frame.buffer
        );

        offset=end;
        index++;

        toast(
          `📎 ${file.name} · ${Math.floor(
            offset/file.size*100
          )}%`
        );
      }

      c.file.send(
        JSON.stringify({
          kind:'done',
          transferId
        })
      );

      transfers.outgoing.delete(
        transferId
      );

      toast(
        `✅ ${file.name} を送信しました`
      );

    }catch(e){
      toast(
        `ファイル送信失敗: ${e.message}`
      );

      addLog(
        'ERROR',
        'file send failed',
        e.message
      );
    }
  }
}

function receiveFileOffer(
  remote,
  offer
){
  if(!offer?.transferId){
    return;
  }

  const accept=
    confirm(
      `${contactName(remote)} からファイル\n`+
      `${offer.name} (${formatBytes(offer.size)})\n`+
      `を受信しますか？`
    );

  if(!accept){
    toast(
      'ファイル受信を拒否しました'
    );
    return;
  }

  transfers.incoming.set(
    offer.transferId,
    {
      remote,
      meta:offer,
      chunks:new Array(
        offer.totalChunks
      ),
      received:0
    }
  );

  toast(
    `📥 ${offer.name} を受信中…`
  );
}

async function receiveFileFrame(
  c,
  data
){
  if(
    typeof data==='string'
  ){
    const control=
      jsonParse(
        data,
        null
      );

    if(
      control?.kind==='done'
    ){
      const transfer=
        transfers.incoming.get(
          control.transferId
        );

      if(
        transfer
      ){
        await finishIncomingFile(
          control.transferId,
          transfer
        );
      }
    }

    return;
  }

  const bytes=
    new Uint8Array(
      data
    );

  const newline=
    bytes.indexOf(
      10
    );

  if(newline<0)return;

  const header=
    jsonParse(
      dec.decode(
        bytes.slice(
          0,
          newline
        )
      ),
      null
    );

  if(
    header?.kind!=='chunk'
  ){
    return;
  }

  const transfer=
    transfers.incoming.get(
      header.transferId
    );

  if(!transfer)return;

  const chunk=
    bytes.slice(
      newline+1
    );

  transfer.chunks[
    header.index
  ]=chunk;

  transfer.received+=
    chunk.byteLength;

  toast(
    `📥 ${transfer.meta.name} · ${Math.floor(
      transfer.received/
      transfer.meta.size*
      100
    )}%`
  );
}

async function finishIncomingFile(
  transferId,
  transfer
){
  const blob=
    new Blob(
      transfer.chunks,
      {
        type:
          transfer.meta.mime
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const message=
    baseMessage(
      transfer.remote,
      transfer.meta.name
    );

  message.type='file';

  message.attachment={
    name:
      transfer.meta.name,
    size:
      transfer.meta.size,
    mime:
      transfer.meta.mime,
    objectUrl:url,
    incoming:true
  };

  await storeMessage(
    message
  );

  transfers.incoming.delete(
    transferId
  );

  renderChat(
    transfer.remote
  );

  toast(
    `✅ ${transfer.meta.name} を受信しました`
  );
}

async function reactMessage(
  messageId,
  emoji
){
  if(
    !featureOn('reactions')
  ){
    toast(
      'リアクションをONにしてください'
    );

  const message=
    state.chats.find(
      m=>m.id===messageId

  if(!message)return;

  if(!message.reactions){
    message.reactions={};

  const list=
    message.reactions[
      emoji
    ]||[];

  const index=
    list.indexOf(
      state.id
    );

  if(index>=0){
    list.splice(
      index,
      1
    );
  }else{
    list.push(
      state.id
    );

  message.reactions[
    emoji
  ]=list;

  await updateMessage(
    message
  );

  try{
    await sendControlObject(
      message.peer,
      {
        type:'reaction',
        messageId,
        reaction:emoji
      }
    );
  }catch{}

  renderChat(
    message.peer
  );
}

/* =========================================================
   Rich text renderer
   ========================================================= */

function renderRichText(
  text
){
  let s=
    esc(
      String(text||'')
    );

  s=
    s.replace(
      /```([\s\S]*?)```/g,
      '<pre>$1</pre>'
    );

  s=
    s.replace(
      /`([^`\n]+)`/g,
      '<code>$1</code>'
    );

  s=
    s.replace(
      /\*\*([^*]+)\*\*/g,
      '<strong>$1</strong>'
    );

  s=
    s.replace(
      /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
      '$1<em>$2</em>'
    );

  s=
    s.replace(
      /^\s*-\s+(.+)$/gm,
      '<li>$1</li>'
    );

  s=
    s.replace(
      /(<li>[\s\S]*?<\/li>)(?:<br>|$)/g,
      '<ul>$1</ul>'
    );

  s=
    s.replace(
      /(@all|@\d{6})/g,
      '<span class="mention">$1</span>'
    );

  s=
    s.replace(
      /\n/g,
      '<br>'
    );

  return s;
}

function insertText(
  text
){
  const input=
    $('message');

  const start=
    input.selectionStart||
    0;

  const end=
    input.selectionEnd||
    0;

  input.value=
    input.value.slice(
      0,
      start
    )+
    text+
    input.value.slice(
      end
    );

  input.focus();

  const position=
    start+
    text.length;

  try{
    input.setSelectionRange(
      position,
      position
    );
  }catch{}
}

async function fileDataURL(
  file
){
  return new Promise(
    (resolve,reject)=>{
      const reader=
        new FileReader();

      reader.onload=
        ()=>resolve(
          String(
            reader.result||''
          )
        );

      reader.onerror=
        ()=>reject(
          reader.error||
          new Error('FileReader failed')
        );

      reader.readAsDataURL(
        file
      );
    }
  );
}

function searchMessages(
  query
){
  const q=
    String(query||'')
      .trim()
      .toLowerCase();

  if(!q)return [];

  return state.chats
    .filter(
      m=>{
        const hay=[
          m.text||'',
          contactName(
            m.from
          ),
          m.attachment?.name||''
        ]
        .join(' ')
        .toLowerCase();

        return hay.includes(q);
      }
    )
    .sort(
      (a,b)=>b.time-a.time
    )
    .slice(
      0,
      300
    );
}

/* =========================================================
   AI Database / Retrieval
   ========================================================= */

function aiNormalize(
  text
){
  return String(text||'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(
      /\s+/g,
      ' '
    )
    .trim();
}

function aiTokens(
  text
){
  return aiNormalize(
    text
  )
  .replace(
    /[、。,.!?！？:：;；()[\]「」『』<>]/g,
    ' '
  )
  .split(/\s+/)
  .filter(Boolean);
}

async function indexMessage(
  message
){
  if(
    !featureOn('aiDatabase')
  ){
    return;
  }

  const text=[
    message.text||'',
    message.type||'',
    message.attachment?.name||'',
    contactName(message.from)
  ].join(' ');

  const entry={
    id:'message:'+message.id,
    kind:'message',
    refId:message.id,
    peer:message.peer,
    time:message.time,
    text,
    tokens:[
      ...new Set(
        aiTokens(text)
      )
    ]
  };

  const old=
    state.aiIndex.findIndex(
      x=>x.id===entry.id
    );

  if(old>=0){
    state.aiIndex[old]=
      entry;
  }else{
    state.aiIndex.push(
      entry
    );
  }

  if(
    state.storageReady
  ){
    await db.put(
      'aiIndex',
      entry
    ).catch(()=>{});
  }
}

async function seedAIIndex(){
  if(
    !featureOn('aiDatabase')
  ){
    return;
  }

  for(
    const message of
    state.chats
  ){
    await indexMessage(
      message
    );
  }

  for(
    const memory of
    state.aiMemory
  ){
    const entry={
      id:'memory:'+memory.id,
      kind:'memory',
      refId:memory.id,
      peer:'',
      time:memory.time,
      text:memory.text,
      tokens:[
        ...new Set(
          aiTokens(
            memory.text
          )
        )
      ]
    };

    const old=
      state.aiIndex.findIndex(
        x=>x.id===entry.id
      );

    if(old>=0){
      state.aiIndex[old]=entry;
    }else{
      state.aiIndex.push(entry);
    }

    if(
      state.storageReady
    ){
      await db.put(
        'aiIndex',
        entry
      ).catch(()=>{});
    }
  }
}

function retrieveAI(
  query,
  limit=8
){
  if(
    !featureOn('aiDatabase')
  ){
    return [];
  }

  const tokens=
    aiTokens(
      query
    );

  return state.aiIndex
    .map(
      entry=>{
        let score=0;

        for(
          const token of tokens
        ){
          if(
            entry.tokens.includes(
              token
            )
          ){
            score+=2;
          }

          if(
            entry.text.includes(
              token
            )
          ){
            score+=1;
          }
        }

        return {
          entry,
          score
        };
      }
    )
    .filter(
      x=>x.score>0
    )
    .sort(
      (a,b)=>b.score-a.score
    )
    .slice(
      0,
      limit
    )
    .map(
      x=>x.entry
    );
}

async function saveAIMemory(
  text
){
  const clean=
    String(text||'')
      .trim();

  if(!clean)return;

  const memory={
    id:uid('memory'),
    text:clean,
    time:now()
  };

  state.aiMemory.push(
    memory
  );

  if(
    state.storageReady
  ){
    await db.put(
      'aiMemory',
      memory
    ).catch(()=>{});
  }

  await seedAIIndex();
}

const LocalAI={
  async gpu(){
    if(
      !navigator.gpu
    ){
      return {
        ok:false,
        reason:
          'WebGPU APIなし'
      };
    }

    try{
      const adapter=
        await navigator.gpu.requestAdapter();

      if(!adapter){
        return {
          ok:false,
          reason:
            'GPU adapter取得失敗'
        };
      }

      return {
        ok:true,
        info:
          adapter.info||
          {}
      };

    }catch(e){
      return {
        ok:false,
        reason:e.message
      };
    }
  },

  async generate(
    question,
    imageData=''
  ){
    const command=
      await runAIToolCommand(
        question
      );

    if(command){
      return command;
    }

    if(
      state.settings.aiEndpoint
    ){
      try{
        return await this.remote(
          question,
          imageData
        );
      }catch(e){
        addLog(
          'WARN',
          'remote AI failed',
          e.message
        );
      }
    }

    return this.fallback(
      question,
      imageData
    );
  },

  async remote(
    question,
    imageData=''
  ){
    const messages=
      state.aiHistory
        .slice(-20)
        .map(
          m=>({
            role:
              m.role==='assistant'
                ?'assistant'
                :'user',
            content:m.text
          })
        );

    const context=
      retrieveAI(
        question,
        8
      );

    if(
      context.length
    ){
      messages.push({
        role:'system',
        content:
          'Secure Chat local context:\n'+
          context
            .map(
              x=>x.text
            )
            .join('\n---\n')
      });
    }

    messages.push({
      role:'user',
      content:
        imageData
          ?[
              {
                type:'text',
                text:
                  question||
                  'この画像を説明してください'
              },
              {
                type:'image_url',
                image_url:{
                  url:imageData
                }
              }
            ]
          :question
    });

    const headers={
      'Content-Type':
        'application/json'
    };

    if(
      state.settings.aiApiKey
    ){
      headers.Authorization=
        'Bearer '+
        state.settings.aiApiKey;
    }

    const response=
      await fetch(
        state.settings.aiEndpoint,
        {
          method:'POST',
          headers,
          body:JSON.stringify({
            model:
              state.settings.aiModel||
              undefined,
            messages,
            temperature:
              state.settings.aiTemperature,
            max_tokens:
              state.settings.aiMaxTokens
          })
        }
      );

    if(!response.ok){
      throw new Error(
        `AI HTTP ${response.status}`
      );
    }

    const data=
      await response.json();

    const text=
      data?.choices?.[0]?.message?.content||
      data?.choices?.[0]?.text||
      data?.output?.[0]?.content?.[0]?.text;

    if(!text){
      throw new Error(
        'AI response missing'
      );
    }

    return String(text);
  },

  fallback(
    question,
    imageData=''
  ){
    const q=
      aiNormalize(
        question
      );

    const status=
      getAIStatus();

    const contexts=
      retrieveAI(
        question,
        6
      );

    if(
      /こんにちは|hello|やあ/.test(q)
    ){
      return(
        'こんにちは！🤖 SecureAIです。'
      );
    }

    if(
      /進捗|進行状況|今どう|待って/.test(q)
    ){
      return [
        '大丈夫です。現在の状態を確認しました。',
        '',
        `WSS: ${status.ws?'接続済み':'未接続'}`,
        `Peer ID: ${status.peerId}`,
        `P2P接続数: ${status.connections.length}`,
        `メッセージ数: ${status.messages}`,
        `AI Index: ${status.aiIndex}`,
        `WebGPU: ${status.webGPU?'利用候補':'非対応/未提供'}`
      ].join('\n');
    }

    if(
      /状態|ステータス|現在/.test(q)
    ){
      return [
        '現在のSecure Chat:',
        `Peer ID: ${status.peerId}`,
        `WSS: ${status.ws?'接続':'未接続'}`,
        `相手: ${status.selected||'なし'}`,
        `P2P接続: ${status.connections.length}`,
        `フレンド: ${status.friends}`,
        `グループ: ${status.groups}`,
        `メッセージ: ${status.messages}`,
        `AI Index: ${status.aiIndex}`,
        `WebGPU: ${status.webGPU?'あり':'なし'}`
      ].join('\n');
    }

    if(
      /ice|stun|turn|nat|candidate|relay/.test(q)
    ){
      return(
        '🧪 ICE診断からhost / srflx / relay、ICE state、candidate error、RTTを確認できます。'
      );
    }

    if(
      /ポート|port|websocket|wss/.test(q)
    ){
      return [
        `接続先: ${state.peerServer.scheme}://${state.peerServer.host}:${state.peerServer.port}`,
        `フォールバック: ${state.peerServer.fallbackEnabled?'ON':'OFF'}`,
        `候補: ${signalingPorts().join(', ')}`
      ].join('\n');
    }

    if(
      /ファイル|添付/.test(q)
    ){
      return(
        '📎 ファイルはRTCDataChannelへ分割送信します。ファイル全体を一つのArrayBufferへ展開する方式を避けています。'
      );
    }

    if(
      /webgpu|gpu|モデル|llm/.test(q)
    ){
      return [
        'ローカルWebGPU状態:',
        `WebGPU API: ${status.webGPU?'あり':'なし'}`,
        `モデルURL: ${state.settings.aiModelUrl||'未設定'}`,
        `モデル名: ${state.settings.localModelName}`,
        '',
        '実際の推論ランタイムが無い場合はFallbackを使い、推論しているふりはしません。'
      ].join('\n');
    }

    if(
      /履歴|検索|メッセージ/.test(q)
    ){
      if(
        contexts.length
      ){
        return [
          `関連項目 ${contexts.length} 件:`,
          ...contexts.map(
            x=>'• '+x.text.slice(0,180)
          )
        ].join('\n');
      }

      return(
        'AIデータベースに該当度の高い項目はありませんでした。'
      );
    }

    if(
      /安全|セキュリティ|傍受|盗聴|暗号/.test(q)
    ){
      return(
        'SecureChatはAES-GCM、WebRTC/DTLS、WSS、ICE状態を監視します。ただしブラウザだけで傍受や盗聴を断定することはできません。'
      );
    }

    if(
      /microsoft|マイクロソフト|entra|ログイン/.test(q)
    ){
      return(
        'MicrosoftログインはcommonテナントのAuthorization Code + PKCEです。client secretはHTMLへ置きません。'
      );
    }

    if(
      /python|pyodide|パイソン/.test(q)
    ){
      return(
        'PythonソースはHTMLへ埋め込めますが、ChromeはPython文字列をそのまま実行しません。実行にはPyodide等のWASMランタイムが実際に必要です。'
      );
    }

    if(imageData){
      return(
        '🖼️ 画像入力は受け取りました。実画像認識モデルが設定されていないため、SecureChatは解析したふりをしません。'
      );
    }

    return [
      'SecureAIです 🤖',
      '',
      '参照可能:',
      '・P2P / WebRTC / ICE',
      '・メッセージ検索',
      '・AIデータベース',
      '・ファイル',
      '・通話',
      '・WebGPU',
      '・モデル管理',
      '・Microsoft PKCE',
      '',
      contexts.length?
        `関連コンテキスト ${contexts.length} 件あり。`
        :'関連コンテキストなし。'
    ].join('\n');
  }
};

/* =========================================================
   AI Tool Control
   ========================================================= */

async function runAIToolCommand(
  question
){
  if(
    !featureOn('aiToolControl')||
    !state.settings.aiAllowControl
  ){
    return null;
  }

  const q=
    String(question||'')
      .trim();

  if(
    /^状態を教えて$/i.test(q)||
    /^status$/i.test(q)
  ){
    return JSON.stringify(
      getAIStatus(),
      null,
      2
    );
  }

  let m=
    q.match(
      /^ポートを\s*(\d{1,5})\s*にして$/i
    );

  if(m){
    const port=
      Number(m[1]);

    if(
      port<1||
      port>65535
    ){
      return 'ポート番号が不正です。';
    }

    state.peerServer.port=
      port;

    saveSettings();

    connectSignal();

    return(
      `優先ポートを${port}へ変更しました。`
    );
  }

  m=
    q.match(
      /^フォールバックを\s*(ON|OFF|オン|オフ)\s*にして$/i
    );

  if(m){
    const on=
      /ON|オン/i.test(
        m[1]
      );

    state.peerServer.fallbackEnabled=
      on;

    saveSettings();

    return(
      `フォールバックを${on?'ON':'OFF'}にしました。`
    );
  }

  m=
    q.match(
      /^機能\s*(.+?)\s*を\s*(ON|OFF|オン|オフ)\s*にして$/i
    );

  if(m){
    const match=
      Object.entries(
        FEATURE_META
      ).find(
        ([key,meta])=>
          key===m[1]||
          meta[0]===m[1]
      );

    if(!match){
      return(
        'その機能は見つかりません。'
      );
    }

    const on=
      /ON|オン/i.test(
        m[2]
      );

    setFeature(
      match[0],
      on
    );

    return(
      `${match[1][0]}を${on?'ON':'OFF'}にしました。`
    );
  }

  return null;
}

function aiThinking(){
  const el=
    document.createElement(
      'div'
    );

  el.className=
    'ai-msg bot ai-thinking';

  el.id=
    'aiThinking';

  el.innerHTML=`
    <div class="ai-orb">🤖</div>
    <div>
      SecureAIが確認中…
      <div id="aiThinkText" class="subtle">
        ローカルデータを検索しています…
      </div>
    </div>
  `;

  const phases=[
    '質問を解析しています…',
    'Secure Chat状態を確認しています…',
    'AIデータベースを検索しています…',
    '回答を生成しています…'
  ];

  let i=0;

  el._timer=
    setInterval(
      ()=>{
        const target=
          $('aiThinkText');

        if(target){
          target.textContent=
            phases[
              i++
              %
              phases.length
            ];
        }
      },
      650
    );

  return el;
}

async function askAI(){
  const input=
    $('aiInput');

  if(!input)return;

  const question=
    input.value.trim();

  const image=
    input.dataset.image||'';

  if(
    !question &&
    !image
  ){
    toast(
      '質問を入力してください'
    );
    return;
  }

  addAIMessage(
    'user',
    image
      ?`${question}\n[画像添付]`
      :question
  );

  state.aiHistory.push({
    role:'user',
    text:question,
    time:now()
  });

  const thinking=
    aiThinking();

  $('aiChat').appendChild(
    thinking
  );

  $('aiChat').scrollTop=
    $('aiChat').scrollHeight;

  try{
    const answer=
      await LocalAI.generate(
        question,
        image
      );

    clearInterval(
      thinking._timer
    );

    thinking.remove();

    addAIMessage(
      'assistant',
      answer
    );

    state.aiHistory.push({
      role:'assistant',
      text:answer,
      time:now()
    });

    state.aiHistory=
      state.aiHistory.slice(
        -160
      );

    if(
      state.storageReady
    ){
      await db.put(
        'meta',
        {
          id:'aiState',
          value:{
            history:
              state.aiHistory
          }
        }
      ).catch(()=>{});
    }

    input.value='';
    delete input.dataset.image;

  }catch(e){
    clearInterval(
      thinking._timer
    );

    thinking.remove();

    addAIMessage(
      'assistant',
      `SecureAIエラー: ${e.message}`
    );

    addLog(
      'ERROR',
      'SecureAI',
      e.message
    );
  }
}

function startAIVoice(){
  const Recognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

  if(!Recognition){
    toast(
      'このブラウザでは音声認識APIが利用できません'
    );
    return;
  }

  try{
    const recognition=
      new Recognition();

    recognition.lang='ja-JP';
    recognition.interimResults=false;
    recognition.maxAlternatives=1;

    recognition.onstart=
      ()=>{
        toast(
          '🎙️ 音声入力中…'
        );
      };

    recognition.onresult=
      e=>{
        $('aiInput').value=
          e.results?.[0]?.[0]?.transcript||
          '';
      };

    recognition.onerror=
      e=>{
        addLog(
          'WARN',
          'voice recognition',
          e.error||'unknown'
        );
      };

    recognition.start();

  }catch(e){
    toast(
      e.message
    );
  }
}
