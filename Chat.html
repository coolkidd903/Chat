<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <meta name="color-scheme" content="light dark">

    .title{font-weight:700}

    .file-preview img{max-width:320px;border-radius:8px}
  </style>
  <!-- CDN libs -->

<body>
  <div class="app" role="application" aria-label="Secure Chat">

        <pre id="diagOut" style="background:rgba(0,0,0,0.6);padding:8px;border-radius:8px;max-height:220px;overflow:auto;margin-top:8px">結果がここに表示されます</pre>
      </div>

        <div class="small-note">ログ</div>

        <button id="exportLogsBtn">ログをエクスポート</button>

<script>
/* Secure Chat - single-file client
 - P2P via PeerJS
 - ECDH key exchange (WebCrypto) to derive AES-GCM session key when available
 - AES-GCM (WebCrypto) for messages when session key exists, else CryptoJS AES (passphrase)
 - Fallback server via WebSocket + upload endpoint for files
 - Typing indicator (入力中)
 - ICE diagnostic tool integrated (modal-like output in right panel)
 - Screen share, call, file chunking, resume basic
*/

/* -----------------------
   Helpers & state
   ----------------------- */
const logEl = document.getElementById('log');
function appLog(...args){ const s = args.map(a=> (typeof a==='object'?JSON.stringify(a):String(a))).join(' '); logEl.textContent += '['+new Date().toLocaleTimeString()+'] '+s+'\n'; logEl.scrollTop = logEl.scrollHeight; console.log(...args); }
function setStatus(s){ document.getElementById('status').textContent = s; appLog('STATUS', s); }

function generateId(pref='id'){ return pref + '-' + Math.random().toString(36).slice(2,9); }

function base64ToArrayBuffer(b64){ const bin = atob(b64); const len = bin.length; const arr = new Uint8Array(len); for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }
function arrayBufferToBase64(buffer){ const bytes = new Uint8Array(buffer); let bin=''; for(let i=0;i<bytes.byteLength;i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }

/* crypto helpers (WebCrypto ECDH + AES-GCM) */
const CRYPTO = {
  sessionKey: null, // CryptoKey AES-GCM
  async generateECDHKeyPair(){
    const kp = await crypto.subtle.generateKey({ name:'ECDH', namedCurve:'P-256' }, true, ['deriveKey']);
    return kp;
  },
  async exportPublicJWK(key){
    return await crypto.subtle.exportKey('jwk', key);
  },
  async importPeerPublicJWK(jwk){
    return await crypto.subtle.importKey('jwk', jwk, { name:'ECDH', namedCurve:'P-256' }, true, []);
  },
  async deriveSharedKey(privateKey, peerPublicKey){
    // derive AES-GCM 256-bit key
    const derived = await crypto.subtle.deriveKey({ name:'ECDH', public:peerPublicKey }, privateKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
    return derived;
  },
  async aesGcmEncrypt(plain, key){
    const enc = new TextEncoder().encode(plain);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc);
    return { iv: arrayBufferToBase64(iv.buffer), ct: arrayBufferToBase64(ct) };
  },
  async aesGcmDecrypt(iv_b64, ct_b64, key){
    try{
      const iv = base64ToArrayBuffer(iv_b64);
      const ct = base64ToArrayBuffer(ct_b64);
      const ptBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv: new Uint8Array(iv) }, key, ct);
      return new TextDecoder().decode(ptBuf);
    }catch(e){ appLog('aesGcmDecrypt failed', e); return null; }
  }
};

/* fallback server config */
let FALLBACK = {
  origin: document.getElementById('fallbackHost').value || '', // https://fallback.example.com
  ws: null,
  clientId: null,
  ready: false
};

/* App state */
const APP = {
  peer: null,
  conn: null, // DataConnection
  currentCall: null,
  localStream: null,
  screenStream: null,
  ecdhKeyPair: null,
  typingTimer: null,
  peerRtcConfig: null
};

/* -----------------------
   UI short bindings
   ----------------------- */
const myIdEl = document.getElementById('myId');
const displayNameLabel = document.getElementById('displayNameLabel');
const copyIdBtn = document.getElementById('copyIdBtn');
const recreatePeerBtn = document.getElementById('recreatePeerBtn');
const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const peerIdInput = document.getElementById('peerIdInput');
const sendBtn = document.getElementById('sendBtn');
const msgInput = document.getElementById('msgInput');
const chatArea = document.getElementById('chatArea');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const startFallbackBtn = document.getElementById('startFallbackBtn');
const stopFallbackBtn = document.getElementById('stopFallbackBtn');
const fallbackHostInput = document.getElementById('fallbackHost');
const startDiagBtn = document.getElementById('openDiag');
const diagOut = document.getElementById('diagOut');
const diagStatus = document.getElementById('diagStatus');
const enableNotifBtn = document.getElementById('enableNotifBtn');
const autoDecryptBtn = document.getElementById('autoDecryptBtn');
const dcReliableEl = document.getElementById('dcReliable');
const dcSerializationEl = document.getElementById('dcSerialization');
const rtcConfigEl = document.getElementById('rtcConfig');
const saveRtcBtn = document.getElementById('saveRtcBtn');
const testIceBtn = document.getElementById('testIceBtn');
const callBtn = document.getElementById('callBtn');
const hangupBtn = document.getElementById('hangupBtn');
const shareScreenBtn = document.getElementById('shareScreenBtn');
const stopShareBtn = document.getElementById('stopShareBtn');
const typingIndicatorEl = document.getElementById('typingIndicator');
const exportLogsBtn = document.getElementById('exportLogsBtn');

/* -----------------------
   Initialization
   ----------------------- */

function loadSettings(){
  try{
    const s = localStorage.getItem('sc_settings_v2');
    if(s) APP.peerRtcConfig = JSON.parse(s).rtcConfig || JSON.parse(rtcConfigEl.value);
    else APP.peerRtcConfig = JSON.parse(rtcConfigEl.value);
  }catch(e){ APP.peerRtcConfig = JSON.parse(rtcConfigEl.value); }
}
loadSettings();

/* Peer creation using PeerJS with config */
function createPeer(){
  try{
    if(APP.peer){ try{ APP.peer.destroy(); }catch(e){} APP.peer=null; }
    const options = { config: APP.peerRtcConfig };
    APP.peer = new Peer(undefined, options);
    APP.peer.on('open', id => {
      myIdEl.textContent = 'ID: ' + id;
      FALLBACK.clientId = id;
      setStatus('Ready (id: ' + id + ')');
      appLog('Peer open', id);
    });
    APP.peer.on('connection', c => {
      appLog('incoming data conn', c.peer);
      if(APP.conn && APP.conn.open){ c.on('open', ()=> c.send({ type:'info', text:'busy' })); return; }
      bindDataConnection(c);
    });
    APP.peer.on('call', call => {
      appLog('incoming call', call.peer);
      if(!confirm(call.peer + ' からの通話を受けますか？')) { try{ call.close(); }catch(e){} return; }
      navigator.mediaDevices.getUserMedia({ audio:true, video:true }).then(stream => {
        attachLocalStream(stream);
        call.answer(stream);
        bindCall(call);
      }).catch(err => { alert('マイク/カメラ取得失敗: ' + err); });
    });
    APP.peer.on('error', e => { appLog('peer error', e); setStatus('Peer error'); });
    APP.peer.on('disconnected', ()=> setStatus('Peer disconnected'));
  }catch(e){
    appLog('createPeer error', e); setStatus('Peer creation failed');
  }
}
createPeer();

/* -----------------------
   DataConnection handling + ECDH handshake
   ----------------------- */

async function performECDHHandshakeAsInitiator(dc){
  try{
    APP.ecdhKeyPair = await CRYPTO.generateECDHKeyPair();
    const jwk = await CRYPTO.exportPublicJWK(APP.ecdhKeyPair.publicKey);
    // send our public
    dc.send({ type:'ecdh-pub', jwk });
    // wait for peer public (set up handler in data message)
  }catch(e){ appLog('ecdh initiator error', e); }
}

async function handleIncomingECDHPublic(jwk, dcPeer){
  try{
    if(!APP.ecdhKeyPair){
      // generate our pair as responder
      APP.ecdhKeyPair = await CRYPTO.generateECDHKeyPair();
      // send our public back
      const myJwk = await CRYPTO.exportPublicJWK(APP.ecdhKeyPair.publicKey);
      dcPeer.send({ type:'ecdh-pub', jwk: myJwk });
    }
    const peerPub = await CRYPTO.importPeerPublicJWK(jwk);
    const sessionKey = await CRYPTO.deriveSharedKey(APP.ecdhKeyPair.privateKey, peerPub);
    APP.sessionKey = sessionKey; appLog('Session AES key established via ECDH');
  }catch(e){ appLog('handleIncomingECDHPublic err', e); }
}

/* DataConnection bind */
function bindDataConnection(dc){
  APP.conn = dc;
  dc.on('open', async ()=> {
    appLog('DataConnection open to', dc.peer);
    setStatus('Connected to ' + dc.peer);
    // start ECDH handshake
    await performECDHHandshakeAsInitiator(dc);
    // listen for messages (below done in ondata)
  });
  dc.on('data', async (data) => {
    try{
      if(typeof data !== 'object'){ appLog('non-object data', data); return; }
      if(data.type === 'ecdh-pub'){ await handleIncomingECDHPublic(data.jwk, dc); return; }
      if(data.type === 'msg'){
        // decrypt
        const pass = document.getElementById('passphrase').value || '';
        let plain = null;
        if(APP.sessionKey){
          // AES-GCM: expect data.payload = {iv, ct}
          plain = await CRYPTO.aesGcmDecrypt(data.payload.iv, data.payload.ct, APP.sessionKey);
        } else if(pass){
          try{ plain = CryptoJS.AES.decrypt(data.payload, pass).toString(CryptoJS.enc.Utf8); }catch(e){ plain = null; }
        } else {
          plain = data.payload;
        }
        if(plain === null) appendChat('you', '(復号失敗)');
        else appendChat('you', plain);
      } else if(data.type === 'typing'){
        showTypingIndicator(true, data.from);
      } else if(data.type === 'sticker'){
        const pass = document.getElementById('passphrase').value || '';
        const d = APP.sessionKey ? await CRYPTO.aesGcmDecrypt(data.payload.iv, data.payload.ct, APP.sessionKey) : (pass ? CryptoJS.AES.decrypt(data.payload, pass).toString(CryptoJS.enc.Utf8) : data.payload);
        if(d) appendImage('you', d); else appendChat('you','(スタンプ復号失敗)');
      } else if(data.type === 'file-chunk'){
        // process chunk
        handleIncomingChunk(data);
      } else {
        appLog('unknown data type', data);
      }
    }catch(e){ appLog('data handler err', e); }
  });
  dc.on('close', ()=> { appLog('data closed'); setStatus('データ切断'); APP.conn=null; });
  dc.on('error', e => { appLog('conn error', e); setStatus('Conn error'); });
}

/* -----------------------
   Sending messages (P2P first, fallback) + typing indicator
   ----------------------- */

let typingTimeout = null;
msgInput.addEventListener('input', ()=>{
  sendTypingIndicator(true);
  if(typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(()=> sendTypingIndicator(false), 1500);
});

function sendTypingIndicator(flag){
  // show locally
  typingIndicatorEl.textContent = flag ? '入力中…' : '';
  // send via p2p or fallback
  const payload = { type:'typing', from: APP.peer && APP.peer.id ? APP.peer.id : 'me', value: flag };
  if(APP.conn && APP.conn.open){
    try{ APP.conn.send(payload); } catch(e){ appLog('typing send err', e); }
  } else if(FALLBACK.ready && FALLBACK.ws){
    try{ FALLBACK.ws.send(JSON.stringify({ type:'send', to: peerIdInput.value.trim(), payload })); }catch(e){ appLog('typing fallback send err', e); }
  }
}

/* send chat message */
sendBtn.addEventListener('click', ()=> sendMessage());
msgInput.addEventListener('keydown', (e)=> { if((e.ctrlKey||e.metaKey) && e.key === 'Enter'){ e.preventDefault(); sendMessage(); } });

async function sendMessage(){
  const text = msgInput.value.trim(); if(!text) return;
  const pass = document.getElementById('passphrase').value || '';
  // encrypt with sessionKey if present
  let payload;
  if(APP.sessionKey){
    payload = await CRYPTO.aesGcmEncrypt(text, APP.sessionKey); // {iv, ct}
    // send object
    const obj = { type:'msg', payload };
    if(APP.conn && APP.conn.open){ APP.conn.send(obj); appendChat('me', text); msgInput.value=''; return; }
  } else {
    const cipher = pass ? CryptoJS.AES.encrypt(text, pass).toString() : text;
    const obj = { type:'msg', payload: cipher };
    if(APP.conn && APP.conn.open){ APP.conn.send(obj); appendChat('me', text); msgInput.value=''; return; }
  }
  // fallback via server
  if(!FALLBACK.ready) startFallback();
  await new Promise(r=>setTimeout(r,300));
  if(FALLBACK.ws && FALLBACK.ws.readyState === WebSocket.OPEN){
    const outPayload = (APP.sessionKey) ? { type:'ecg-msg', payload: await CRYPTO.aesGcmEncrypt(text, APP.sessionKey) } : (pass ? CryptoJS.AES.encrypt(text, pass).toString() : text);
    // send via send protocol
    try{ FALLBACK.ws.send(JSON.stringify({ type:'send', to: peerIdInput.value.trim(), payload: outPayload })); appendChat('me', text + ' (via server)'); msgInput.value=''; }catch(e){ appLog('fallback send err', e); appendChat('me','(送信失敗) '+text); }
  } else {
    appendChat('me','(送信失敗: no route) ' + text);
  }
}

/* UI append functions */
function appendChat(who, text){
  const el = document.createElement('div'); el.className = 'msg ' + (who==='me' ? 'me' : 'you'); el.innerHTML = '<div>' + escapeHtml(text) + '</div><div class="msg-meta">' + new Date().toLocaleTimeString() + '</div>';
  chatArea.appendChild(el); chatArea.scrollTop = chatArea.scrollHeight;
}
function appendImage(who, dataUrl){
  const el = document.createElement('div'); el.className = 'msg ' + (who==='me' ? 'me' : 'you'); const img = document.createElement('img'); img.src = dataUrl; img.style.maxWidth='320px'; img.style.borderRadius='8px'; el.appendChild(img); const meta = document.createElement('div'); meta.className='msg-meta'; meta.textContent = new Date().toLocaleTimeString(); el.appendChild(meta); chatArea.appendChild(el); chatArea.scrollTop = chatArea.scrollHeight;
}
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* show typing indicator (from peer) */
let remoteTypingTimer = null;
function showTypingIndicator(flag, from){
  if(flag){ typingIndicatorEl.textContent = (from ? from + ' が入力中…' : '入力中…'); if(remoteTypingTimer) clearTimeout(remoteTypingTimer); remoteTypingTimer = setTimeout(()=> showTypingIndicator(false), 3000); }
  else { typingIndicatorEl.textContent = ''; if(remoteTypingTimer){ clearTimeout(remoteTypingTimer); remoteTypingTimer = null; } }
}

/* -----------------------
   File chunking send/receive (P2P) and server upload fallback
   ----------------------- */
const CHUNK_SIZE = 60 * 1024;
const incomingFileStore = {}; // id -> {chunks:[], total, meta}

attachBtn.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', async (e)=>{
  const f = e.target.files[0]; if(!f) return;
  // if P2P available and file not huge, try chunk send
  if(APP.conn && APP.conn.open && f.size < 50 * 1024 * 1024){
    // read as dataURL
    const dataUrl = await readFileAsDataURL(f);
    // encrypt if sessionKey or pass
    const pass = document.getElementById('passphrase').value || '';
    let payloadStr;
    if(APP.sessionKey){
      const enc = await CRYPTO.aesGcmEncrypt(dataUrl, APP.sessionKey); // {iv, ct}
      payloadStr = JSON.stringify({ iv: enc.iv, ct: enc.ct, encrypted: 'gcm' });
    } else if(pass){
      payloadStr = CryptoJS.AES.encrypt(dataUrl, pass).toString();
    } else payloadStr = dataUrl;
    const total = Math.ceil(payloadStr.length / CHUNK_SIZE);
    const id = generateId('file');
    // send file-meta first
    APP.conn.send({ type:'file-meta', id, filename: f.name, total });
    for(let i=0;i<total;i++){
      const chunk = payloadStr.slice(i*CHUNK_SIZE, (i+1)*CHUNK_SIZE);
      APP.conn.send({ type:'file-chunk', id, index:i, data: chunk });
      await new Promise(r=>setTimeout(r, 10));
    }
    appendChat('me', 'ファイル送信: ' + f.name + ' (P2P)');
  } else {
    // fallback: upload to server and notify via ws
    try{
      const resp = await uploadFileToServer(f);
      appendChat('me', 'ファイル送信 (server): ' + f.name);
      // notify recipient via fallback web socket
      if(FALLBACK.ready && FALLBACK.ws && FALLBACK.ws.readyState === WebSocket.OPEN){
        const payload = { type:'file', meta: { fileUrl: FALLBACK.origin + resp.url, filename: resp.originalName, size: resp.size } };
        FALLBACK.ws.send(JSON.stringify({ type:'send', to: peerIdInput.value.trim(), payload }));
      } else {
        appLog('notifying via ws failed: not connected');
      }
    }catch(err){ appLog('upload failed', err); alert('アップロード失敗: ' + err); }
  }
  fileInput.value = '';
});

function readFileAsDataURL(file){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = ()=> res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }

function handleIncomingChunk(obj){
  const { id, index, data, filename, total } = obj;
  incomingFileStore[id] = incomingFileStore[id] || { chunks: [], total: total || obj.total, filename: filename || obj.filename, ts: Date.now() };
  incomingFileStore[id].chunks[index] = data;
  const st = incomingFileStore[id];
  // check complete
  if(st.chunks.filter(Boolean).length === st.total){
    const full = st.chunks.join('');
    delete incomingFileStore[id];
    // decrypt if necessary: we don't know method so try AES-GCM with sessionKey first, else passphrase
    (async ()=>{
      if(APP.sessionKey){
        try{
          const o = JSON.parse(full);
          const dec = await CRYPTO.aesGcmDecrypt(o.iv, o.ct, APP.sessionKey);
          appendImage('you', dec);
          return;
        }catch(e){}
      }
      const pass = document.getElementById('passphrase').value || '';
      if(pass){
        try{
          const plain = CryptoJS.AES.decrypt(full, pass).toString(CryptoJS.enc.Utf8);
          appendImage('you', plain);
          return;
        }catch(e){}
      }
      // fallback: assume dataURL
      appendImage('you', full);
    })();
  }
}

/* -----------------------
   Server fallback (WebSocket, upload)
   ----------------------- */

function startFallback(){
  if(FALLBACK.ready) return;
  FALLBACK.origin = fallbackHostInput.value.trim() || FALLBACK.origin || '';
  let wsUrl = FALLBACK.origin.replace(/^http/, 'ws');
  if(wsUrl.startsWith('https:')) wsUrl = wsUrl.replace('https:', 'wss:');
  if(wsUrl.startsWith('http:')) wsUrl = wsUrl.replace('http:', 'ws:');
  try{
    FALLBACK.ws = new WebSocket(wsUrl);
    FALLBACK.ws.onopen = ()=> { FALLBACK.ready = true; appLog('fallback ws open'); setStatus('Fallback ready'); FALLBACK.ws.send(JSON.stringify({ type:'register', clientId: APP.peer? APP.peer.id: generateId('client') })); };
    FALLBACK.ws.onmessage = (ev)=> {
      try{
        const msg = JSON.parse(ev.data);
        if(msg.type === 'message'){ // from server
          const payload = msg.payload;
          if(typeof payload === 'string'){ // maybe encrypted string
            const pass = document.getElementById('passphrase').value || '';
            if(pass){ const dec = CryptoJS.AES.decrypt(payload, pass).toString(CryptoJS.enc.Utf8); appendChat('you', dec || '(復号失敗)'); }
            else appendChat('you', payload);
          } else if(payload && payload.type === 'file'){
            appendSystem('ファイル受信 (server): ' + payload.meta.filename + ' ' + payload.meta.fileUrl);
          } else {
            appendChat('you', JSON.stringify(payload));
          }
        } else {
          appLog('ws msg', msg);
        }
      }catch(e){ appLog('ws onmessage parse', e); }
    };
    FALLBACK.ws.onclose = ()=> { FALLBACK.ready=false; appLog('fallback ws closed'); setStatus('Fallback closed'); };
    FALLBACK.ws.onerror = (e)=> { appLog('fallback ws error', e); setStatus('Fallback error'); };
    setStatus('Fallback connecting...');
  }catch(e){ appLog('startFallback err', e); }
}

function stopFallback(){
  try{ if(FALLBACK.ws) FALLBACK.ws.close(); }catch(e){}
  FALLBACK.ws = null; FALLBACK.ready=false; setStatus('Fallback stopped'); appLog('fallback stopped');
}

/* upload to server */
async function uploadFileToServer(file){
  const origin = FALLBACK.origin || fallbackHostInput.value.trim();
  if(!origin) throw new Error('fallback host not set');
  const form = new FormData(); form.append('file', file);
  const res = await fetch(origin + '/upload', { method:'POST', body: form });
  if(!res.ok) throw new Error('upload failed: ' + res.status);
  return await res.json();
}

/* -----------------------
   Call / screen share
   ----------------------- */

function attachLocalStream(stream){
  APP.localStream = stream;
  try{ localVideo.srcObject = stream; }catch(e){ localVideo.src = URL.createObjectURL(stream); }
}

callBtn.addEventListener('click', async ()=>{
  const target = peerIdInput.value.trim(); if(!target) return alert('相手IDを入力');
  try{
    const s = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
    attachLocalStream(s);
    const call = APP.peer.call(target, s);
    bindCall(call);
  }catch(e){ alert('マイク/カメラ取得失敗: ' + e); appLog(e); }
});

function bindCall(call){
  APP.currentCall = call;
  call.on('stream', stream => { attachRemoteStream(stream); });
  call.on('close', ()=> { appLog('call closed'); teardownCall(); });
  call.on('error', e => { appLog('call error', e); teardownCall(); });
}

function attachRemoteStream(stream){
  APP.remoteStream = stream;
  try{ remoteVideo.srcObject = stream; }catch(e){ remoteVideo.src = URL.createObjectURL(stream); }
}

function teardownCall(){
  try{ if(APP.currentCall) APP.currentCall.close(); }catch(e){}
  APP.currentCall = null;
  if(APP.localStream){ APP.localStream.getTracks().forEach(t=>t.stop()); APP.localStream = null; localVideo.srcObject = null; }
  if(APP.remoteStream){ APP.remoteStream.getTracks().forEach(t=>t.stop()); APP.remoteStream = null; remoteVideo.srcObject = null; }
}

hangupBtn.addEventListener('click', ()=> teardownCall());

shareScreenBtn.addEventListener('click', async ()=>{
  try{
    const screen = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:false });
    APP.screenStream = screen;
    // if in call, replace video track
    if(APP.currentCall && APP.currentCall.peerConnection){
      try{
        const pc = APP.currentCall.peerConnection;
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        const track = screen.getVideoTracks()[0];
        if(sender && sender.replaceTrack) sender.replaceTrack(track);
        else { // fallback: close and re-call
          const target = APP.currentCall.peer;
          APP.currentCall.close();
          const call = APP.peer.call(target, screen);
          bindCall(call);
        }
      }catch(e){ appLog('replaceTrack failed', e); }
    } else {
      // show locally
      localVideo.srcObject = screen;
    }
    screen.getVideoTracks()[0].addEventListener('ended', ()=> {
      appendSystem('画面共有停止');
      if(APP.localStream) localVideo.srcObject = APP.localStream;
      APP.screenStream = null;
    });
    appendSystem('画面共有を開始しました');
  }catch(e){ alert('画面共有に失敗: ' + e); }
});

stopShareBtn.addEventListener('click', ()=> {
  if(APP.screenStream){ APP.screenStream.getTracks().forEach(t=>t.stop()); APP.screenStream=null; appendSystem('共有停止'); if(APP.localStream) localVideo.srcObject = APP.localStream; }
});

/* -----------------------
   Diagnostics (ICE)
   ----------------------- */

async function runDiagnostic(policy=null){
  diagOut.textContent = '';
  diagStatus.textContent = 'running';
  setStatus('診断実行中…');
  let config;
  try{ config = JSON.parse(rtcConfigEl.value); }catch(e){ diagOut.textContent = 'RTC config JSON parse error'; diagStatus.textContent='error'; setStatus('診断エラー'); return; }
  if(policy) config.iceTransportPolicy = policy;
  diagOut.textContent += 'ICE Servers: ' + JSON.stringify(config.iceServers || []) + '\\n';
  let pc;
  try{
    pc = new RTCPeerConnection(config);
  }catch(e){ diagOut.textContent += 'RTCPeerConnection create error: '+e; diagStatus.textContent='error'; setStatus('診断エラー'); return; }
  const found = { host:0, srflx:0, relay:0, other:0 };
  pc.onicecandidate = e => {
    if(e.candidate && e.candidate.candidate){
      diagOut.textContent += e.candidate.candidate + '\\n';
      const line = ' ' + e.candidate.candidate;
      if(line.includes(' typ host')) found.host++;
      else if(line.includes(' typ srflx')) found.srflx++;
      else if(line.includes(' typ relay')) found.relay++;
      else found.other++;
    }
  };
  pc.createDataChannel('diag');
  try{ const offer = await pc.createOffer(); await pc.setLocalDescription(offer); }catch(e){ diagOut.textContent += 'offer error '+e+'\\n'; }
  await new Promise(r=>setTimeout(r,4000));
  diagOut.textContent += '\\nSummary: host:'+found.host+' srflx:'+found.srflx+' relay:'+found.relay+' other:'+found.other+'\\n';
  diagStatus.textContent = 'done';
  setStatus('診断完了');
  try{ pc.close(); }catch(e){}
}

startDiagBtn.addEventListener('click', ()=> runDiagnostic());

/* -----------------------
   WebSocket fallback quick start (simple)
   ----------------------- */
function startFallback(){
  if(FALLBACK.ready) return;
  FALLBACK.origin = fallbackHostInput.value.trim() || FALLBACK.origin;
  if(!FALLBACK.origin){ alert('fallback host を設定してください'); return; }
  let wsUrl = FALLBACK.origin.replace(/^http(s)?:/,'ws:');
  if(FALLBACK.origin.startsWith('https:')) wsUrl = FALLBACK.origin.replace(/^https:/,'wss:');
  FALLBACK.ws = new WebSocket(wsUrl);
  FALLBACK.ws.onopen = ()=> { FALLBACK.ready = true; setStatus('Fallback ready'); appLog('fallback ws connected'); FALLBACK.clientId = APP.peer && APP.peer.id ? APP.peer.id : generateId('client'); FALLBACK.ws.send(JSON.stringify({ type:'register', clientId: FALLBACK.clientId })); };
  FALLBACK.ws.onmessage = ev => {
    try{
      const msg = JSON.parse(ev.data);
      if(msg.type === 'message'){ // message from server
        const payload = msg.payload;
        if(typeof payload === 'string'){ // encrypted string (passphrase)
          const pass = document.getElementById('passphrase').value || '';
          if(pass){ const dec = CryptoJS.AES.decrypt(payload, pass).toString(CryptoJS.enc.Utf8); appendChat('you', dec || '(復号失敗)'); } else appendChat('you', payload);
        } else if(payload && payload.type === 'file') appendSystem('ファイル (server): ' + payload.meta.filename + ' ' + payload.meta.fileUrl);
        else appendChat('you', JSON.stringify(payload));
      } else appLog('fallback ws msg', msg);
    }catch(e){ appLog('ws parse err', e); }
  };
  FALLBACK.ws.onclose = ()=> { FALLBACK.ready=false; setStatus('Fallback closed'); appLog('fallback closed'); };
  FALLBACK.ws.onerror = e => { appLog('fallback error', e); setStatus('Fallback error'); };
}

/* allow automatic fallback when P2P doesn't open after timeout */
let connectAttemptTimer = null;
connectBtn.addEventListener('click', ()=> {
  const target = peerIdInput.value.trim(); if(!target) return alert('相手のPeerIDを入力');
  // attempt data connect
  if(!APP.peer){ createPeer(); setTimeout(()=> connectBtn.click(), 300); return; }
  if(APP.conn && APP.conn.open){ if(!confirm('既に接続中です。上書きしますか？')) return; APP.conn.close(); APP.conn=null; }
  const opts = { reliable: !!dcReliableEl.checked, serialization: dcSerializationEl.value };
  const c = APP.peer.connect(target, opts);
  bindDataConnection(c);
  // wait 8s for open, else fallback
  if(connectAttemptTimer) clearTimeout(connectAttemptTimer);
  connectAttemptTimer = setTimeout(()=> {
    if(!(APP.conn && APP.conn.open)){
      appLog('P2P not ready after timeout, enabling fallback');
      startFallback();
      appendSystem('P2P接続が不安定なため、サーバフォールバックを有効化しました');
    }
  }, 8000);
});

/* helper to append system messages quickly */
function appendSystem(msg){ const el = document.createElement('div'); el.className='msg you'; el.style.opacity=0.6; el.innerHTML = '<div><em>'+escapeHtml(msg)+'</em></div>'; chatArea.appendChild(el); chatArea.scrollTop=chatArea.scrollHeight; }
