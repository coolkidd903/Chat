/* =========================================================
   Model Manager
   ========================================================= */

class ModelManager{
  constructor(){
    this.db=null;
    this.chunkSize=
      4*1024*1024;
  }

  async open(){
    if(this.db){
      return this.db;
    }

    this.db=
      await new Promise(
        (resolve,reject)=>{
          const req=
            indexedDB.open(
              APP.modelDbName,
              APP.modelDbVersion
            );

          req.onupgradeneeded=()=>{
            const db=req.result;

            if(
              !db.objectStoreNames.contains(
                'meta'
              )
            ){
              db.createObjectStore(
                'meta',
                {keyPath:'id'}
              );
            }

            if(
              !db.objectStoreNames.contains(
                'chunks'
              )
            ){
              const store=
                db.createObjectStore(
                  'chunks',
                  {keyPath:'key'}
                );

              store.createIndex(
                'modelIndex',
                ['modelId','index'],
                {unique:true}
              );
            }
          };

          req.onsuccess=
            ()=>resolve(
              req.result
            );

          req.onerror=
            ()=>reject(
              req.error
            );
        }
      );

    return this.db;
  }

  async getMeta(
    id='default'
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const req=
          db.transaction(
            'meta',
            'readonly'
          ).objectStore(
            'meta'
          ).get(id);

        req.onsuccess=
          ()=>resolve(
            req.result||
            null
          );

        req.onerror=
          ()=>reject(
            req.error
          );
      }
    );
  }

  async putMeta(
    meta
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'meta',
            'readwrite'
          );

        tx.objectStore(
          'meta'
        ).put(meta);

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );
  }

  async putChunk(
    modelId,
    index,
    data
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'chunks',
            'readwrite'
          );

        tx.objectStore(
          'chunks'
        ).put({
          key:
            `${modelId}:${index}`,
          modelId,
          index,
          data
        });

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );
  }

  async getChunks(
    modelId
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const req=
          db.transaction(
            'chunks',
            'readonly'
          ).objectStore(
            'chunks'
          ).index(
            'modelIndex'
          ).getAll(
            IDBKeyRange.bound(
              [modelId,0],
              [
                modelId,
                Number.MAX_SAFE_INTEGER
              ]
            )
          );

        req.onsuccess=
          ()=>resolve(
            (req.result||[])
              .sort(
                (a,b)=>
                  a.index-
                  b.index
              )
          );

        req.onerror=
          ()=>reject(
            req.error
          );
      }
    );
  }

  async clear(
    modelId='default'
  ){
    const db=
      await this.open();

    const chunks=
      await this.getChunks(
        modelId
      );

    await new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'chunks',
            'readwrite'
          );

        const os=
          tx.objectStore(
            'chunks'
          );

        for(
          const chunk of
          chunks
        ){
          os.delete(
            chunk.key
          );
        }

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );

    await new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'meta',
            'readwrite'
          );

        tx.objectStore(
          'meta'
        ).delete(
          modelId
        );

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );
  }

  async download(
    url,
    modelId='default'
  ){
    if(!url){
      throw new Error(
        'モデルURLが未設定です'
      );
    }

    showModelProgress(
      0,
      'モデルへ接続しています…'
    );

    const response=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    if(!response.ok){
      throw new Error(
        `モデルHTTP ${response.status}`
      );
    }

    if(!response.body){
      throw new Error(
        'ReadableStreamが利用できません'
      );
    }

    const total=
      Number(
        response.headers.get(
          'content-length'
        )
      )||
      0;

    const reader=
      response.body.getReader();

    let buffer=
      new Uint8Array(0);

    let received=0;
    let index=0;

    while(true){
      const {
        done,
        value
      }=
        await reader.read();

      if(done)break;

      const incoming=
        value||
        new Uint8Array(0);

      const merged=
        new Uint8Array(
          buffer.length+
          incoming.length
        );

      merged.set(
        buffer,
        0
      );

      merged.set(
        incoming,
        buffer.length
      );

      buffer=
        merged;

      received+=
        incoming.length;

      while(
        buffer.length>=
        this.chunkSize
      ){
        const chunk=
          buffer.slice(
            0,
            this.chunkSize
          );

        await this.putChunk(
          modelId,
          index++,
          chunk
        );

        buffer=
          buffer.slice(
            this.chunkSize
          );

        const percent=
          total
            ?received/total*100
            :0;

        showModelProgress(
          percent,
          total
            ?`${percent.toFixed(1)}% · ${formatBytes(received)} / ${formatBytes(total)}`
            :`${formatBytes(received)} 受信中…`
        );
      }

      const percent=
        total
          ?received/total*100
          :0;

      showModelProgress(
        percent,
        total
          ?`${percent.toFixed(1)}% · ${formatBytes(received)} / ${formatBytes(total)}`
          :`${formatBytes(received)} 受信中…`
      );
    }

    if(
      buffer.length
    ){
      await this.putChunk(
        modelId,
        index++,
        buffer
      );
    }

    const meta={
      id:modelId,
      url,
      size:received,
      chunks:index,
      format:
        state.settings.localModelFormat,
      model:
        state.settings.aiModel||
        state.settings.localModelName,
      savedAt:now()
    };

    await this.putMeta(
      meta
    );

    state.modelMeta=
      meta;

    showModelProgress(
      100,
      `完了 · ${formatBytes(received)} · ${index} chunks`
    );

    addLog(
      'INFO',
      'model cached',
      JSON.stringify(meta)
    );

    return meta;
  }
}

const modelManager=
  new ModelManager();

function showModelProgress(
  percent,
  text
){
  const wrap=
    $('modelProgressWrap');

  const bar=
    $('modelProgress');

  const label=
    $('modelProgressText');

  if(!wrap)return;

  wrap.style.display=
    'block';

  const p=
    Math.max(
      0,
      Math.min(
        100,
        Number(percent)||0
      )
    );

  bar.style.width=
    p+'%';

  label.textContent=
    String(text||'');
}

function testSinglePort(
  port
){
  return new Promise(
    resolve=>{
      const start=
        performance.now();

      let done=false;

      let ws;

      try{
        ws=
          new WebSocket(
            signalURL(port)
          );
      }catch{
        resolve({
          port,
          ok:false,
          error:'constructor',
          ms:0
        });

        return;
      }

      const timer=
        setTimeout(
          ()=>{
            if(done)return;

            done=true;

            try{
              ws.close();
            }catch{}

            resolve({
              port,
              ok:false,
              error:'timeout',
              ms:Math.round(
                performance.now()-
                start
              )
            });
          },
          Math.min(
            5000,
            state.peerServer.fallbackTimeoutMs
          )
        );

      ws.onopen=
        ()=>{
          if(done)return;

          done=true;

          clearTimeout(
            timer
          );

          const ms=
            Math.round(
              performance.now()-
              start
            );

          try{
            ws.close();
          }catch{}

          resolve({
            port,
            ok:true,
            ms
          });
        };

      ws.onerror=
        ()=>{
          if(done)return;

          done=true;

          clearTimeout(
            timer
          );

          try{
            ws.close();
          }catch{}

          resolve({
            port,
            ok:false,
            error:'error',
            ms:Math.round(
              performance.now()-
              start
            )
          });
        };
    }
  );
}

async function testPorts(){
  showModal(`
    <h3>🔁 接続先診断</h3>

    <p class="help">
      診断だけを行います。

    </div>

    <div class="actions">
      <button
        class="btn"
        data-close
      >
        閉じる
      </button>
    </div>
  `);

  const result=[];

  for(
    const port of
    signalingPorts()
  ){
    const r=
      await testSinglePort(
        port
      );

    result.push(

  );
}

async function readICEStats(
  pc
){
  const data={
    localCandidates:[],
    remoteCandidates:[],
    candidatePairs:[],
    transports:[]
  };

  try{
    const stats=
      await pc.getStats();

    stats.forEach(
      r=>{
        if(
          r.type==='local-candidate'
        ){
          data.localCandidates.push({
            type:r.candidateType,
            protocol:r.protocol,
            address:
              r.address||
              r.ip,
            port:r.port,
            url:r.url
          });
        }

        if(
          r.type==='remote-candidate'
        ){
          data.remoteCandidates.push({
            type:r.candidateType,
            protocol:r.protocol,
            address:
              r.address||
              r.ip,
            port:r.port
          });
        }

        if(
          r.type==='candidate-pair' &&
          (
            r.state==='succeeded'||
            r.nominated
          )
        ){
          data.candidatePairs.push({
            state:r.state,
            nominated:
              !!r.nominated,
            protocol:r.protocol,
            rtt:
              r.currentRoundTripTime,
            bytesSent:r.bytesSent,
            bytesReceived:r.bytesReceived
          });
        }

        if(
          r.type==='transport'
        ){
          data.transports.push({
            dtlsState:
              r.dtlsState,
            iceState:
              r.iceState,
            selectedPair:
              r.selectedCandidatePairId
          });
        }
      }
    );

  }catch(e){
    addLog(
      'WARN',
      'getStats failed',
      e.message
    );
  }

  return data;
}

async function runICEDiagnostic(){
  let pc=
    null;

  try{
    pc=
      new RTCPeerConnection({
        iceServers:
          getIceServers()
      });

    pc.createDataChannel(
      'ice-diagnostic'
    );

    await pc.setLocalDescription(
      await pc.createOffer()
    );

    const end=
      now()+8000;

    while(
      pc.iceGatheringState!=='complete' &&
      now()<end
    ){
      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            150
          )
      );
    }

    const stats=
      await readICEStats(
        pc
      );

    const report={
      generatedAt:
        new Date().toISOString(),
      peerId:state.id,
      webRTC:
        !!window.RTCPeerConnection,
      webGPU:
        !!navigator.gpu,
      webSocket:
        state.wsReady,
      gathering:
        pc.iceGatheringState,
      ice:
        pc.iceConnectionState,
      connection:
        pc.connectionState,
      interpretation:(pc.iceConnectionState==='new'&&pc.connectionState==='new')
        ?'これは接続相手なしのICE候補収集テストです。remoteCandidates / candidatePairs が空でも異常とは限りません。'
        :'ICE接続状態を取得しました。',
      stats
    };

    showICEDiagnostic(
      report
    );

  }catch(e){
    showModal(`
      <h3>🧪 ICE診断</h3>
      <div class="warnbox">
        ${esc(e.message)}
      </div>
      <div class="actions">
        <button class="btn" data-close>
          閉じる
        </button>
      </div>
    `);

  }finally{
    try{
      pc?.close();
    }catch{}
  }
}

async function ensureMedia(){
  if(
    state.localStream
  ){
    return state.localStream;
  }

  if(
    !navigator.mediaDevices?.getUserMedia
  ){
    throw new Error(
      'getUserMediaが利用できません'
    );
  }

  state.localStream=
    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

  $('localVideo').srcObject=
    state.localStream;

  return state.localStream;
}

async function startCall(
  remote
){
  try{
    await ensureMedia();

    const c=
      createRTC(
        remote,
        'media',
        true,
        {
          name:state.name
        }
      );

    for(
      const track of
      state.localStream.getTracks()
    ){
      c.pc.addTrack(
        track,
        state.localStream
      );
    }

    $('videoStage')
      .classList
      .add('show');

    $('callName').textContent=
      callDisplayName(remote);

    state.callPeer=
      remote;

    await createOffer(
      c
    );

    saveCall(
      remote,
      'outgoing'
    );

    ensureWakeLock();

  }catch(e){
    toast(
      `通話開始失敗: ${e.message}`
    );

    addLog(
      'ERROR',
      'call start',
      e.message
    );
  }
}

function saveCall(
  peer,

){
  const item={
    id:uid('call'),

    direction,
    time:now()
  };

  if(!track)return;

  track.enabled=

  $('micBtn').textContent=

      ?'🎙️'

}

function toggleCam(){
  const track=
    state.localStream
      ?.getVideoTracks()
      ?. [0];

  if(!track)return;

  track.enabled=
    !track.enabled;

  $('camBtn').textContent=
    track.enabled
      ?'📷'
      :'🚫';
}

async function ensureWakeLock(){
  if(
    !featureOn('wakeLock')||
    !navigator.wakeLock?.request||
    state.wakeLock
  ){
    return;
  }

  try{
    state.wakeLock=
      await navigator.wakeLock.request(
        'screen'
      );

    state.wakeLock.addEventListener(
      'release',
      ()=>{
        state.wakeLock=null;
      }
    );

  }catch{}
}

async function releaseWakeLock(){
  if(
    !state.wakeLock
  ){
    return;
  }

  try{
    await state.wakeLock.release();
  }catch{}

  state.wakeLock=null;
}

function hangup(){
  for(
    const [key,c] of
    state.connections
  ){
    if(
      c.kind==='media'
    ){
      try{
        c.pc.close();
      }catch{}

      state.connections.delete(
        key
      );
    }
  }

  if(
    state.localStream
  ){
    for(
      const track of
      state.localStream.getTracks()
    ){
      track.stop();
    }
  }

  state.localStream=
    null;

  state.callPeer=
    null;

  $('localVideo').srcObject=
    null;

  $('remoteVideo').srcObject=
    null;

  $('videoStage')
    .classList
    .remove('show');

  releaseWakeLock();

  toast(
    '通話を終了しました'
  );
}

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(
      document.visibilityState===
        'visible' &&
      state.callPeer
    ){
      ensureWakeLock();
    }
  }
);

async function createGroup(
  name,
  peers
){
  const normalized=
    [
      ...new Set(
        peers
          .filter(
            validPeerId
          )
          .filter(
            id=>id!==state.id
          )
      )
    ];

  if(
    !normalized.length
  ){
    toast(
      '参加者がありません'
    );
    return;
  }

  const group={
    id:uid('group'),
    name:
      name||
      'グループ',
    peers:normalized,
    owner:state.id,
    created:now()
  };

  state.groups.push(
    group
  );

  if(
    state.storageReady
  ){
    await db.put(
      'groups',
      group
    ).catch(()=>{});
  }

  for(
    const peer of
    normalized
  ){
    try{
      await sendControlObject(
        peer,
        {
          type:'group-invite',
          group
        }
      );
    }catch{
      addLog(
        'WARN',
        'group invite failed',
        peer
      );
    }
  }

  renderList();

  toast(
    `👥 ${group.name} を作成しました`
  );
}

async function sendGroupMessage(
  group,
  text
){
  for(
    const peer of
    group.peers
  ){
    try{
      await sendControlObject(
        peer,
        {
          type:'group-chat',
          groupId:group.id,
          text
        }
      );
    }catch{}
  }
}

async function exportBackup(
  extension,
  encrypted
){
  let payload=
    backupPayload();

  let text='';
  let mime=
    'application/json';

  if(
    encrypted
  ){
    const password=
      prompt(
        'バックアップ暗号化パスフレーズ'
      );

    if(!password)return;

    const packet=
      await encryptJSON(
        payload,
        password
      );

    text=
      JSON.stringify(
        {
          encrypted:true,
          value:packet
        },
        null,
        2
      );

  }else if(
    extension===
    '.csv'
  ){
    const rows=[
      [
        'id',
        'peer',
        'from',
        'time',
        'type',
        'text'
      ]
    ];

      const message of
      state.chats
    ){
      rows.push([
        message.id,
        message.peer,
        message.from,
        new Date(
          message.time
        ).toISOString(),
        message.type,
        String(
          message.text||
          ''
        ).replace(
          /"/g,
          '""'
        )
      ]);
    }

    text=
      rows.map(
        row=>
          row
            .map(
              cell=>
                `"${cell}"`
            )
            .join(',')
      ).join('\n');

    mime=
      'text/csv;charset=utf-8';

  }else if(
    extension===
    '.md'
  ){

      `Peer ID: ${state.id}`,
      `Name: ${state.name}`,

      ''
    ];

      const message of
      state.chats
    ){
      lines.push(
        `### ${contactName(message.from)} · ${formatDate(message.time)}`
      );

      lines.push(
        ''
      );

      lines.push(
        message.text||
        `[${message.type}]`
      );

      lines.push(
        ''
      );
    }

    text=
      lines.join('\n');

    mime=
      'text/markdown;charset=utf-8';

  }else if(
    extension===
    '.html'
  ){
    const body=
      state.chats
        .map(
          m=>`
            <article>
              <h3>${esc(contactName(m.from))}</h3>
              <time>${esc(formatDate(m.time))}</time>
              <p>${esc(m.text||'')}</p>
            </article>
          `
        )
        .join('\n');

    text=
      `<!doctype html>
<meta charset="utf-8">
<title>Secure Chat Archive</title>
<h1>Secure Chat Archive</h1>
${body}`;

    mime=
      'text/html;charset=utf-8';

  }else{
    text=
      JSON.stringify(
        payload,
        null,
        2
      );
  }

  const blob=
    new Blob(
      [text],
      {
        type:mime
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const a=
    document.createElement(
      'a'
    );

  a.href=url;

  a.download=
    `secure-chat-${new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        '-'
      )}${extension}`;

  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    5000
  );

  addLog(
    'INFO',
    'backup exported',
    `${extension}; encrypted=${encrypted}`
  );

  toast(
    `💾 ${extension} を出力しました`
  );
}

async function restoreBackup(
  file
){
  const rawText=
    await file.text();

  let parsed=
    jsonParse(
      rawText,
      null
    );

  if(!parsed){
    throw new Error(
      'JSON/構造化バックアップとして読めません'
    );
  }

  if(
    parsed.encrypted
  ){
    const password=
      prompt(
        'バックアップパスフレーズ'
      );

    if(!password){
      throw new Error(
        'パスフレーズが入力されませんでした'
      );
    }

    parsed=
      await decryptJSON(
        parsed.value,
        password
      );
  }

  if(
    parsed.schemaVersion!==5
  ){
    throw new Error(
      '未対応のschemaVersionです'
    );
  }

  if(
    validPeerId(
      parsed.identity?.peerId
    )
  ){
    state.id=
      parsed.identity.peerId;

    localSet(
      APP.keys.peerId,
      state.id
    );
    syncPeerIdUI?.();
  }

  if(
    parsed.identity?.name
  ){
    state.name=
      String(
        parsed.identity.name
      );
  }

  if(
    parsed.peerServer
  ){
    Object.assign(
      state.peerServer,
      parsed.peerServer
    );
  }

  if(
    parsed.settings
  ){
    Object.assign(
      state.settings,
      parsed.settings
    );

    state.settings.features={
      ...DEFAULT_FEATURES,
      ...(parsed.settings.features||{})
    };
  }

  const replaceStore=
    async(
      store,
      values
    )=>{
      if(
        !Array.isArray(values)
      ){
        return;
      }

      await db.clear(
        store
      );

      await db.bulkPut(
        store,
        values
      );
    };

  await replaceStore(
    'messages',
    parsed.chats
  );

  await replaceStore(
    'friends',
    parsed.friends
  );

  await replaceStore(
    'groups',
    parsed.groups
  );

  await replaceStore(
    'calls',
    parsed.calls
  );

  await replaceStore(
    'stickers',
    parsed.stickers
  );

  await replaceStore(
    'customEmojis',
    parsed.customEmojis
  );

  await replaceStore(
    'aiMemory',
    parsed.ai?.memory
  );

  state.aiHistory=
    Array.isArray(
      parsed.ai?.history
    )
      ?parsed.ai.history
      :[];

  await loadDBState();

  saveSettings();

  renderDynamicUI();
  renderList();

  toast(
    '♻️ バックアップを復元しました'
  );
}

async function translateText(
  text
){
  const value=
    String(text||'')
      .trim();

  if(!value){
    return '';
  }

  const common={
    hello:'こんにちは',
    hi:'こんにちは',
    'good morning':'おはようございます',
    'good night':'おやすみなさい',
    thanks:'ありがとう',
    'thank you':'ありがとう',
    yes:'はい',
    no:'いいえ'
  };

  const key=
    value.toLowerCase();

  if(
    common[key]
  ){
    return common[key];
  }

  return(
    '翻訳アダプター未接続: '+
    value
  );
}

function setTopStatus(
  text
){
  const el=$('topStatus');
  if(!el)return;
  el.textContent=String(text||'');
  // Browser network state and signaling state are different things.
  // A blocked/unavailable signaling WebSocket must not make the whole app
  // claim that the device itself is offline.
  el.className=(navigator.onLine===false)?'danger-text':'online';
}

function refreshNetworkStatus(){
  const el=$('topStatus');
  if(!el)return;
  if(navigator.onLine===false){
    setTopStatus('オフライン（端末ネットワーク）');
    return;
  }
  if(state.wsReady){
    const port=state.activeEndpoint?.port;
    setTopStatus(port?`オンライン · シグナリング接続済み ${port}`:'オンライン · シグナリング接続済み');
  }else{
    setTopStatus('オンライン · シグナリング未接続');
  }
}

function renderReactions(
  message
){
  if(
    !featureOn('reactions')
  ){
    return '';
  }

  const reactions=
    message.reactions||
    {};

  const keys=
    Object.keys(
      reactions
    ).filter(
      key=>
        reactions[key]?.length
    );

  if(!keys.length){
    return '';
  }

  return `
    <div class="reactions">
      ${
        keys.map(
          emoji=>
            `
            <button
              class="reaction"
              data-reaction-message="${esc(message.id)}"
              data-reaction-emoji="${esc(emoji)}"
            >
              ${esc(emoji)}
              ${reactions[emoji].length}
            </button>
            `
        ).join('')
      }
    </div>
  `;
}

        <span class="request-actions" style="display:flex;gap:6px;margin-left:auto">
          <button type="button" class="btn primary" data-friend-accept="${esc(r.id)}">承認</button>
          <button type="button" class="btn danger" data-friend-reject="${esc(r.id)}">拒否</button>
        </span>
      </div>`).join(''):'';

    const friendHTML=friends.length?friends.map(
          f=>
            `
            <button
              class="item ${
                state.selected===f.id
                  ?'active'
                  :''
              }"
              data-peer="${esc(f.id)}"
            >
              <span class="avatar">
                ${esc(
                  avatarText(
                    f.name
                  )
                )}
              </span>

              <span class="txt">
                <strong>${esc(f.name)}</strong>
                <p>${esc(f.id)}</p>
              </span>

              ${
                findDataConnection(
                  f.id
                )
                  ?'<span class="pill ok">P2P</span>'
                  :''
              }
              <span class="list-connect" data-connect-peer="${esc(f.id)}">接続</span>
            </button>
            `
        ).join('')
        :`
          <div class="subtle" style="padding:15px">
            フレンドはいません。
          </div>
        `;

    list.innerHTML=requestHTML+friendHTML;

  }else if(
    state.tab==='history'
  ){
    list.innerHTML=
      state.callsHistory.length
        ?state.callsHistory.map(
          call=>
            `
            <button
              class="item"
              data-peer="${esc(call.peer)}"
            >
              <span class="avatar">☎</span>

              <span class="txt">
                <strong>
                  ${esc(
                    contactName(
                      call.peer
                    )
                  )}
                </strong>

                <p>
                  ${
                    call.direction==='outgoing'
                      ?'発信'
                      :'着信'
                  }
                  ・
                  ${esc(
                    formatDate(
                      call.time
                    )
                  )}
                </p>
              </span>

              <span class="list-connect" data-connect-peer="${esc(call.peer)}">接続</span>
            </button>
            `
        ).join('')
        :`
          <div class="subtle" style="padding:15px">
            通話履歴はありません。
          </div>
        `;

  }else{
    const rows=[];

    const peers=
      [
        ...new Set(
          state.chats
            .filter(
              m=>!m.groupId
            )
            .map(
              m=>m.peer
            )
        )
      ];

    for(
      const peer of
      peers
    ){
      if(
        query &&
        !(
          contactName(
            peer
          )
          .toLowerCase()
          .includes(query)||
          peer.includes(query)
        )
      ){
        continue;
      }

      const messages=
        state.chats.filter(
          m=>
            m.peer===peer
        );

      const last=
        messages[
          messages.length-1
        ];

      rows.push(
        `
        <button
          class="item ${
            state.selected===peer
              ?'active'
              :''
          }"
          data-peer="${esc(peer)}"
        >
          <span class="avatar">
            ${esc(
              avatarText(
                contactName(peer)
              )
            )}
          </span>

          <span class="txt">
            <strong>
              ${esc(
                contactName(peer)
              )}
            </strong>

            <p>
              ${esc(
                last?.text||
                `[${last?.type||'chat'}]`
              )}
            </p>
          </span>

          ${
            state.unread[peer]
              ?`
                <span class="pill">
                  ${state.unread[peer]}
                </span>
              `
              :''
          }

          <span class="time">
            ${
              last
                ?esc(
                  formatTime(
                    last.time
                  )
                )
                :''
            }
          </span>

        </button>
        `
      );
    }

    for(
      const friend of
      state.friends
    ){
      if(
        peers.includes(
          friend.id
        )
      ){
        continue;
      }

      if(
        query &&
        !(
          friend.name
            .toLowerCase()
            .includes(query)||
          friend.id.includes(query)
        )
      ){
        continue;
      }

      rows.push(
        `
        <button
          class="item"
          data-peer="${esc(friend.id)}"
        >
          <span class="avatar">
            ${esc(
              avatarText(
                friend.name
              )
            )}
          </span>

          <span class="txt">
            <strong>
              ${esc(friend.name)}
            </strong>
            <p>新しいチャット</p>
          </span>
        </button>
        `
      );
    }

    if(
      featureOn('groups')
    ){
      for(
        const group of
        state.groups
      ){
        if(
          query &&
          !group.name
            .toLowerCase()
            .includes(query)
        ){
          continue;
        }

        rows.push(
          `
          <button
            class="item"
            data-group="${esc(group.id)}"
          >
            <span class="avatar">👥</span>

            <span class="txt">
              <strong>
                ${esc(group.name)}
              </strong>
              <p>
                ${group.peers.length}人
              </p>
            </span>
          </button>
          `
        );
      }
    }

    list.innerHTML=
      rows.join('')||
      `
        <div class="subtle" style="padding:15px">
          ＋から相手を追加してください。
        </div>
      `;
  }

  list
    .querySelectorAll(
      '[data-peer]'
    )
    .forEach(
      button=>{
        button.onclick=
          ()=>{
            selectPeer(
              button.dataset.peer
            );
          };
      }
    );

  list
    .querySelectorAll(
      '[data-connect-peer]'
    )
    .forEach(
      button=>{
        button.onclick=
          async e=>{
            e.preventDefault();
            e.stopPropagation();
            await connectDirectPeer(button.dataset.connectPeer);
          };
      }
    );

  list
    .querySelectorAll(
      '[data-group]'
    )
    .forEach(
      button=>{
        button.onclick=
          ()=>{
            const group=
              state.groups.find(
                g=>
                  g.id===
                  button.dataset.group
              );

            if(group){
              renderGroup(
                group
              );
            }
          };
      }
    );
}

function renderGroup(
  group
){
  state.selectedGroup=
    group.id;

  state.selected=
    null;

  $('topAvatar').textContent=
    '👥';

  $('topName').textContent=
    group.name;

  setTopStatus(
    `${group.peers.length}人`
  );

  const chat=
    $('chat');

  chat.innerHTML=`
    <div class="notice">
      👥 ${esc(group.name)}
    </div>
  `;

  const messages=
    state.chats.filter(
      m=>
        m.groupId===
        group.id
    );

  if(!messages.length){
    chat.insertAdjacentHTML(
      'beforeend',
      `
        <div class="empty">
          グループメッセージはまだありません。
        </div>
      `
    );
    return;
  }

  for(
    const m of
    messages
  ){
    const row=
      document.createElement(
        'div'
      );

    row.className=
      'message-row '+
      (
        m.from===state.id
          ?'mine'
          :'theirs'
      );

    row.innerHTML=
      `
      <div class="message-shell">
        <div class="bubble">
          <div class="subtle">
            ${esc(
              contactName(
                m.from
              )
            )}
          </div>

          <div class="msg-content">
            ${esc(
              m.text||
              ''
            )}
          </div>
        </div>

        <div class="message-meta">
          ${esc(
            formatTime(
              m.time
            )
          )}
        </div>
      </div>
      `;

    chat.appendChild(
      row
    );
  }
}

function selectPeer(
  peer
){
  state.selected=
    peer;

  state.selectedGroup=
    null;

  renderChat(
    peer
  );

  renderList();

  renderDynamicUI();
}

/* =========================================================
   DB Load
   ========================================================= */

async function loadDBState(){
  try{
    await db.open();

    const [
      chats,
      friends,
      friendRequests,
      groups,
      calls,
      logs,
      stickers,
      emojis,
      memories,
      aiIndex,
      aiKnowledge,
      auditEvents,
      drafts,
      peerState,
      aiState
    ]=
      await Promise.all([
        db.all('messages'),
        db.all('friends'),
        db.all('friendRequests'),
        db.all('groups'),
        db.all('calls'),
        db.all('logs'),
        db.all('stickers'),
        db.all('customEmojis'),
        db.all('aiMemory'),
        db.all('aiIndex'),
        db.all('aiKnowledge'),
        db.all('auditEvents'),
        db.all('drafts'),
        db.get('peerState','identity'),
        db.get('meta','aiState')
      ]);

    state.chats=
      chats.sort(
        (a,b)=>a.time-b.time
      );

    state.friends=
      friends.sort(
        (a,b)=>a.added-b.added
      );

    state.friendRequests=(friendRequests||[]).filter(r=>validPeerId(r.id)&&r.id!==state.id).sort((a,b)=>(b.time||0)-(a.time||0));

    state.groups=
      groups.sort(
        (a,b)=>a.created-b.created
      );

    state.callsHistory=
      calls.sort(
        (a,b)=>b.time-a.time
      );

    state.logs=
      logs.sort(
        (a,b)=>a.time-b.time
      );

    state.stickers=
      stickers;

    state.customEmojis=
      emojis;

    state.aiMemory=
      memories;

    state.aiIndex=
      aiIndex;

    state.aiKnowledge=
      aiKnowledge;

    state.auditEvents=
      auditEvents.sort((a,b)=>(a.time||0)-(b.time||0));

    state.drafts=
      drafts;

    // Only accept a valid persisted identity; never replace a valid local identity with stale/empty DB data.
    if(validPeerId(peerState?.peerId)){
      const localId=localGet(APP.keys.peerId,'');
      state.id=validPeerId(localId) ? localId : peerState.peerId;
      localSet(APP.keys.peerId,state.id);
    }else{
      ensurePeerIdentity();
    }

    state.aiHistory=
      aiState?.value?.history||
      [];

    state.storageReady=
      true;

    addLog(
      'INFO',
      'IndexedDB ready',
      `messages=${state.chats.length}`
    );

  }catch(e){
    state.storageReady=
      false;

    addLog(
      'ERROR',
      'IndexedDB unavailable',
      e.message
    );
  }
}

      e.target.dataset.mode===
      'sticker'
    ){
      if(files[0]){
        await createSticker(
          files[0]
        );
      }

    }else{
      await sendFiles(
        files
      );
    }

    delete e.target.dataset.mode;

    e.target.value='';
  };

/* =========================================================
   Invite hash
   ========================================================= */

function handleInviteHash(){
  const match=
    location.hash.match(
      /peer=(\d{6})/
    );

  if(!match)return;

  setTimeout(
    ()=>{
      openFriend();

      setTimeout(
        ()=>{
          if(
            $('friendPeer')
          ){
            $('friendPeer').value=
              match[1];
          }
        },
        0
      );
    },
    200
  );
}

/* =========================================================
   Incoming browser notification permission
   ========================================================= */

async function requestNotifications(){
  if(
    !featureOn('browserNotify')
  ){
    return;
  }

  if(
    !('Notification' in window)
  ){
    return;
  }

  if(
    Notification.permission==='default'
  ){
    try{
      await Notification.requestPermission();
    }catch{}
  }
}

function ensurePeerIdentity(){
  // The displayed ID must survive IndexedDB reloads and any stale/invalid DB row.
  let id=String(state.id||'');
  const ls=String(localGet(APP.keys.peerId,'')||'');
  if(!validPeerId(id) && validPeerId(ls)) id=ls;
  if(!validPeerId(id)) id=makePeerId();
  state.id=id;
  localSet(APP.keys.peerId,id);
  return id;
}

function syncPeerIdUI(){
  const id=ensurePeerIdentity();
  const my=$('myId');
  const top=$('topPeerId');
  if(my){
    my.textContent=id;
    my.setAttribute('data-peer-id',id);
    my.style.display='block';
    my.style.visibility='visible';
    my.style.opacity='1';
  }
  if(top){
    top.textContent='Peer ID: '+id;
    top.setAttribute('data-peer-id',id);
    top.style.display='block';
    top.style.visibility='visible';
    top.style.opacity='1';
  }
  document.querySelectorAll('[data-local-peer-id]').forEach(el=>{
    el.textContent=id;
    el.setAttribute('data-peer-id',id);
  });
  try{ window.__secureChatPeerId=id; }catch{}
  return id;
}

async function boot(){
  syncPeerIdUI();

  applyTheme();

  await loadDBState();
  syncPeerIdUI();

  if(
    featureOn('aiDatabase')
  ){
    await seedAIIndex();
  }

  renderDynamicUI();
  renderList();

  addLog(
    'INFO',
    'Secure Chat boot',
    `peer=${state.id}`
  );

  addLog(
    'INFO',
    'WebRTC',
    `RTCPeerConnection=${!!window.RTCPeerConnection}; getUserMedia=${!!navigator.mediaDevices?.getUserMedia}`
  );

  addLog(
    'INFO',
    'WebGPU',
    `navigator.gpu=${!!navigator.gpu}`
  );

  connectSignal();

  requestNotifications();

  setTimeout(
    monitorSecurity,
    1800
  );

  handleInviteHash();

  if(
    !localGet(
      APP.keys.password,
      ''
    )
  ){
    setTimeout(
      openPasswordSetup,
      400
    );
  }
}

<script>
/* Secure Chat stability layer */
(function(){

  const $id=id=>document.getElementById(id);
  window.__secureChatStabilityStarted=true;
  const safe=(fn,label)=>{try{return fn()}catch(e){try{addLog('ERROR',label,e?.message||String(e))}catch{};try{toast(label+'に失敗しました')}catch{};return null}};

  // Everything is available by default. Only richText/translation remain user toggles.
  const alwaysOn=['reactions','customEmoji','stickers','mentions','messageSearch','files','voiceChannels','aiDatabase','aiImage','aiVoice','aiMemory','backup','browserNotify','notificationSound','wakeLock','autoReconnect','advancedDiagnostics','localWebGPU','aiToolControl','pythonBridge','groups'];
  if(state?.settings?.features){
    for(const k of alwaysOn) state.settings.features[k]=true;
        if(typeof state.settings.features.richText!=='boolean') state.settings.features.richText=true;
    if(typeof state.settings.features.translation!=='boolean') state.settings.features.translation=true;
  }

  // Persistent passphrase field near Peer ID. The value itself is never rendered back.
  function ensurePassphraseDock(){
    if($id('passphraseDock')) return;
    const me=document.querySelector('.me');
    if(!me) return;
    const wrap=document.createElement('section');
    wrap.id='passphraseDock';
    wrap.className='peer-connect';

    wrap.innerHTML='<div style="font-size:11px;color:#667085;margin-bottom:6px">🔐 共有パスフレーズ</div><div class="peer-connect-row"><input id="passphraseInputStable" type="password" autocomplete="current-password" placeholder="相手と同じパスフレーズ"><button class="btn primary" id="passphraseSaveStable" type="button">保存</button></div><small id="passphraseStateStable">'+(configured?'設定済み（入力内容は表示しません）':'未設定')+'</small>';

      const value=String(input.value||'');

  }

  // Direct Peer ID, for both desktop and narrow layouts.
  async function directConnectStable(value){
    const id=String(value||'').replace(/\D/g,'').slice(0,6);

    if(id===state.id){toast('自分自身には接続できません');return false;}
    if(!state.wsReady){toast('シグナリング未接続です。少し待ってから再試行してください');return false;}
    try{
      const c=await ensureDataConnection(id);
      await waitForRTCConnected(c,12000);
      selectPeer(id);
      renderDynamicUI();
      toast('✅ '+id+' とP2P接続しました');
      return true;
    }catch(e){
      addLog('WARN','direct peer',e?.message||String(e));
      const c=findDataConnection(id);
      if(c && !isLiveDataPeer(id)) dropRTCConnection(c);
      toast('接続できません: '+(e?.message||'相手がオフライン、またはPeer IDが存在しません'));
      return false;
    }
  }
  window.directConnect=directConnectStable;
  function wireDirect(inputId,buttonId){
    const input=$id(inputId); if(!input)return;
    input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById(buttonId)?.click()}};
  }

  // Friend request inbox instead of auto-adding on arrival.
  if(!Array.isArray(state.friendRequests)) state.friendRequests=[];
  async function respondFriendRequest(id,allow){
    id=String(id||'').trim();
    if(!validPeerId(id)||id===state.id){toast('無効なフレンド申請です');return false;}
    const req=(state.friendRequests||[]).find(x=>x.id===id);
    if(!req){toast('そのフレンド申請は見つかりません');try{renderList()}catch{};return false;}
    const btns=[...document.querySelectorAll(`[data-friend-accept="${CSS.escape(id)}"],[data-friend-reject="${CSS.escape(id)}"]`)];
    btns.forEach(b=>b.disabled=true);
    try{
      if(allow){await addFriend(id,req.name||'ユーザー',true);}
      try{await sendControlObject(id,{type:allow?'friend-accepted':'friend-rejected',name:state.name});}
      catch(e){addLog('WARN','friend response send',e?.message||String(e));}
      state.friendRequests=state.friendRequests.filter(x=>x.id!==id);
      if(state.storageReady) await db.delete('friendRequests',id).catch(e=>addLog('WARN','friend request delete',e?.message||String(e)));
      renderList();
      toast(allow?'フレンド申請を承認しました':'フレンド申請を拒否しました');
      return true;
    }catch(e){
      btns.forEach(b=>b.disabled=false);
      addLog('ERROR','friend request response',e?.message||String(e));
      toast('フレンド申請の処理に失敗しました: '+(e?.message||'不明なエラー'));
      return false;
    }
  }
  const previousReceive=window.receivePacket;
  if(typeof previousReceive==='function'&&!previousReceive.__stableFriend){
    const recv=async function(remote,obj){
      try{
        if(obj?.type==='friend-request'){await window.handleIncomingFriendRequest(remote,obj);return;}
        if(obj?.type==='friend-accepted'){await addFriend(remote,obj.name||remote,true);renderList();toast((obj.name||remote)+' がフレンド申請を許可しました');return;}
        if(obj?.type==='friend-rejected'){toast((obj.name||remote)+' がフレンド申請を拒否しました');return;}
      }catch(e){addLog('ERROR','friend request handler',e?.message||String(e))}
      return previousReceive(remote,obj);
    };
    recv.__stableFriend=true;
    window.receivePacket=recv;
    try{receivePacket=recv}catch{}
  }

  window.handleIncomingFriendRequest=async function(remote,obj){
    if(!validPeerId(remote)||remote===state.id)return;
    const row={id:remote,name:String(obj?.name||'ユーザー').trim()||'ユーザー',time:Date.now()};
    const existing=(state.friendRequests||[]).find(x=>x.id===remote);
    if(existing)Object.assign(existing,row); else state.friendRequests.push(row);
    if(state.storageReady)await db.put('friendRequests',row).catch(e=>addLog('WARN','friend request save',e?.message||String(e)));

    try{playNotificationSound()}catch{}

  };

  document.addEventListener('click',ev=>{
    const accept=ev.target?.closest?.('[data-friend-accept]');

    ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();

  },true);

  // Richer local AI DB: messages, memories, friends, groups, calls, and built-in help.
  const HELP=[
    ['help:overview','Secure Chatの使い方。相手の6桁Peer IDを入力して直接接続し、メッセージ、ファイル、フレンド、通話などを利用します。'],
    ['help:peer','Peer IDは6桁です。直接Peer ID欄へ入力して接続できます。'],
    ['help:friends','フレンド追加からPeer IDへ申請を送ります。受信した申請はフレンド欄で許可または拒否できます。'],
    ['help:passphrase','共有パスフレーズはアプリ層の暗号化に使います。通信相手と同じ文字列を設定してください。'],
    ['help:ai','SecureAIはSecure Chatの状態、AIデータベース、履歴やメモを利用して回答します。'],
    ['help:diagnostics','動作確認ではWebRTC、WebSocket、IndexedDB、Web Crypto、WebGPU、AI DB、カナリアなどを確認できます。'],
    ['help:sticker','ステッカーは専用エディタで画像や文字を配置して保存し、ステッカー欄からタップ送信できます。'],
    ['help:file','ファイルはP2P DataChannelで分割送信します。'],
    ['help:canary','カナリア監視はP2P接続の疎通を10秒ごとに確認し、異常時に警告します。']
  ];
  function dbTokens(text){return [...new Set(aiTokens(String(text||'')))]}
  async function rebuildAIKnowledgeStable(){
    if(!state.settings.features.aiDatabase)return 0;
    const docs=[];
    const push=(id,kind,refId,time,text,weight=1)=>{
      const clean=String(text||'').trim(); if(!clean)return;
      docs.push({id,kind,refId:refId||'',peer:'',time:Number(time)||0,text:clean,tokens:dbTokens(clean),weight});
    };
    for(const m of state.chats||[]) push('message:'+m.id,'message',m.id,m.time,[m.text||'',m.type||'',m.attachment?.name||'',contactName(m.from),m.replyTo||''].join(' '),1);
    for(const m of state.aiMemory||[]) push('memory:'+m.id,'memory',m.id,m.time,m.text,2.5);
    for(const f of state.friends||[]) push('friend:'+f.id,'friend',f.id,f.added,`フレンド ${f.name||f.id} Peer ID ${f.id}`,1.6);
    for(const r of state.friendRequests||[]) push('friend-request:'+r.id,'friend-request',r.id,r.time,`フレンド申請 ${r.name||r.id} Peer ID ${r.id}`,1.3);
    for(const g of state.groups||[]) push('group:'+g.id,'group',g.id,g.created||0,`グループ ${g.name||g.id} メンバー ${(g.members||[]).join(' ')}`,1.5);
    for(const c of state.callsHistory||[]) push('call:'+c.id+':'+c.time,'call',c.id,c.time,`通話 ${contactName(c.id)} ${c.direction==='outgoing'?'発信':'着信'} ${c.duration||0}`,0.9);
    for(const st of state.stickers||[]) push('sticker:'+st.id,'sticker',st.id,st.time||0,`ステッカー ${st.name||st.id}`,0.8);
    for(const em of state.customEmojis||[]) push('emoji:'+em.id,'emoji',em.id,em.time||0,`カスタム絵文字 ${em.name||em.id} ${em.text||''}`,0.8);
    for(const ev of state.auditEvents||[]) push('audit:'+ev.id,'audit',ev.id,ev.time,`${ev.kind||'event'} ${ev.detail||''}`,0.5);
    for(const [id,text] of HELP) push(id,'help',id,0,text,2.0);
    push('identity:local','identity',state.id,Date.now(),`自分のPeer ID ${state.id} 表示名 ${state.name}`,2.4);
    state.aiIndex=[...new Map(docs.map(x=>[x.id,x])).values()];
    state.aiKnowledge=state.aiIndex.slice();
    if(state.storageReady){try{await db.clear('aiIndex');await db.bulkPut('aiIndex',state.aiIndex);await db.clear('aiKnowledge');await db.bulkPut('aiKnowledge',state.aiKnowledge);await db.put('peerState',{id:'identity',peerId:state.id,name:state.name,updated:Date.now()})}catch(e){addLog('WARN','AI DB persist',e?.message||String(e))}}
    return state.aiIndex.length;
  }
  function queryAIKnowledgeStable(query,limit=12){
    const q=aiNormalize(query),terms=dbTokens(q); if(!terms.length)return [];
    const nowTs=Date.now();
    return (state.aiIndex||[]).map(entry=>{
      const text=aiNormalize(entry.text||''); let score=Number(entry.weight||1);
      for(const term of terms){if(entry.tokens?.includes(term))score+=3;if(text.includes(term))score+=1;if(text===q)score+=10}
      if(entry.time){score+=Math.max(0,1-Math.min(1,(nowTs-entry.time)/(1000*60*60*24*30)))*0.6}
      return {entry,score};
    }).filter(x=>x.score>1).sort((a,b)=>b.score-a.score||(b.entry.time||0)-(a.entry.time||0)).slice(0,Math.max(1,limit)).map(x=>x.entry);
  }
  window.rebuildAIKnowledge=rebuildAIKnowledgeStable;
  window.queryAIKnowledge=queryAIKnowledgeStable;
  try{retrieveAI=queryAIKnowledgeStable}catch{}

  // OpenAI key-only mode; endpoint/model are filled automatically when omitted.
  state.settings.openaiEndpoint=state.settings.openaiEndpoint||'https://api.openai.com/v1/responses';
  state.settings.openaiModel=state.settings.openaiModel||state.settings.aiModel||'gpt-5.6-luna';
  async function openAIKeyOnlyStable(question,imageData=''){
    const key=String(state.settings.openaiApiKey||state.settings.aiApiKey||'').trim(); if(!key)return null;
    const context=queryAIKnowledgeStable(question,10);
    const input=[{role:'system',content:[{type:'input_text',text:'あなたはSecure ChatのAIアシスタントです。使い方、P2P接続、履歴、AIデータベース、設定について正確に回答してください。分からないことは推測せず明示してください。'}]}];
    for(const m of (state.aiHistory||[]).slice(-12)) input.push({role:m.role==='assistant'?'assistant':'user',content:[{type:'input_text',text:String(m.text||'')}]});
    const contextText=context.length?'\n\nSecure Chat local knowledge:\n'+context.map(x=>x.text).join('\n---\n'):'';
    const text=String(question||'')+contextText;
    input.push({role:'user',content:imageData?[{type:'input_text',text:text||'この画像を説明してください'},{type:'input_image',image_url:imageData}]:[{type:'input_text',text:text||'質問を入力してください'}]});
    const res=await fetch(state.settings.openaiEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:state.settings.openaiModel,input,store:false})});
    if(!res.ok){let msg='OpenAI HTTP '+res.status;try{const d=await res.json();msg=d?.error?.message||msg}catch{}throw new Error(msg)}
    const data=await res.json();
    const answer=data?.output_text||data?.output?.flatMap(x=>x.content||[]).find(x=>typeof x?.text==='string')?.text;
    if(!answer)throw new Error('OpenAI response textが見つかりません');

  window.openAIKeyOnly=openAIKeyOnlyStable;

      if(String(state.settings.openaiApiKey||state.settings.aiApiKey||'').trim()){
        try{return await openAIKeyOnlyStable(q,img)}catch(e){addLog('WARN','OpenAI key-only failed',e?.message||String(e))}
      }

  }

  // Reliable logs dialog.
  window.openLogsStable=function(){
    showModal('<h3>📜 Secure Chat ログ</h3><p class="help">接続・WebRTC・AI・DBなどのログです。本文・暗号鍵・パスフレーズは記録しません。</p><div id="logViewStable" class="logbox"></div><div class="actions"><button class="btn" id="copyLogsStable">コピー</button><button class="btn danger" id="clearLogsStable">消去</button><button class="btn" data-close>閉じる</button></div>');
    const refreshStable=()=>{const el=$id('logViewStable');if(!el)return;el.textContent=(state.logs||[]).map(x=>`[${new Date(x.time||Date.now()).toLocaleTimeString()}] ${x.level||'INFO'} ${x.type||''} ${x.detail||''}`).join('\n')};
    refreshStable();
    $id('copyLogsStable').onclick=async()=>toast((await copyText($id('logViewStable').textContent))?'ログをコピーしました':'コピーできませんでした');
    $id('clearLogsStable').onclick=async()=>{state.logs=[];await db.clear('logs').catch(()=>{});refreshStable();toast('ログを消去しました')};
  };

  // Comprehensive button/API health check.
  const buttonSpecs={settingsBtn:'設定',aiBtn:'AI',openAiQuick:'AI',searchBtn:'検索',groupBtn:'グループ',friendBtn:'フレンド追加',callBtn:'通話',notificationBtn:'通知',copyId:'IDコピー',nameBtn:'名前',profileBtn:'プロフィール',inviteBtn:'招待',directConnectBtn:'直接Peer接続',passphraseSaveStable:'パスフレーズ保存',cancelReply:'返信/編集取消',attachBtn:'添付',emojiBtn:'絵文字',send:'送信',micBtn:'マイク',camBtn:'カメラ',wakeBtn:'Wake Lock',hangBtn:'通話終了'};
  function audit(){
    const rows=[];
    for(const [id,label] of Object.entries(buttonSpecs)){
      const e=$id(id);
      const visible=!!e&&e.getClientRects().length>0;
      const wired=!!e&&(typeof e.onclick==='function'||e.dataset.scBound==='1');
      rows.push({label,ok:visible&&!e.disabled&&wired,detail:!e?'未検出':e.disabled?'無効':!visible?'非表示':wired?'配線確認済み（未クリック）':'未接続'});

  // Canonical event wiring: direct onclick assignments are idempotent.
  function bindStatic(){

  // 10-second canary on existing encrypted control channel.
  const CANARY={interval:10000,timeout:6000,seq:0,pending:new Map(),misses:new Map()};

  async function sendCanary(c){const seq=++CANARY.seq,nonce=randHex(12),sent=Date.now(),key=c.remote;CANARY.pending.set(key+'::'+seq,{nonce,sent});try{await sendControlObject(c.remote,{type:'__securechat_canary__',mode:'ping',seq,nonce,sent})}catch(e){CANARY.pending.delete(key+'::'+seq);throw e}setTimeout(()=>{const p=CANARY.pending.get(key+'::'+seq);if(!p)return;CANARY.pending.delete(key+'::'+seq);const miss=(CANARY.misses.get(key)||0)+1;CANARY.misses.set(key,miss);if(miss>=2){addLog('WARN','CANARY',`${c.remote}: 応答なし（連続${miss}回）`);toast('⚠️ P2Pカナリア異常: '+c.remote)}},CANARY.timeout)}

    const recv=async function(remote,obj){

        const c=[...state.connections.values()].find(x=>x.remote===remote&&x.control?.readyState==='open');
        if(obj.mode==='ping'){try{await sendControlObject(remote,{type:'__securechat_canary__',mode:'pong',seq:obj.seq,nonce:obj.nonce,sent:obj.sent,received:Date.now()})}catch(e){addLog('WARN','CANARY reply',e?.message||String(e))}}
        else if(obj.mode==='pong'){const key=remote,p=CANARY.pending.get(key+'::'+obj.seq);if(!p||p.nonce!==obj.nonce){addLog('WARN','CANARY','想定外の応答: '+remote);return}CANARY.pending.delete(key+'::'+obj.seq);CANARY.misses.set(key,0);const rtt=Date.now()-p.sent;addLog('INFO','CANARY',`${remote} rtt=${rtt}ms`);if(rtt>4000)toast('⚠️ P2P遅延: '+rtt+'ms')}
        return;
      }
      return recvPrev(remote,obj);
    };
    recv.__stableCanary=true;window.receivePacket=recv;try{receivePacket=recv}catch{}
  }
  window.SecureChatCanary={tick:canaryTick,state:CANARY};

  // iPad/Safari visual viewport: keep the composer above the software keyboard.
  function syncVisualViewport(){
    const h=window.visualViewport?.height || window.innerHeight;

  // Settings modal is created dynamically; wire its maintenance controls when they appear.
  const settingsObserver=new MutationObserver(()=>{
    const map={openLogsFromSettings:()=>openLogsStable(),backupFromSettings:()=>openBackup(),featureDiagFromSettings:()=>openFeatureDiagnostics(),portTest:()=>testPorts(),iceFromSettings:()=>runICEDiagnostic()};
    for(const [id,fn] of Object.entries(map)){const e=$id(id);if(e&&e.dataset.scBound!=='1'){e.onclick=ev=>{ev.preventDefault();safe(fn,id)};e.dataset.scBound='1';}}

  settingsObserver.observe(document.body,{childList:true,subtree:true});
  setTimeout(()=>{try{rebuildAIKnowledgeStable().then(n=>addLog('INFO','AI DB rebuilt',String(n))).catch(e=>addLog('WARN','AI DB rebuild',e?.message||String(e)))}catch{}},1000);
  // Never equate missing signaling with being offline. Keep browser network
  // status and signaling status separate.
  window.addEventListener('online',refreshNetworkStatus,{passive:true});
  window.addEventListener('offline',refreshNetworkStatus,{passive:true});
  setTimeout(refreshNetworkStatus,100);
  setInterval(refreshNetworkStatus,1500);
  setTimeout(()=>{try{ensurePeerIdentity();renderDynamicUI()}catch{};bindStatic();syncPeerIdUI()},1200);
  setInterval(syncPeerIdUI,1000);

  // Desktop-only laughing pointer companion. Show on real mouse/trackpad devices,
  // but hide on iPad/iPhone/iPod even when iPadOS reports a desktop-like platform.
  (function(){
    try{
      const el=$id('sc-cursor-laugh');
      if(!el)return;
      const ua=navigator.userAgent||'';
      const platform=navigator.platform||'';
      const appleTouchDevice=/iPad|iPhone|iPod/i.test(ua)||(/MacIntel/i.test(platform)&&navigator.maxTouchPoints>1);
      const hasFine=matchMedia('(pointer:fine)').matches || matchMedia('(hover:hover)').matches;
      const touchOnly=navigator.maxTouchPoints>0 && !hasFine;
      if(appleTouchDevice || touchOnly){el.style.display='none';return;}
      el.style.display='block';
      let raf=0,x=innerWidth/2,y=innerHeight/2;
      const setPos=()=>{el.style.setProperty('--sc-x',(x+14)+'px');el.style.setProperty('--sc-y',(y+13)+'px');el.style.transform=`translate3d(${x+14}px,${y+13}px,0)`;};
      const move=e=>{if(e.pointerType && e.pointerType!=='mouse')return;x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{raf=0;setPos();});};
      const laugh=()=>{setPos();el.classList.remove('sc-spin');void el.offsetWidth;el.classList.add('sc-spin');clearTimeout(laugh._t);laugh._t=setTimeout(()=>{el.classList.remove('sc-spin');setPos()},840);};
      window.addEventListener('mousemove',move,{passive:true});
      window.addEventListener('pointermove',move,{passive:true});
      window.addEventListener('mousedown',laugh,{passive:true});
      window.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')laugh()},{passive:true});
      setPos();
    }catch(e){try{console.warn('cursor laugh init failed',e)}catch{}}
  })();
})();

<script>

    const box=$('groupFsChat'); requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight;});

  function openGroupFS(group){ensureGroupFS().classList.add('show');renderGroupFS(group);setTimeout(()=>$('groupFsInput')?.focus(),50)}
  function closeGroupFS(){ensureGroupFS().classList.remove('show');}
  async function leaveOrCloseGroupFS(){

    }else{

  async function createGroupV2(name){

        }
        if(obj?.type==='group-closed'){
          const i=state.groups.findIndex(x=>x.id===obj.groupId&&x.serverId===obj.serverId); if(i>=0){state.groups.splice(i,1);try{await db?.delete('groups',obj.groupId)}catch{};if(state.selectedGroup===obj.groupId)closeGroupFS();renderList();toast2('グループが閉じられました')} return;
        }
        if(obj?.type==='group-leave'){
          const g=state.groups.find(x=>x.owner===state.id&&x.id===obj.groupId&&x.serverId===obj.serverId); if(g){g.peers=g.peers.filter(p=>p!==remote);try{await db?.put('groups',g)}catch{};return}
        }
        if(obj?.type==='group-chat'){
          const g=state.groups.find(x=>x.id===obj.groupId&&x.serverId===obj.serverId); if(!g)return;
          if(remote!==g.owner && g.owner!==state.id) return;
          const msg={...(obj.message||{}),id:obj.messageId||obj.message?.id||uid('msg'),peer:g.id,groupId:g.id,from:obj.from||remote,to:state.id,text:String(obj.text||'')};
          await storeMessage(msg);
          // Owner is the relay: forward once to all participants except sender.
          if(g.owner===state.id){for(const peer of g.peers.filter(p=>p!==msg.from)){try{if(isLiveDataPeer(peer))await sendControlObject(peer,{type:'group-chat',groupId:g.id,serverId:g.serverId,text:msg.text,from:msg.from,messageId:msg.id,author:obj.author||groupMemberName(msg.from)})}catch{}}}
          if(state.selectedGroup===g.id)renderGroupFS(g); renderList(); notifyIncoming(msg); return;
        }
      }catch(e){addLog('ERROR','group v2',e?.message||String(e))}
      return prevRecv(remote,obj);
    };
    recv.__groupV2=true; window.receivePacket=recv; try{receivePacket=recv}catch{}
  }

  window.openGroup=function(){
    if(typeof featureOn==='function'&&!featureOn('groups')){toast2('グループをONにしてください');return;}
    showModal(`<h3>👥 グループ</h3><div class="field"><label>グループ名</label><input id="groupNameV2" maxlength="40" placeholder="Secure Chat Group"></div><div class="field"><label>ServerIDで参加</label><input id="groupServerIdV2" maxlength="16" placeholder="SCG-123456-ABC123" autocapitalize="characters"></div><div class="subtle">グループ作成者が中央リレー役になります。作成時に生成されたServerIDは、そのグループを閉じるまで固定です。参加者はPeer IDを入力しません。</div><div class="actions"><button class="btn" id="groupJoinV2">ServerIDで参加</button><button class="btn primary" id="groupCreateV2">グループを作成</button><button class="btn" data-close>キャンセル</button></div>`);
    $('groupCreateV2').onclick=async()=>{const g=await createGroupV2($('groupNameV2').value.trim());closeModal();openGroupFS(g)};
    $('groupJoinV2').onclick=async()=>{await joinGroupV2($('groupServerIdV2').value.trim())};
  };
  window.renderGroup=renderGroupFS;
  window.createGroup=createGroupV2;

  // Ensure incoming calls always use a username-like label, never raw Peer ID.
  const oldCallDisplay=window.callDisplayName;
  window.callDisplayName=(remote,metadata={})=>{const meta=String(metadata?.name||'').trim();if(meta&&meta!==remote)return meta;const local=contactName(remote);if(local&&local!==remote)return local;return 'ユーザー'};

  // Re-open group creation after startup so only this feature changes its own UI.
  setTimeout(()=>{try{ensureGroupFS()}catch{}},0);
})();
</script>
