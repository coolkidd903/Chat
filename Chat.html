/* =========================================================
   Model Manager
   ========================================================= */

class ModelManager{
  constructor(){
    this.db=null;
    this.chunkSize=
      4*1024*1024;
  }

  async open(){
    if(this.db){
      return this.db;
    }

    this.db=
      await new Promise(
        (resolve,reject)=>{
          const req=
            indexedDB.open(
              APP.modelDbName,
              APP.modelDbVersion
            );

          req.onupgradeneeded=()=>{
            const db=req.result;

            if(
              !db.objectStoreNames.contains(
                'meta'
              )
            ){
              db.createObjectStore(
                'meta',
                {keyPath:'id'}
              );
            }

            if(
              !db.objectStoreNames.contains(
                'chunks'
              )
            ){
              const store=
                db.createObjectStore(
                  'chunks',
                  {keyPath:'key'}
                );

              store.createIndex(
                'modelIndex',
                ['modelId','index'],
                {unique:true}
              );
            }
          };

          req.onsuccess=
            ()=>resolve(
              req.result
            );

          req.onerror=
            ()=>reject(
              req.error
            );
        }
      );

    return this.db;
  }

  async getMeta(
    id='default'
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const req=
          db.transaction(
            'meta',
            'readonly'
          ).objectStore(
            'meta'
          ).get(id);

        req.onsuccess=
          ()=>resolve(
            req.result||
            null
          );

        req.onerror=
          ()=>reject(
            req.error
          );
      }
    );
  }

  async putMeta(
    meta
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'meta',
            'readwrite'
          );

        tx.objectStore(
          'meta'
        ).put(meta);

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );
  }

  async putChunk(
    modelId,
    index,
    data
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'chunks',
            'readwrite'
          );

        tx.objectStore(
          'chunks'
        ).put({
          key:
            `${modelId}:${index}`,
          modelId,
          index,
          data
        });

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );
  }

  async getChunks(
    modelId
  ){
    const db=
      await this.open();

    return new Promise(
      (resolve,reject)=>{
        const req=
          db.transaction(
            'chunks',
            'readonly'
          ).objectStore(
            'chunks'
          ).index(
            'modelIndex'
          ).getAll(
            IDBKeyRange.bound(
              [modelId,0],
              [
                modelId,
                Number.MAX_SAFE_INTEGER
              ]
            )
          );

        req.onsuccess=
          ()=>resolve(
            (req.result||[])
              .sort(
                (a,b)=>
                  a.index-
                  b.index
              )
          );

        req.onerror=
          ()=>reject(
            req.error
          );
      }
    );
  }

  async clear(
    modelId='default'
  ){
    const db=
      await this.open();

    const chunks=
      await this.getChunks(
        modelId
      );

    await new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'chunks',
            'readwrite'
          );

        const os=
          tx.objectStore(
            'chunks'
          );

        for(
          const chunk of
          chunks
        ){
          os.delete(
            chunk.key
          );
        }

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );

    await new Promise(
      (resolve,reject)=>{
        const tx=
          db.transaction(
            'meta',
            'readwrite'
          );

        tx.objectStore(
          'meta'
        ).delete(
          modelId
        );

        tx.oncomplete=
          ()=>resolve(true);

        tx.onerror=
          ()=>reject(
            tx.error
          );
      }
    );
  }

  async download(
    url,
    modelId='default'
  ){
    if(!url){
      throw new Error(
        'モデルURLが未設定です'
      );
    }

    showModelProgress(
      0,
      'モデルへ接続しています…'
    );

    const response=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    if(!response.ok){
      throw new Error(
        `モデルHTTP ${response.status}`
      );
    }

    if(!response.body){
      throw new Error(
        'ReadableStreamが利用できません'
      );
    }

    const total=
      Number(
        response.headers.get(
          'content-length'
        )
      )||
      0;

    const reader=
      response.body.getReader();

    let buffer=
      new Uint8Array(0);

    let received=0;
    let index=0;

    while(true){
      const {
        done,
        value
      }=
        await reader.read();

      if(done)break;

      const incoming=
        value||
        new Uint8Array(0);

      const merged=
        new Uint8Array(
          buffer.length+
          incoming.length
        );

      merged.set(
        buffer,
        0
      );

      merged.set(
        incoming,
        buffer.length
      );

      buffer=
        merged;

      received+=
        incoming.length;

      while(
        buffer.length>=
        this.chunkSize
      ){
        const chunk=
          buffer.slice(
            0,
            this.chunkSize
          );

        await this.putChunk(
          modelId,
          index++,
          chunk
        );

        buffer=
          buffer.slice(
            this.chunkSize
          );

        const percent=
          total
            ?received/total*100
            :0;

        showModelProgress(
          percent,
          total
            ?`${percent.toFixed(1)}% · ${formatBytes(received)} / ${formatBytes(total)}`
            :`${formatBytes(received)} 受信中…`
        );
      }

      const percent=
        total
          ?received/total*100
          :0;

      showModelProgress(
        percent,
        total
          ?`${percent.toFixed(1)}% · ${formatBytes(received)} / ${formatBytes(total)}`
          :`${formatBytes(received)} 受信中…`
      );
    }

    if(
      buffer.length
    ){
      await this.putChunk(
        modelId,
        index++,
        buffer
      );
    }

    const meta={
      id:modelId,
      url,
      size:received,
      chunks:index,
      format:
        state.settings.localModelFormat,
      model:
        state.settings.aiModel||
        state.settings.localModelName,
      savedAt:now()
    };

    await this.putMeta(
      meta
    );

    state.modelMeta=
      meta;

    showModelProgress(
      100,
      `完了 · ${formatBytes(received)} · ${index} chunks`
    );

    addLog(
      'INFO',
      'model cached',
      JSON.stringify(meta)
    );

    return meta;
  }
}

const modelManager=
  new ModelManager();

function showModelProgress(
  percent,
  text
){
  const wrap=
    $('modelProgressWrap');

  const bar=
    $('modelProgress');

  const label=
    $('modelProgressText');

  if(!wrap)return;

  wrap.style.display=
    'block';

  const p=
    Math.max(
      0,
      Math.min(
        100,
        Number(percent)||0
      )
    );

  bar.style.width=
    p+'%';

  label.textContent=
    String(text||'');
}

function testSinglePort(
  port
){
  return new Promise(
    resolve=>{
      const start=
        performance.now();

      let done=false;

      let ws;

      try{
        ws=
          new WebSocket(
            signalURL(port)
          );
      }catch{
        resolve({
          port,
          ok:false,
          error:'constructor',
          ms:0
        });

        return;
      }

      const timer=
        setTimeout(
          ()=>{
            if(done)return;

            done=true;

            try{
              ws.close();
            }catch{}

            resolve({
              port,
              ok:false,
              error:'timeout',
              ms:Math.round(
                performance.now()-
                start
              )
            });
          },
          Math.min(
            5000,
            state.peerServer.fallbackTimeoutMs
          )
        );

      ws.onopen=
        ()=>{
          if(done)return;

          done=true;

          clearTimeout(
            timer
          );

          const ms=
            Math.round(
              performance.now()-
              start
            );

          try{
            ws.close();
          }catch{}

          resolve({
            port,
            ok:true,
            ms
          });
        };

      ws.onerror=
        ()=>{
          if(done)return;

          done=true;

          clearTimeout(
            timer
          );

          try{
            ws.close();
          }catch{}

          resolve({
            port,
            ok:false,
            error:'error',
            ms:Math.round(
              performance.now()-
              start
            )
          });
        };
    }
  );
}

async function testPorts(){
  showModal(`
    <h3>🔁 接続先診断</h3>

    <p class="help">

async function readICEStats(
  pc
){
  const data={
    localCandidates:[],
    remoteCandidates:[],
    candidatePairs:[],
    transports:[]
  };

  try{
    const stats=
      await pc.getStats();

    stats.forEach(
      r=>{
        if(
          r.type==='local-candidate'
        ){
          data.localCandidates.push({
            type:r.candidateType,
            protocol:r.protocol,
            address:
              r.address||
              r.ip,
            port:r.port,
            url:r.url
          });
        }

        if(
          r.type==='remote-candidate'
        ){
          data.remoteCandidates.push({
            type:r.candidateType,
            protocol:r.protocol,
            address:
              r.address||
              r.ip,
            port:r.port
          });
        }

        if(
          r.type==='candidate-pair' &&
          (
            r.state==='succeeded'||
            r.nominated
          )
        ){
          data.candidatePairs.push({
            state:r.state,
            nominated:
              !!r.nominated,
            protocol:r.protocol,
            rtt:
              r.currentRoundTripTime,
            bytesSent:r.bytesSent,
            bytesReceived:r.bytesReceived
          });
        }

        if(
          r.type==='transport'
        ){
          data.transports.push({
            dtlsState:
              r.dtlsState,
            iceState:
              r.iceState,
            selectedPair:
              r.selectedCandidatePairId
          });
        }
      }
    );

  }catch(e){
    addLog(
      'WARN',
      'getStats failed',
      e.message
    );
  }

  return data;
}

async function runICEDiagnostic(){
  let pc=
    null;

  try{
    pc=
      new RTCPeerConnection({
        iceServers:
          getIceServers()
      });

    pc.createDataChannel(
      'ice-diagnostic'
    );

    await pc.setLocalDescription(
      await pc.createOffer()
    );

    const end=
      now()+8000;

    while(
      pc.iceGatheringState!=='complete' &&
      now()<end
    ){
      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            150
          )
      );
    }

    const stats=
      await readICEStats(
        pc
      );

    const report={
      generatedAt:
        new Date().toISOString(),
      peerId:state.id,
      webRTC:
        !!window.RTCPeerConnection,
      webGPU:
        !!navigator.gpu,
      webSocket:
        state.wsReady,
      gathering:
        pc.iceGatheringState,
      ice:
        pc.iceConnectionState,
      connection:
        pc.connectionState,
      stats
    };

    showICEDiagnostic(
      report
    );

  }catch(e){
    showModal(`
      <h3>🧪 ICE診断</h3>
      <div class="warnbox">
        ${esc(e.message)}
      </div>
      <div class="actions">
        <button class="btn" data-close>
          閉じる
        </button>
      </div>
    `);

  }finally{
    try{
      pc?.close();
    }catch{}
  }
}

async function ensureMedia(){
  if(
    state.localStream
  ){
    return state.localStream;
  }

  if(
    !navigator.mediaDevices?.getUserMedia
  ){
    throw new Error(
      'getUserMediaが利用できません'
    );
  }

  state.localStream=
    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

  $('localVideo').srcObject=
    state.localStream;

  return state.localStream;
}

async function startCall(
  remote
){
  try{
    await ensureMedia();

    const c=
      createRTC(
        remote,
        'media',
        true,
        {
          name:state.name
        }
      );

    for(
      const track of
      state.localStream.getTracks()
    ){
      c.pc.addTrack(
        track,
        state.localStream
      );
    }

    $('videoStage')
      .classList
      .add('show');

    $('callName').textContent=
      contactName(remote);

    state.callPeer=
      remote;

    await createOffer(
      c
    );

    saveCall(
      remote,
      'outgoing'
    );

    ensureWakeLock();

  }catch(e){
    toast(
      `通話開始失敗: ${e.message}`
    );

    addLog(
      'ERROR',
      'call start',
      e.message
    );
  }
}

async function shareScreen(){
  if(
    !featureOn('screenShare')
  ){
    toast(
      '画面共有をONにしてください'
    );
    return;
  }

  if(
    !state.callPeer
  ){
    toast(
      '通話中ではありません'
    );
    return;
  }

  if(
    !navigator.mediaDevices?.getDisplayMedia
  ){
    toast(
      '画面共有APIが利用できません'
    );
    return;
  }

  try{
    const stream=
      await navigator.mediaDevices.getDisplayMedia({
        video:true
      });

    const track=
      stream.getVideoTracks()[0];

    for(
      const c of
      state.connections.values()
    ){
      if(
        c.kind!=='media'||
        c.remote!==state.callPeer
      ){
        continue;
      }

      const sender=
        c.pc.getSenders().find(
          s=>
            s.track?.kind==='video'
        );

      if(sender){
        await sender.replaceTrack(
          track
        );
      }
    }

    track.onended=
      ()=>{
        const camera=
          state.localStream
            ?.getVideoTracks()
            ?. [0];

        for(
          const c of
          state.connections.values()
        ){
          if(
            c.kind!=='media'||
            c.remote!==state.callPeer
          ){
            continue;
          }

          const sender=
            c.pc.getSenders().find(
              s=>
                s.track?.kind==='video'
            );

          if(
            sender &&
            camera
          ){
            sender.replaceTrack(
              camera
            ).catch(()=>{});
          }
        }
      };

    toast(
      '🖥️ 画面共有を開始しました'
    );

  }catch(e){
    addLog(
      'WARN',
      'screen share',
      e.message
    );
  }
}

async function ensureWakeLock(){
  if(
    !featureOn('wakeLock')||
    !navigator.wakeLock?.request||
    state.wakeLock
  ){
    return;
  }

  try{
    state.wakeLock=
      await navigator.wakeLock.request(
        'screen'
      );

    state.wakeLock.addEventListener(
      'release',
      ()=>{
        state.wakeLock=null;
      }
    );

  }catch{}
}

async function releaseWakeLock(){
  if(
    !state.wakeLock
  ){
    return;
  }

  try{
    await state.wakeLock.release();
  }catch{}

  state.wakeLock=null;
}

function hangup(){
  for(
    const [key,c] of
    state.connections
  ){
    if(
      c.kind==='media'
    ){
      try{
        c.pc.close();
      }catch{}

      state.connections.delete(
        key
      );
    }
  }

  if(
    state.localStream
  ){
    for(
      const track of
      state.localStream.getTracks()
    ){
      track.stop();
    }
  }

  state.localStream=
    null;

  state.callPeer=
    null;

  $('localVideo').srcObject=
    null;

  $('remoteVideo').srcObject=
    null;

  $('videoStage')
    .classList
    .remove('show');

  releaseWakeLock();

  toast(
    '通話を終了しました'
  );
}

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(
      document.visibilityState===
        'visible' &&
      state.callPeer
    ){
      ensureWakeLock();
    }
  }
);

async function createGroup(

){
  const normalized=
    [
      ...new Set(
        peers
          .filter(
            validPeerId
          )
          .filter(
            id=>id!==state.id
          )
      )

    id:uid('group'),
    name:
      name||
      'グループ',
    peers:normalized,
    owner:state.id,
    created:now()
  };

  state.groups.push(
    group
  );

  if(
    state.storageReady
  ){
    await db.put(
      'groups',
      group
    ).catch(()=>{});
  }

  for(
    const peer of
    normalized
  ){

      await sendControlObject(

        }
      );
    }catch{
      addLog(
        'WARN',
        'group invite failed',
        peer
      );
    }
  }

  renderList();

  toast(
    `👥 ${group.name} を作成しました`

async function exportBackup(
  extension,
  encrypted
){
  let payload=
    backupPayload();

  let text='';
  let mime=
    'application/json';

  if(
    encrypted
  ){
    const password=
      prompt(
        'バックアップ暗号化パスフレーズ'
      );

    if(!password)return;

    const packet=
      await encryptJSON(
        payload,
        password
      );

    text=
      JSON.stringify(
        {
          encrypted:true,
          value:packet
        },
        null,
        2
      );

  }else if(
    extension===
    '.csv'
  ){
    const rows=[
      [
        'id',
        'peer',
        'from',
        'time',
        'type',
        'text'
      ]
    ];

    for(
      const message of
      state.chats
    ){
      rows.push([
        message.id,
        message.peer,
        message.from,
        new Date(
          message.time
        ).toISOString(),
        message.type,
        String(
          message.text||
          ''
        ).replace(
          /"/g,
          '""'
        )
      ]);
    }

    text=
      rows.map(
        row=>
          row
            .map(
              cell=>
                `"${cell}"`
            )
            .join(',')
      ).join('\n');

    mime=
      'text/csv;charset=utf-8';

  }else if(
    extension===
    '.md'
  ){
    const lines=[
      '# Secure Chat Backup',
      '',
      `Peer ID: ${state.id}`,
      `Name: ${state.name}`,
      '',
      '## Messages',
      ''
    ];

    for(
      const message of
      state.chats
    ){
      lines.push(
        `### ${contactName(message.from)} · ${formatDate(message.time)}`
      );

      lines.push(
        ''
      );

      lines.push(
        message.text||
        `[${message.type}]`
      );

      lines.push(
        ''
      );
    }

    text=
      lines.join('\n');

    mime=
      'text/markdown;charset=utf-8';

  }else if(
    extension===
    '.html'
  ){
    const body=
      state.chats
        .map(
          m=>`
            <article>
              <h3>${esc(contactName(m.from))}</h3>
              <time>${esc(formatDate(m.time))}</time>
              <p>${esc(m.text||'')}</p>
            </article>
          `
        )
        .join('\n');

    text=
      `<!doctype html>
<meta charset="utf-8">
<title>Secure Chat Archive</title>
<h1>Secure Chat Archive</h1>
${body}`;

    mime=
      'text/html;charset=utf-8';

  }else{
    text=
      JSON.stringify(
        payload,
        null,
        2
      );
  }

  const blob=
    new Blob(
      [text],
      {
        type:mime
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const a=
    document.createElement(
      'a'
    );

  a.href=url;

  a.download=
    `secure-chat-${new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        '-'
      )}${extension}`;

  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    5000
  );

  addLog(
    'INFO',
    'backup exported',
    `${extension}; encrypted=${encrypted}`
  );

  toast(
    `💾 ${extension} を出力しました`
  );
}

async function restoreBackup(
  file
){
  const rawText=
    await file.text();

  let parsed=
    jsonParse(
      rawText,
      null
    );

  if(!parsed){
    throw new Error(
      'JSON/構造化バックアップとして読めません'
    );
  }

  if(
    parsed.encrypted
  ){
    const password=
      prompt(
        'バックアップパスフレーズ'
      );

    if(!password){
      throw new Error(
        'パスフレーズが入力されませんでした'
      );
    }

    parsed=
      await decryptJSON(
        parsed.value,
        password
      );
  }

  if(
    parsed.schemaVersion!==5
  ){
    throw new Error(
      '未対応のschemaVersionです'
    );
  }

  if(
    validPeerId(
      parsed.identity?.peerId
    )
  ){
    state.id=
      parsed.identity.peerId;

    localSet(
      APP.keys.peerId,
      state.id
    );
  }

  if(
    parsed.identity?.name
  ){
    state.name=
      String(
        parsed.identity.name
      );
  }

  if(
    parsed.peerServer
  ){
    Object.assign(
      state.peerServer,
      parsed.peerServer
    );
  }

  if(
    parsed.settings
  ){
    Object.assign(
      state.settings,
      parsed.settings
    );

    state.settings.features={
      ...DEFAULT_FEATURES,
      ...(parsed.settings.features||{})
    };
  }

  const replaceStore=
    async(
      store,
      values
    )=>{
      if(
        !Array.isArray(values)
      ){
        return;
      }

      await db.clear(
        store
      );

      await db.bulkPut(
        store,
        values
      );
    };

  await replaceStore(
    'messages',
    parsed.chats
  );

  await replaceStore(
    'friends',
    parsed.friends
  );

  await replaceStore(
    'groups',
    parsed.groups
  );

  await replaceStore(
    'calls',
    parsed.calls
  );

  await replaceStore(
    'stickers',
    parsed.stickers
  );

  await replaceStore(
    'customEmojis',
    parsed.customEmojis
  );

  await replaceStore(
    'aiMemory',
    parsed.ai?.memory
  );

  state.aiHistory=
    Array.isArray(
      parsed.ai?.history
    )
      ?parsed.ai.history
      :[];

  await loadDBState();

  saveSettings();

  renderDynamicUI();
  renderList();

  toast(
    '♻️ バックアップを復元しました'
  );
}

/* =========================================================
   Microsoft Entra PKCE
   ========================================================= */

function base64URL(
  bytes
){
  return b64Encode(
    bytes
  )
  .replace(
    /\+/g,
    '-'
  )
  .replace(
    /\//g,
    '_'
  )
  .replace(
    /=+$/g,
    ''
  );
}

async function sha256(
  text
){
  return new Uint8Array(
    await crypto.subtle.digest(
      'SHA-256',
      enc.encode(text)
    )
  );
}

async function microsoftLogin(){
  if(
    !featureOn('microsoftLogin')
  ){
    toast(
      'MicrosoftログインをONにしてください'
    );
    return;
  }

  const client=
    state.settings
      .microsoftClientId
      .trim();

  if(!client){
    toast(
      'Application (client) IDを設定してください'
    );
    return;
  }

  const verifier=
    base64URL(
      crypto.getRandomValues(
        new Uint8Array(48)
      )
    );

  const challenge=
    base64URL(
      await sha256(
        verifier
      )
    );

  const oauthState=
    base64URL(
      crypto.getRandomValues(
        new Uint8Array(24)
      )
    );

  sessionStorage.setItem(
    'securechat.pkce',
    JSON.stringify({
      verifier,
      state:
        oauthState
    })
  );

  const redirect=
    location.origin+
    location.pathname;

  const params=
    new URLSearchParams({
      client_id:client,
      response_type:'code',
      redirect_uri:redirect,
      response_mode:'query',
      scope:
        'openid profile email User.Read',
      code_challenge:challenge,
      code_challenge_method:'S256',
      state:
        oauthState
    });

  location.assign(
    'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?'+
    params.toString()
  );
}

async function microsoftCallback(){
  const q=
    new URLSearchParams(
      location.search
    );

  const code=
    q.get('code');

  if(!code)return;

  const raw=
    sessionStorage.getItem(
      'securechat.pkce'
    );

  if(!raw){
    throw new Error(
      'PKCE state missing'
    );
  }

  const saved=
    JSON.parse(
      raw
    );

  if(
    saved.state!==
    q.get('state')
  ){
    throw new Error(
      'OAuth state mismatch'
    );
  }

  const body=
    new URLSearchParams({
      client_id:
        state.settings
          .microsoftClientId,
      grant_type:
        'authorization_code',
      code,
      redirect_uri:
        location.origin+
        location.pathname,
      code_verifier:
        saved.verifier,
      scope:
        'openid profile email User.Read'
    });

  const response=
    await fetch(
      'https://login.microsoftonline.com/common/oauth2/v2.0/token',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/x-www-form-urlencoded'
        },
        body
      }
    );

  if(!response.ok){
    throw new Error(
      `Microsoft token HTTP ${response.status}`
    );
  }

  const data=
    await response.json();

  localSet(
    APP.keys.ms,
    JSON.stringify({
      accessToken:
        data.access_token||'',
      idToken:
        data.id_token||'',
      savedAt:
        now()
    })
  );

  sessionStorage.removeItem(
    'securechat.pkce'
  );

  history.replaceState(
    {},
    '',
    location.pathname+
    location.hash
  );

  toast(
    'Microsoftログイン成功'
  );

  addLog(
    'INFO',
    'Microsoft login success'
  );
}

async function translateText(
  text
){
  const value=
    String(text||'')
      .trim();

  if(!value){
    return '';
  }

  const common={
    hello:'こんにちは',
    hi:'こんにちは',
    'good morning':'おはようございます',
    'good night':'おやすみなさい',
    thanks:'ありがとう',
    'thank you':'ありがとう',
    yes:'はい',
    no:'いいえ'
  };

  const key=
    value.toLowerCase();

  if(
    common[key]
  ){
    return common[key];
  }

  return(
    '翻訳アダプター未接続: '+
    value
  );
}

function renderReactions(
  message
){
  if(
    !featureOn('reactions')
  ){
    return '';
  }

  const reactions=
    message.reactions||
    {};

  const keys=
    Object.keys(
      reactions
    ).filter(
      key=>
        reactions[key]?.length
    );

  if(!keys.length){
    return '';
  }

  return `
    <div class="reactions">
      ${
        keys.map(
          emoji=>
            `
            <button
              class="reaction"
              data-reaction-message="${esc(message.id)}"
              data-reaction-emoji="${esc(emoji)}"
            >
              ${esc(emoji)}
              ${reactions[emoji].length}
            </button>
            `
        ).join('')
      }
    </div>
  `;
}

            .toLowerCase()

      );

    list.innerHTML=
      friends.length
        ?friends.map(
          f=>
            `
            <button
              class="item ${
                state.selected===f.id
                  ?'active'
                  :''
              }"
              data-peer="${esc(f.id)}"
            >
              <span class="avatar">
                ${esc(
                  avatarText(
                    f.name
                  )
                )}
              </span>

              <span class="txt">
                <strong>${esc(f.name)}</strong>
                <p>${esc(f.id)}</p>
              </span>

              ${
                findDataConnection(
                  f.id
                )
                  ?'<span class="pill ok">P2P</span>'
                  :''
              }
              <span class="list-connect" data-connect-peer="${esc(f.id)}">接続</span>
            </button>
            `
        ).join('')
        :`
          <div class="subtle" style="padding:15px">
            フレンドはいません。
          </div>
        `;

  }else if(
    state.tab==='history'
  ){
    list.innerHTML=
      state.callsHistory.length
        ?state.callsHistory.map(
          call=>
            `
            <button
              class="item"
              data-peer="${esc(call.peer)}"
            >
              <span class="avatar">☎</span>

              <span class="txt">
                <strong>
                  ${esc(
                    contactName(
                      call.peer
                    )
                  )}
                </strong>

                <p>
                  ${
                    call.direction==='outgoing'
                      ?'発信'
                      :'着信'
                  }
                  ・
                  ${esc(
                    formatDate(
                      call.time
                    )
                  )}
                </p>
              </span>

              <span class="list-connect" data-connect-peer="${esc(call.peer)}">接続</span>
            </button>
            `
        ).join('')
        :`
          <div class="subtle" style="padding:15px">
            通話履歴はありません。
          </div>
        `;

  }else{
    const rows=[];

    const peers=
      [
        ...new Set(
          state.chats
            .filter(
              m=>!m.groupId
            )
            .map(
              m=>m.peer
            )
        )
      ];

    for(
      const peer of
      peers
    ){
      if(
        query &&
        !(
          contactName(
            peer
          )
          .toLowerCase()
          .includes(query)||
          peer.includes(query)
        )
      ){
        continue;
      }

      const messages=
        state.chats.filter(
          m=>
            m.peer===peer
        );

      const last=
        messages[
          messages.length-1
        ];

      rows.push(
        `
        <button
          class="item ${
            state.selected===peer
              ?'active'
              :''
          }"
          data-peer="${esc(peer)}"
        >
          <span class="avatar">
            ${esc(
              avatarText(
                contactName(peer)
              )
            )}
          </span>

          <span class="txt">
            <strong>
              ${esc(
                contactName(peer)
              )}
            </strong>

            <p>
              ${esc(
                last?.text||
                `[${last?.type||'chat'}]`
              )}
            </p>
          </span>

          ${
            state.unread[peer]
              ?`
                <span class="pill">
                  ${state.unread[peer]}
                </span>
              `
              :''
          }

          <span class="time">
            ${
              last
                ?esc(
                  formatTime(
                    last.time
                  )
                )
                :''
            }
          </span>

        </button>
        `
      );
    }

    for(
      const friend of
      state.friends
    ){
      if(
        peers.includes(
          friend.id
        )
      ){
        continue;
      }

      if(
        query &&
        !(
          friend.name
            .toLowerCase()
            .includes(query)||
          friend.id.includes(query)
        )
      ){
        continue;
      }

      rows.push(
        `
        <button
          class="item"
          data-peer="${esc(friend.id)}"
        >
          <span class="avatar">
            ${esc(
              avatarText(
                friend.name
              )
            )}
          </span>

          <span class="txt">
            <strong>
              ${esc(friend.name)}
            </strong>
            <p>新しいチャット</p>
          </span>
        </button>
        `
      );
    }

    if(
      featureOn('groups')
    ){
      for(
        const group of
        state.groups
      ){
        if(
          query &&
          !group.name
            .toLowerCase()
            .includes(query)
        ){
          continue;
        }

        rows.push(
          `
          <button
            class="item"
            data-group="${esc(group.id)}"
          >
            <span class="avatar">👥</span>

            <span class="txt">
              <strong>
                ${esc(group.name)}
              </strong>
              <p>
                ${group.peers.length}人
              </p>
            </span>
          </button>
          `
        );
      }
    }

    list.innerHTML=
      rows.join('')||
      `
        <div class="subtle" style="padding:15px">
          ＋から相手を追加してください。
        </div>
      `;
  }

  list
    .querySelectorAll(
      '[data-peer]'
    )
    .forEach(
      button=>{
        button.onclick=
          ()=>{
            selectPeer(
              button.dataset.peer
            );
          };
      }
    );

  list
    .querySelectorAll(
      '[data-connect-peer]'
    )
    .forEach(
      button=>{
        button.onclick=
          async e=>{
            e.preventDefault();
            e.stopPropagation();
            await connectDirectPeer(button.dataset.connectPeer);
          };
      }
    );

  list
    .querySelectorAll(
      '[data-group]'
    )
    .forEach(
      button=>{
        button.onclick=
          ()=>{
            const group=
              state.groups.find(
                g=>
                  g.id===
                  button.dataset.group
              );

            if(group){
              renderGroup(
                group
              );
            }
          };
      }
    );
}

function renderGroup(
  group
){
  state.selectedGroup=
    group.id;

  state.selected=
    null;

  $('topAvatar').textContent=
    '👥';

  $('topName').textContent=
    group.name;

  setTopStatus(
    `${group.peers.length}人`
  );

  const chat=
    $('chat');

  chat.innerHTML=`
    <div class="notice">
      👥 ${esc(group.name)}
    </div>
  `;

  const messages=
    state.chats.filter(
      m=>
        m.groupId===
        group.id
    );

  if(!messages.length){
    chat.insertAdjacentHTML(
      'beforeend',
      `
        <div class="empty">
          グループメッセージはまだありません。
        </div>
      `
    );
    return;
  }

  for(
    const m of
    messages
  ){
    const row=
      document.createElement(
        'div'
      );

    row.className=
      'message-row '+
      (
        m.from===state.id
          ?'mine'
          :'theirs'
      );

    row.innerHTML=
      `
      <div class="message-shell">
        <div class="bubble">
          <div class="subtle">
            ${esc(
              contactName(
                m.from
              )
            )}
          </div>

          <div class="msg-content">
            ${esc(
              m.text||
              ''
            )}
          </div>
        </div>

        <div class="message-meta">
          ${esc(
            formatTime(
              m.time
            )
          )}
        </div>
      </div>
      `;

    chat.appendChild(
      row
    );
  }
}

function selectPeer(
  peer
){
  state.selected=
    peer;

  state.selectedGroup=
    null;

  renderChat(
    peer
  );

  renderList();

  renderDynamicUI();
}

/* =========================================================
   DB Load
   ========================================================= */

async function loadDBState(){
  try{
    await db.open();

    const [
      chats,
      friends,
      groups,
      calls,
      logs,
      stickers,
      emojis,
      memories,
      aiIndex,
      aiState
    ]=
      await Promise.all([
        db.all('messages'),
        db.all('friends'),
        db.all('groups'),
        db.all('calls'),
        db.all('logs'),
        db.all('stickers'),
        db.all('customEmojis'),
        db.all('aiMemory'),
        db.all('aiIndex'),
        db.get('meta','aiState')
      ]);

    state.chats=
      chats.sort(
        (a,b)=>a.time-b.time
      );

    state.friends=
      friends.sort(
        (a,b)=>a.added-b.added
      );

    state.groups=
      groups.sort(
        (a,b)=>a.created-b.created
      );

    state.callsHistory=
      calls.sort(
        (a,b)=>b.time-a.time
      );

    state.logs=
      logs.sort(
        (a,b)=>a.time-b.time
      );

    state.stickers=
      stickers;

    state.customEmojis=
      emojis;

    state.aiMemory=
      memories;

    state.aiIndex=
      aiIndex;

    state.aiHistory=
      aiState?.value?.history||
      [];

    state.storageReady=
      true;

    addLog(
      'INFO',
      'IndexedDB ready',
      `messages=${state.chats.length}`
    );

  }catch(e){
    state.storageReady=
      false;

    addLog(
      'ERROR',
      'IndexedDB unavailable',
      e.message
    );
  }
}

          'ログを消去しました'
        );
      };
  };

$('iceBtn').onclick=
  runICEDiagnostic;

$('micBtn').onclick=
  toggleMic;

$('camBtn').onclick=
  toggleCam;

$('shareBtn').onclick=
  shareScreen;

$('wakeBtn').onclick=
  ensureWakeLock;

$('hangBtn').onclick=
  hangup;

document
  .querySelectorAll(
    '.tabs button'
  )
  .forEach(
    btn=>{
      btn.onclick=
        ()=>{
          document
            .querySelectorAll(
              '.tabs button'
            )
            .forEach(
              b=>
                b.classList.remove(
                  'active'
                )
            );

          btn.classList.add(
            'active'
          );

          state.tab=
            btn.dataset.tab;

          renderList();
        };
    }
  );

$('search').oninput=
  ()=>{
    renderList();

    if(
      state.selected
    ){
      renderChat(
        state.selected
      );
    }
  };

/* =========================================================
   Invite hash
   ========================================================= */

function handleInviteHash(){
  const match=
    location.hash.match(
      /peer=(\d{6})/
    );

  if(!match)return;

  setTimeout(
    ()=>{
      openFriend();

      setTimeout(
        ()=>{
          if(
            $('friendPeer')
          ){
            $('friendPeer').value=
              match[1];
          }
        },
        0
      );
    },
    200
  );
}

/* =========================================================
   Incoming browser notification permission
   ========================================================= */

async function requestNotifications(){
  if(
    !featureOn('browserNotify')
  ){
    return;
  }

  if(
    !('Notification' in window)
  ){
    return;
  }

  if(
    Notification.permission==='default'
  ){
    try{
      await Notification.requestPermission();
    }catch{}
  }
}

/* =========================================================
   Error hooks
   ========================================================= */

window.addEventListener(
  'error',
  e=>{
    addLog(
      'ERROR',
      'window error',
      `${e.message||'unknown'} @ ${e.filename||''}:${e.lineno||''}`
    );
  }
);

window.addEventListener(
  'unhandledrejection',
  e=>{
    addLog(
      'ERROR',
      'unhandled rejection',
      String(
        e.reason?.message||
        e.reason||
        'unknown'
      )
    );
  }
);

/* =========================================================
   Boot
   ========================================================= */

async function boot(){
  $('myId').textContent=
    state.id;

  applyTheme();

  await loadDBState();

  if(
    featureOn('aiDatabase')
  ){
    await seedAIIndex();
  }

  renderDynamicUI();
  renderList();

  addLog(
    'INFO',
    'Secure Chat boot',
    `peer=${state.id}`
  );

  addLog(
    'INFO',
    'WebRTC',
    `RTCPeerConnection=${!!window.RTCPeerConnection}; getUserMedia=${!!navigator.mediaDevices?.getUserMedia}`
  );

  addLog(
    'INFO',
    'WebGPU',
    `navigator.gpu=${!!navigator.gpu}`
  );

  connectSignal();

  requestNotifications();

  setTimeout(
    monitorSecurity,
    1800
  );

  try{
    await microsoftCallback();
  }catch(e){
    addLog(
      'WARN',
      'Microsoft callback',
      e.message
    );
  }

  handleInviteHash();

  if(
    !localGet(
      APP.keys.password,
      ''
    )
  ){
    setTimeout(
      openPasswordSetup,
      400
    );
  }
}

function openPasswordSetup(){
  showModal(`
    <h3>🔐 共有パスフレーズ</h3>

    <p class="help">
      Secure Chatはアプリ層暗号化にAES-GCMを使います。
      相手と同じ共有パスフレーズを設定してください。
      パスフレーズ自体はシグナリングへ送信しません。
    </p>

    <div class="field">
      <label>共有パスフレーズ</label>
      <input
        id="initialPassword"
        type="password"
      >
    </div>

    <div class="field">
      <label>表示名</label>
      <input
        id="initialName"
        value="${esc(state.name)}"
      >
    </div>

    <div class="actions">
      <button class="btn" id="skipInitial">
        後で
      </button>

      <button
        class="btn primary"
        id="saveInitial"
      >
        保存
      </button>
    </div>
  `);

  $('skipInitial').onclick=
    closeModal;

  $('saveInitial').onclick=
    ()=>{
      localSet(
        APP.keys.password,
        $('initialPassword').value
      );

      state.name=
        $('initialName')
          .value
          .trim()||
        'ユーザー';

      saveSettings();

      closeModal();

      toast(
        '共有パスフレーズを保存しました'
      );
    };
}

/* =========================================================
   Wake / unload
   ========================================================= */

window.addEventListener(
  'beforeunload',
  ()=>{
    try{
      state.ws?.close();
    }catch{}

    try{
      state.wakeLock?.release();
    }catch{}
  }
);

/* =========================================================
   Public namespace
   ========================================================= */

window.SecureChat={
  version:APP.version,
  state,
  features:FEATURE_META,
  LocalAI,
  modelManager,
  openSettings,
  openAI,
  runICEDiagnostic,
  openBackup,
  openSearch,
  getAIStatus,
  getPythonSource
};

/* =========================================================
   Start
   ========================================================= */

boot();

</script>

<script>
(function(){
  'use strict';

  // Keep every non-settings feature enabled by default, while preserving only two toggles in Settings.
  const LOCKED_ON=['reactions','customEmoji','stickers','mentions','messageSearch','files','screenShare','voiceChannels','aiDatabase','aiImage','aiVoice','aiMemory','backup','browserNotify','notificationSound','wakeLock','autoReconnect','advancedDiagnostics','microsoftLogin','localWebGPU','aiToolControl','pythonBridge','groups'];
  for(const k of LOCKED_ON) state.settings.features[k]=true;
  if(state.settings.features.richText===undefined) state.settings.features.richText=true;
  if(state.settings.features.translation===undefined) state.settings.features.translation=true;
  saveSettings();

  // ---------------- Sticker UX: LINE-like dock, not just text input ----------------
  function stickerDock(){return $('stickerDock')}
  function renderStickerDock(){
    const dock=stickerDock(); if(!dock)return;
    const stickers=Array.isArray(state.stickers)?state.stickers:[];
    dock.innerHTML=`
      <div class="sticker-dock-head">
        <div class="sticker-dock-title">🩷 ステッカー</div>
        <button class="btn" type="button" id="stickerDockClose">閉じる</button>
      </div>
      <div class="sticker-grid-line">
        ${stickers.length?stickers.map(s=>`
          <button class="sticker-tile" type="button" data-sticker-fast="${esc(s.id)}" title="${esc(s.name||'ステッカー')}">
            <img src="${esc(s.dataUrl)}" alt="${esc(s.name||'ステッカー')}">
          </button>`).join(''):`<div class="sticker-empty" style="grid-column:1/-1">まだステッカーがありません。下の「作る」から追加できます。</div>`}
      </div>
      <div class="sticker-create">
        <button class="btn primary" type="button" id="stickerCreateFast">＋ 作る</button>
        <div class="subtle">タップするとそのまま大きなステッカーとして送信します。</div>
      </div>`;
    $('stickerDockClose').onclick=()=>dock.classList.remove('show');
    $('stickerCreateFast').onclick=()=>{
      $('fileInput').accept='image/*'; $('fileInput').multiple=false; $('fileInput').dataset.mode='sticker'; $('fileInput').click();
    };
    dock.querySelectorAll('[data-sticker-fast]').forEach(btn=>btn.onclick=async()=>{
      const st=state.stickers.find(x=>x.id===btn.dataset.stickerFast);
      if(st) await sendSticker(st);
    });
  }
  function toggleStickerDock(){
    const dock=stickerDock(); if(!dock)return;
    renderStickerDock();
    dock.classList.toggle('show');
  }
  window.toggleStickerDock=toggleStickerDock;

  // Replace the generic sticker action with the dock.
  const oldRenderDynamicUI=window.renderDynamicUI;
  if(typeof oldRenderDynamicUI==='function'){
    window.renderDynamicUI=function(){
      oldRenderDynamicUI();
      const bar=$('actionbar');
      if(bar && !bar.querySelector('[data-action="sticker"]')){
        const btn=document.createElement('button'); btn.type='button'; btn.dataset.action='sticker'; btn.textContent='🩷 ステッカー';
        btn.onclick=toggleStickerDock; bar.appendChild(btn);
      } else {
        const b=bar?.querySelector('[data-action="sticker"]'); if(b)b.onclick=toggleStickerDock;
      }
      const eb=$('emojiBtn');
      if(eb){eb.textContent='😀'; eb.title='絵文字';}
    };
  }
  if($('actionbar')) setTimeout(()=>renderDynamicUI(),0);

  // Add a dedicated sticker button beside the emoji button without breaking the existing composer.
  if(!$('stickerBtnComposer')){
    const eb=$('emojiBtn');
    if(eb){
      const b=document.createElement('button'); b.className='btn'; b.id='stickerBtnComposer'; b.type='button'; b.title='ステッカー'; b.textContent='🩷'; b.onclick=toggleStickerDock;
      eb.insertAdjacentElement('afterend',b);
    }
  }

  // Improve sticker rendering in message bubbles.
  const oldRenderMessageBody=window.renderMessageBody;
  if(typeof oldRenderMessageBody==='function'){
    window.renderMessageBody=function(message){
      if(message?.type==='sticker' && message?.attachment?.dataUrl){
        return `<div class="msg-content"><img class="sticker-message-img" src="${esc(message.attachment.dataUrl)}" alt="${esc(message.attachment.name||'ステッカー')}"></div>`;
      }
      return oldRenderMessageBody(message);
    };
  }

  // ---------------- Screen share reliability ----------------
  async function enhancedShareScreen(){
    if(!state.callPeer){ toast('先にビデオ通話を開始してください'); return; }
    const getDM=navigator.mediaDevices?.getDisplayMedia;
    if(typeof getDM!=='function'){ toast('このChrome環境では画面共有APIが利用できません'); addLog('WARN','screen share unsupported','getDisplayMedia unavailable'); return; }
    try{
      const stream=await getDM.call(navigator.mediaDevices,{video:{displaySurface:'browser'},audio:false});
      const track=stream.getVideoTracks()[0];
      const mediaConn=state.connections.get?.(state.callPeer);
      let replaced=false;
      if(mediaConn?.pc){
        const sender=mediaConn.pc.getSenders().find(x=>x.track?.kind==='video');
        if(sender){await sender.replaceTrack(track); replaced=true;}
      }
      if(!replaced){
        for(const c of state.connections.values()){
          if(c.kind==='media' && c.remote===state.callPeer){
            const sender=c.pc.getSenders().find(x=>x.track?.kind==='video');
            if(sender){await sender.replaceTrack(track); replaced=true;}
          }
        }
      }
      if(!replaced){track.stop(); throw new Error('映像送信経路が見つかりません');}
      $('localVideo')?.srcObject && ($('localVideo').srcObject=stream);
      track.onended=()=>{
        const camera=state.localStream?.getVideoTracks?.()[0];
        const c=state.connections.get?.(state.callPeer);
        const sender=c?.pc?.getSenders?.().find(x=>x.track?.kind==='video');
        if(sender && camera) sender.replaceTrack(camera).catch(()=>{});
        if($('localVideo') && state.localStream) $('localVideo').srcObject=state.localStream;
        toast('🖥️ 画面共有を終了しました');
      };
      toast('🖥️ 画面共有を開始しました');
    }catch(e){ addLog('WARN','screen share',e.message); toast('画面共有できませんでした: '+e.message); }
  }
  window.shareScreen=enhancedShareScreen;
  $('shareBtn')?.addEventListener('click',e=>{e.preventDefault(); e.stopPropagation(); enhancedShareScreen();},true);

  // ---------------- AI knowledge base / help ----------------
  const helpRules=[
    [/使い方|使用方法|操作方法|どうやって使|使う方法|ヘルプ|help|使いかた|操作を教/, 'help'],
    [/フレンド|友達|友だち|追加して|peer ?id/, 'friend'],
    [/通話|電話|ビデオ通話|音声通話/, 'call'],
    [/画面共有|スクリーンシェア|share screen/, 'share'],
    [/ステッカー|スタンプ/, 'sticker'],
    [/絵文字|emoji/, 'emoji'],
    [/ファイル|添付|送信できる|データ送信/, 'file'],
    [/検索|探したい|履歴/, 'search'],
    [/バックアップ|復元|保存/, 'backup'],
    [/設定|テーマ|ダークモード/, 'settings'],
    [/peer id|自分のid|自分のＩＤ/, 'id'],
    [/セキュリティ|安全|暗号|暗号化/, 'security'],
    [/AI|chatgpt|openai/, 'ai']
  ];
  function appHelp(kind){
    const base={
      help:`📘 Secure Chatの使い方\n\n① 相手の6桁Peer IDを「＋ フレンド」から追加\n② 共有パスフレーズが一致していればP2P通信を確立\n③ チャット欄からメッセージを送信\n④ 📎でファイル、🩷でステッカー、😀で絵文字\n⑤ 📹でビデオ通話。通話中は🖥️で画面共有\n⑥ 🤖 SecureAIでは状態確認・履歴検索・質問・要約などができます\n⑦ ⚙️ではテーマ、P2P接続、AI接続などを管理\n\n困ったら「今の状態」「ICE診断」「OpenAI接続」などと聞いてください。`,
      friend:`👥 フレンド追加\n\n「＋」→相手の6桁Peer ID→名前（任意）→「追加して接続」。招待リンクからPeer IDを自動入力することもできます。`,
      call:`📹 通話\n\n相手を選んでビデオ通話を開始します。通話中は🎙️マイク、📷カメラ、🖥️画面共有、☀️画面維持、☎終了を使えます。`,
      share:`🖥️ 画面共有\n\nビデオ通話中に画面共有を押すとChromeの共有対象選択が開きます。共有を停止するとカメラ映像へ戻します。`,
      sticker:`🩷 ステッカー\n\n入力欄の🩷を押すとステッカーパネルが開きます。登録済みのステッカーをタップすると、大きなステッカー画像としてそのまま送信できます。「＋ 作る」から画像をステッカーとして登録できます。`,
      emoji:`😀 絵文字\n\n入力欄の😀から絵文字を選べます。カスタム絵文字も登録できます。`,
      file:`📎 ファイル共有\n\n入力欄の📎からファイルを選択してP2P送信します。転送可能サイズは設定値に従います。`,
      search:`🔎 検索\n\nサイドバー検索はチャット・フレンドを絞り込みます。詳細検索では履歴を横断検索できます。AIにも「○○を検索して」と聞けます。`,
      backup:`💾 バックアップ\n\n履歴・設定・AIメモリなどをバックアップして、あとで復元できます。機密情報を含むバックアップは安全に保管してください。`,
      settings:`⚙️ 設定\n\n外観・P2P接続・ファイル転送・AI接続などを管理します。機能のON/OFFは基本的に自動で有効化されています。リッチテキストと翻訳だけは設定で切り替えできます。`,
      id:`🆔 Peer ID\n\n左側の「あなたのPeer ID」に表示される6桁数字がこの端末のIDです。更新しても端末内の保存値を再利用します。`,
      security:`🔐 セキュリティ\n\nWebRTC/DTLSとアプリ層のAES-GCMを使い、接続・ICE状態も監視します。ただしブラウザだけで盗聴や傍受を断定することはできません。`,
      ai:`🤖 AI\n\nSecureAIはローカルDBから関連情報を検索し、状態確認、使い方、履歴、要約などを回答します。OpenAI APIキーを設定した場合は、外部AIへ質問を送信できます。APIキーは共有しないでください。`
    }; return base[kind]||base.help;
  }

  function classifyHelp(q){
    const n=aiNormalize(q); for(const [rx,k] of helpRules) if(rx.test(n)) return k; return '';
  }

  const oldFallback=LocalAI.fallback.bind(LocalAI);
  LocalAI.fallback=function(question,imageData=''){
    const k=classifyHelp(question); if(k) return appHelp(k);
    return oldFallback(question,imageData);
  };

  // Expand RAG scoring using recency, phrase hits and memory priority.
  const oldRetrieveAI=window.retrieveAI;
  if(typeof oldRetrieveAI==='function'){
    window.retrieveAI=function(query,limit=8){
      if(!featureOn('aiDatabase')) return [];
      const nq=aiNormalize(query); const toks=[...new Set(aiTokens(query))]; const nowTs=Date.now();
      return state.aiIndex.map(entry=>{
        let score=0; const text=aiNormalize(entry.text||'');
        if(nq && text.includes(nq)) score+=7;
        for(const t of toks){if(entry.tokens?.includes(t))score+=3;if(text.includes(t))score+=1;}
        const age=Math.max(0,nowTs-(entry.time||0)); score+=Math.max(0,2-Math.log10(1+age/86400000));
        if(entry.kind==='memory') score+=1.4;
        return {entry,score};
      }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,Math.max(1,limit)).map(x=>x.entry);
    };
  }

  // ---------------- OpenAI Responses API client ----------------
  const OPENAI_ENDPOINT='https://api.openai.com/v1/responses';
  state.settings.openaiEnabled=!!state.settings.openaiEnabled;
  if(typeof state.settings.openaiModel!=='string') state.settings.openaiModel=state.settings.aiModel||'gpt-5-mini';
  if(typeof state.settings.openaiApiKey!=='string') state.settings.openaiApiKey=state.settings.aiApiKey||'';
  if(typeof state.settings.openaiEndpoint!=='string') state.settings.openaiEndpoint=OPENAI_ENDPOINT;

  function aiSystemPrompt(){
    const status=getAIStatus();
    const ctx=retrieveAI('',12).map(x=>x.text).slice(0,12);
    return [
      'あなたはSecure Chatの組み込みAIアシスタントです。',
      '日本語で自然に回答してください。',
      'アプリの事実が必要な場合は与えられた状態・ローカルDBを優先し、不明なことは推測しないでください。',
      '使い方の質問には具体的な画面操作を手順で説明してください。',
      '現在のアプリ状態:',JSON.stringify(status),
      '関連ローカルコンテキスト:',ctx.join('\n---\n')||'(なし)'
    ].join('\n');
  }

  async function openAIResponse(question,imageData=''){
    const key=state.settings.openaiApiKey||state.settings.aiApiKey;
    if(!key) throw new Error('OpenAI APIキーが設定されていません');
    const model=state.settings.openaiModel||state.settings.aiModel||'gpt-5-mini';
    const content=[{type:'input_text',text:question||'この画像について説明してください。'}];
    if(imageData) content.push({type:'input_image',image_url:imageData,detail:'auto'});
    const response=await fetch(state.settings.openaiEndpoint||OPENAI_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,input:[{role:'system',content:[{type:'input_text',text:aiSystemPrompt()}]},{role:'user',content}],store:false})
    });
    const raw=await response.text(); let data={}; try{data=JSON.parse(raw);}catch{}
    if(!response.ok) throw new Error(data?.error?.message||`OpenAI HTTP ${response.status}`);
    const texts=[];
    if(typeof data.output_text==='string') texts.push(data.output_text);
    for(const item of (data.output||[])) for(const c of (item.content||[])) if(typeof c.text==='string') texts.push(c.text);
    const out=texts.join('\n').trim(); if(!out) throw new Error('OpenAIの回答が空でした'); return out;
  }
  window.openAIResponse=openAIResponse;

  const baseGenerate=LocalAI.generate.bind(LocalAI);
  LocalAI.generate=async function(question,imageData=''){
    const k=classifyHelp(question); if(k) return appHelp(k);
    if(state.settings.openaiEnabled && (state.settings.openaiApiKey||state.settings.aiApiKey)){
      try{return await openAIResponse(question,imageData);}catch(e){addLog('WARN','OpenAI failed',e.message);}
    }
    return baseGenerate(question,imageData);
  };

  // Enrich AI window with quick actions and connection state.
  const baseOpenAI=window.openAI;
  if(typeof baseOpenAI==='function'){
    window.openAI=function(){
      baseOpenAI();
      setTimeout(()=>{
        const input=$('aiInput'); if(!input)return;
        const box=document.createElement('div'); box.className='ai-quick-examples';
        ['使い方教えて','今の状態を教えて','画面共有の使い方','ステッカーの使い方','OpenAI接続を確認'].forEach(t=>{
          const b=document.createElement('button'); b.type='button'; b.textContent=t; b.onclick=()=>{input.value=t;$('aiAsk')?.click();}; box.appendChild(b);
        });
        input.insertAdjacentElement('afterend',box);
        const parent=input.closest('.ai-layout')?.querySelector('.card');
        if(parent){const k=document.createElement('div');k.className='ai-kpi';k.innerHTML=`<div class="card"><b>${state.aiIndex.length}</b><small>AI Index</small></div><div class="card"><b>${state.aiMemory.length}</b><small>AI Memory</small></div>`; parent.appendChild(k)}
      },0);
    };
  }

  // OpenAI settings: dedicated key/model/test card, without exposing the key value elsewhere.
  const originalOpenSettings=window.openSettings;
  function addOpenAISettingsCard(){
    const panel=$('panel'); if(!panel || $('openaiSettingsCard')) return;
    const card=document.createElement('div'); card.className='card'; card.id='openaiSettingsCard'; card.style.marginTop='12px';
    card.innerHTML=`<b>🤖 OpenAI / ChatGPT 接続</b><div class="subtle" style="margin-top:4px">この端末からOpenAI APIへ直接接続します。APIキーは他人と共有しないでください。</div><div class="field"><label><input id="openaiEnabled" type="checkbox" ${state.settings.openaiEnabled?'checked':''}> OpenAIを優先して使う</label></div><div class="field"><label>API Key</label><input id="openaiApiKey" type="password" autocomplete="off" placeholder="sk-…"></div><div class="field"><label>Model</label><input id="openaiModel" value="${esc(state.settings.openaiModel||'gpt-5-mini')}"></div><div class="actions" style="justify-content:flex-start"><button class="btn" id="openaiTest" type="button">接続テスト</button><span id="openaiStatus" class="pill warn">未接続</span></div>`;
    const aiHeading=[...panel.querySelectorAll('h4')].find(x=>x.textContent.includes('SecureAI'));
    (aiHeading?.parentElement||panel).appendChild(card);
    $('openaiApiKey').value=state.settings.openaiApiKey||'';
    $('openaiEnabled').onchange=()=>{state.settings.openaiEnabled=$('openaiEnabled').checked;saveSettings();};

<script>
/* =========================================================
   Secure Chat Canary Monitor
   - 10秒ごとに暗号化済みDataChannel上でCANARY/PONGを交換
   - 応答欠落、RTT異常、想定外のシーケンスを警告
   - これは「傍受・盗聴」を判定する機能ではありません
   ========================================================= */
(function(){
  'use strict';

  const CANARY={
    intervalMs:10000,
    timeoutMs:6000,
    rttWarnMs:2500,
    maxMisses:2,
    timer:null,
    seq:new Map(),
    pending:new Map(),
    lastSeen:new Map(),
    stats:new Map()
  };

  function canaryId(c){
    return `${c.remote}::${c.connectionId}`;
  }

  function canaryState(c){
    const id=canaryId(c);
    if(!CANARY.stats.has(id)){
      CANARY.stats.set(id,{sent:0,received:0,misses:0,lastRtt:0,lastSeq:0,lastSent:0,lastPong:0});
    }
    return CANARY.stats.get(id);
  }

  function canaryWarn(c,message){
    const peer=c?.remote||'unknown';
    addLog('WARN','CANARY',`${peer}: ${message}`);
    try{ alert(`⚠️ Secure Chat カナリア警告\n\n相手: ${peer}\n${message}\n\nこれはネットワーク上の異常を示す通知であり、傍受・盗聴を断定するものではありません。`); }catch{}
    try{ toast(`⚠️ カナリア警告: ${message}`); }catch{}
  }

  function removePending(id,seq){
    const map=CANARY.pending.get(id);
    if(!map)return null;
    const item=map.get(seq);
    if(item)map.delete(seq);
    if(!map.size)CANARY.pending.delete(id);
    return item||null;
  }

  function addPending(id,seq,item){
    if(!CANARY.pending.has(id))CANARY.pending.set(id,new Map());
    CANARY.pending.get(id).set(seq,item);
  }

  async function sendCanary(c){
    if(!c || c.kind!=='data' || c.control?.readyState!=='open')return;
    const id=canaryId(c);
    const st=canaryState(c);
    const next=(CANARY.seq.get(id)||0)+1;
    CANARY.seq.set(id,next);
    const sentAt=Date.now();
    addPending(id,next,{sentAt,c});
    st.sent++;
    st.lastSeq=next;
    st.lastSent=sentAt;

    try{
      await sendControlObject(c.remote,{
        type:'__securechat_canary__',
        op:'ping',
        seq:next,
        sentAt,
        token:randHex(12)
      });
    }catch(e){
      removePending(id,next);
      canaryWarn(c,`カナリア送信失敗: ${e?.message||'unknown'}`);
    }
  }

  function checkExpired(){
    const now=Date.now();
    for(const [id,map] of CANARY.pending){
      for(const [seq,item] of map){
        if(now-item.sentAt>CANARY.timeoutMs){
          map.delete(seq);
          const st=CANARY.stats.get(id);
          if(st){
            st.misses++;
            const c=item.c;
            canaryWarn(c,`CANARY ${seq} の応答が${Math.round(CANARY.timeoutMs/1000)}秒以内にありません（連続欠落 ${st.misses}回）`);
            if(st.misses>=CANARY.maxMisses){
              try{ monitorSecurity(c.pc); }catch{}
            }
          }
        }
      }
      if(!map.size)CANARY.pending.delete(id);
    }
  }

  function canaryTick(){
    checkExpired();
    for(const c of state.connections.values()){
      if(c?.kind==='data' && c.control?.readyState==='open'){
        sendCanary(c).catch(()=>{});
      }
    }
  }

  function start(){
    if(CANARY.timer)return;
    CANARY.timer=setInterval(canaryTick,CANARY.intervalMs);
    setTimeout(canaryTick,1500);
    setInterval(checkExpired,1000);
    addLog('INFO','CANARY','10秒間隔カナリア監視を開始');
  }

  const originalReceivePacket=receivePacket;
  receivePacket=async function(remote,object){
    if(object?.type==='__securechat_canary__'){
      const c=[...state.connections.values()].find(x=>x?.remote===remote && x?.kind==='data');
      if(object.op==='ping'){
        try{
          if(c?.control?.readyState==='open'){
            await sendControlObject(remote,{
              type:'__securechat_canary__',
              op:'pong',
              seq:Number(object.seq)||0,
              sentAt:Number(object.sentAt)||0,
              receivedAt:Date.now()
            });
          }
        }catch(e){
          if(c)canaryWarn(c,`カナリア応答失敗: ${e?.message||'unknown'}`);
        }
        return;
      }
      if(object.op==='pong'){
        if(!c)return;
        const id=canaryId(c);
        const seq=Number(object.seq)||0;
        const item=removePending(id,seq);
        if(!item){
          canaryWarn(c,`想定外のCANARY応答を受信しました（seq=${seq}）`);
          return;
        }
        const rtt=Math.max(0,Date.now()-item.sentAt);
        const st=canaryState(c);
        st.received++;
        st.lastRtt=rtt;
        st.lastPong=Date.now();
        st.misses=0;
        if(rtt>CANARY.rttWarnMs){
          canaryWarn(c,`カナリアRTTが高くなっています: ${rtt}ms`);
        }
        return;
      }
    }
    return originalReceivePacket(remote,object);
  };

  window.SecureChatCanary={
    start,
    tick:canaryTick,
    stats:CANARY.stats
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }
})();
</script>

<script>
/* Secure Chat final reliability / friend-request integration */
(function(){
  'use strict';
  const KEY='securechat.friendRequests.v1';

  function readReq(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||'[]');
      return Array.isArray(x)?x.filter(r=>/^\\d{6}$/.test(String(r.id||''))):[];
    }catch{return []}
  }
  function saveReq(){
    try{localStorage.setItem(KEY,JSON.stringify(state.friendRequests||[]));}catch(e){try{addLog('WARN','friend requests save',e.message)}catch{}}
  }
  if(!Array.isArray(state.friendRequests)) state.friendRequests=readReq();
  else if(!state.friendRequests.length) state.friendRequests=readReq();
  saveReq();

  function pendingIndex(id){return (state.friendRequests||[]).findIndex(x=>x.id===id)}
  function addPending(remote,name){
    if(!/^\\d{6}$/.test(String(remote||'')) || remote===state.id) return;
    const f=state.friends.find(x=>x.id===remote);
    if(f) return;
    const item={id:String(remote),name:String(name||remote),time:Date.now()};
    const i=pendingIndex(item.id);
    if(i>=0) state.friendRequests[i]={...state.friendRequests[i],...item};
    else state.friendRequests.unshift(item);
    state.friendRequests=state.friendRequests.slice(0,200);
    saveReq(); renderFriendListSafe();
  }
  function removePending(id){
    state.friendRequests=(state.friendRequests||[]).filter(x=>x.id!==id); saveReq(); renderFriendListSafe();
  }

  // Intercept the original auto-add behavior and replace it with a real request state.
  const originalReceive=window.receivePacket;
  if(typeof originalReceive==='function' && !originalReceive.__scFriendRequestV2){
    const wrapped=async function(remote,object){
      try{
        if(object?.type==='friend-request'){
          if(state.friends.some(f=>f.id===remote)){
            await sendControlObject(remote,{type:'friend-response',accepted:true,name:state.name});
            return;
          }
          addPending(remote,object.name||remote);
          playNotificationSound?.();
          browserNotify4?.(object.name||remote,'フレンド申請が届きました');
          toast(`👥 ${object.name||remote} からフレンド申請`);
          addLog('INFO','friend request received',`${remote} (${object.name||remote})`);
          return;
        }
        if(object?.type==='friend-response'){
          if(object.accepted){
            await addFriend(remote,object.name||remote,true);
            removePending(remote);
            toast(`✅ ${object.name||remote} がフレンド申請を許可しました`);
            selectPeer(remote);
          }else{
            toast(`❌ ${object.name||remote} がフレンド申請を拒否しました`);
            addLog('INFO','friend request rejected',remote);
          }
          renderFriendListSafe();
          return;
        }
      }catch(e){addLog('ERROR','friend request handling',e.message);toast('フレンド申請処理に失敗しました')}
      return originalReceive(remote,object);
    };
    wrapped.__scFriendRequestV2=true;
    window.receivePacket=wrapped;
    try{receivePacket=wrapped}catch{}
  }

  async function acceptRequest(id){
    const req=(state.friendRequests||[]).find(x=>x.id===id); if(!req)return;
    try{
      await addFriend(id,req.name||id,true);
      await sendControlObject(id,{type:'friend-response',accepted:true,name:state.name});
      removePending(id); selectPeer(id);
      toast(`✅ ${req.name||id} をフレンドに追加しました`);
    }catch(e){
      addLog('ERROR','friend accept',`${id}: ${e.message}`);
      toast(`フレンド許可に失敗しました: ${e.message}`);
    }
  }
  async function rejectRequest(id){
    const req=(state.friendRequests||[]).find(x=>x.id===id); if(!req)return;
    try{await sendControlObject(id,{type:'friend-response',accepted:false,name:state.name})}catch(e){addLog('WARN','friend reject send',`${id}: ${e.message}`)}
    removePending(id); toast(`拒否しました: ${req.name||id}`);
  }

  function renderFriendRequests(){
    if(state.tab!=='friends') return '';
    const reqs=state.friendRequests||[];
    if(!reqs.length)return '';
    return reqs.map(r=>`<div class="friend-request-card" data-request-id="${esc(r.id)}"><div class="avatar" style="width:38px;height:38px">${esc(avatarText(r.name||r.id))}</div><div class="req-main"><div class="req-name">${esc(r.name||r.id)}</div><div class="req-id">${esc(r.id)} ・ フレンド申請</div></div><div class="friend-request-actions"><button type="button" class="accept" data-accept-request="${esc(r.id)}">許可</button><button type="button" class="reject" data-reject-request="${esc(r.id)}">拒否</button></div></div>`).join('');
  }

  function wireRequestButtons(){
    document.querySelectorAll('[data-accept-request]').forEach(b=>{b.onclick=async e=>{e.preventDefault();e.stopPropagation();await acceptRequest(b.dataset.acceptRequest)}});
    document.querySelectorAll('[data-reject-request]').forEach(b=>{b.onclick=async e=>{e.preventDefault();e.stopPropagation();await rejectRequest(b.dataset.rejectRequest)}});
  }

  const originalRenderList=window.renderList;
  function renderFriendListSafe(){
    if(typeof originalRenderList==='function'){
      try{originalRenderList()}catch(e){addLog('ERROR','render list',e.message)}
    }
    const list=$('list');
    if(list && state.tab==='friends'){
      const req=renderFriendRequests();
      if(req) list.insertAdjacentHTML('afterbegin',req);
      wireRequestButtons();
    }
  }
  window.renderList=renderFriendListSafe;
  try{renderList=renderFriendListSafe}catch{}

  // Tabs: event delegation at capture phase prevents dead/overwritten inline handlers.
  document.addEventListener('click',e=>{
    const btn=e.target.closest?.('.tabs button[data-tab]');
    if(!btn)return;
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll('.tabs button[data-tab]').forEach(x=>x.classList.toggle('active',x===btn));
    state.tab=btn.dataset.tab||'chats';
    try{renderFriendListSafe()}catch{}
  },true);

  // Direct Peer ID sidebar input.
  function directSidebar(){
    const input=$('directPeerSidebarInput'),go=$('directPeerSidebarGo');
    if(!input||!go)return;
    const run=async()=>{try{await window.connectDirectPeer?.(input.value)}catch(e){toast('接続失敗: '+e.message)}};
    go.onclick=e=>{e.preventDefault();e.stopPropagation();run()};
    input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run()}};
  }

  // Always point all screen-share buttons at one function, and remember the exact call connection.
  async function shareNow(){
    if(state.screenShareStream){
      try{state.screenShareTrack?.stop()}catch{}
      return true;
    }
    const peer=state.callPeer;
    if(!peer){toast('先にビデオ通話を開始してください');return false}
    const md=navigator.mediaDevices;
    if(typeof md?.getDisplayMedia!=='function'){toast('このChromeでは画面共有APIが利用できません');return false}
    let c=state.callConnection;
    if(!c || c.kind!=='media' || c.remote!==peer || c.pc?.connectionState==='closed'){
      c=[...state.connections.values()].find(x=>x?.kind==='media'&&x.remote===peer&&x.pc?.connectionState!=='closed')||null;
    }
    if(!c?.pc){toast('通話の映像接続が見つかりません');addLog('WARN','screen share','media connection missing');return false}
    try{
      const stream=await md.getDisplayMedia({video:true,audio:false});
      const track=stream.getVideoTracks?.()[0]; if(!track)throw new Error('画面トラックを取得できませんでした');
      let sender=c.pc.getSenders().find(s=>s.track?.kind==='video');
      if(!sender){
        const trans=c.pc.getTransceivers?.().find(t=>t.sender?.track?.kind==='video');
        sender=trans?.sender||null;
      }
      if(!sender)throw new Error('既存の映像送信スロットがありません');
      await sender.replaceTrack(track);
      state.screenShareStream=stream;state.screenShareTrack=track;state.screenShareSender=sender;
      if($('localVideo')) $('localVideo').srcObject=stream;
      track.onended=async()=>{
        try{const cam=state.localStream?.getVideoTracks?.()[0];if(cam)await sender.replaceTrack(cam);if($('localVideo')&&state.localStream)$('localVideo').srcObject=state.localStream}catch(e){addLog('WARN','screen share restore',e.message)}
        state.screenShareStream=null;state.screenShareTrack=null;state.screenShareSender=null;toast('🖥️ 画面共有を終了しました');
      };
      toast('🖥️ 画面共有を開始しました');addLog('INFO','screen share started',peer);return true;
    }catch(e){
      const n=e?.name||'';addLog('WARN','screen share',`${n}: ${e?.message||e}`);
      if(n==='NotAllowedError')toast('画面共有がキャンセルまたは許可されませんでした');
      else if(n==='InvalidStateError')toast('画面共有ボタンを直接クリックして開始してください');
      else toast('画面共有に失敗しました: '+(e?.message||'unknown'));
      return false;
    }
  }
  window.shareScreen=shareNow;try{shareScreen=shareNow}catch{}
  $('shareBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();shareNow()},true);

  // Signal connection UX: never leave the header at 「初期化中…」 forever.
  setTimeout(()=>{
    try{
      if(!$('topStatus'))return;
      if(state.wsReady)setTopStatus('オンライン');
      else if($('topStatus').textContent==='初期化中…'||$('topStatus').textContent==='接続中…'){
        setTopStatus('オフライン（再接続待ち）');
      }
    }catch(e){try{addLog('WARN','status fallback',e.message)}catch{}}
  },7000);

  directSidebar();
  setTimeout(()=>{try{renderFriendListSafe()}catch{}},50);
  addLog('INFO','friend requests','accept/reject UI ready');
})();
</script>

(function(){

    nameBtn:()=>window.openName?.(),

      return;

  // A resilient tab switcher with explicit rendering and no dependency on prior handlers.
  document.addEventListener('pointerup',e=>{

    list.parentNode.insertBefore(wrap,list);
    const run=()=>window.connectDirectPeer?.($id('directPeerSidebarInput')?.value||'');
    $id('directPeerSidebarGo').onclick=run;$id('directPeerSidebarInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run()}};
  }
  ensureSidebarDirect();
  setTimeout(ensureSidebarDirect,500);

  // Make status deterministic when signaling is blocked by the browser/network policy.
  setTimeout(()=>{
    const e=$id('topStatus'); if(!e)return;
    if(!state.wsReady && /初期化中|接続確認中|接続中/.test(e.textContent||'')){
      setTopStatus('オフライン（シグナリング未接続）');
      try{addLog('WARN','signaling status','timeout fallback status shown')}catch{}
