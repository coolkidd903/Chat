function renderList(){

  const tab =
    document
      .querySelector(
        '.tabs button.active'
      )?.dataset.tab ||
    'chats';

  const query =
    $('search')
      .value
      .trim()
      .toLowerCase();

  let html =
    '';

  if(
    tab ===
      'friends'
  ){

    state.friends
      .filter(
        friend =>
          (
            friend.name +
            ' ' +
            friend.id
          )
          .toLowerCase()
          .includes(
            query
          )
      )
      .forEach(
        friend => {

          html += `

            <button
              class="item ${
                state.selected ===
                friend.id
                  ? 'active'
                  : ''
              }"
              data-peer="${esc(friend.id)}"
            >

              <span class="avatar">
                ${esc(
                  friend.name
                    .slice(0,1)
                )}
              </span>

              <span class="txt">

                <strong>
                  ${esc(
                    friend.name
                  )}
                </strong>

                <p>
                  ${esc(
                    friend.id
                  )}
                </p>

              </span>

            </button>

          `;

        }
      );

  }else if(
    tab ===
      'history'
  ){

    state.callHistory
      .forEach(
        item => {

          html += `

            <div class="item">

              <span class="avatar">
                ☎
              </span>

              <span class="txt">

                <strong>
                  ${esc(
                    contactName(
                      item.id
                    )
                  )}
                </strong>

                <p>
                  ${
                    item.direction ===
                      'incoming'
                      ? '着信'
                      : '発信'
                  }
                  ・
                  ${new Date(
                    item.time
                  ).toLocaleString()}
                </p>

              </span>

            </div>

          `;

        }
      );

  }else{

    const peers =
      [
        ...new Set(
          state.chats
            .map(
              item =>
                item.peer
            )
        )
      ];

    peers
      .filter(
        peer =>
          !query ||
          contactName(peer)
            .toLowerCase()
            .includes(
              query
            ) ||
          peer.includes(
            query
          )
      )
      .forEach(
        peer => {

          const messages =
            state.chats
              .filter(
                item =>
                  item.peer ===
                    peer
              );

          const last =
            messages.at(-1);

          const preview =
            last?.file
              ? `📎 ${last.file.name}`
              : (
                  last?.text ||
                  '会話を開始'
                );

          html += `

            <button
              class="item ${
                state.selected ===
                peer
                  ? 'active'
                  : ''
              }"
              data-peer="${esc(peer)}"
            >

              <span class="avatar">
                ${esc(
                  avatarText(
                    contactName(peer)
                  )
                )}
              </span>

              <span class="txt">

                <strong>
                  ${esc(
                    contactName(peer)
                  )}
                </strong>

                <p>
                  ${esc(
                    preview
                  )}
                </p>

              </span>

              <span class="time">
                ${
                  last
                    ? new Date(
                        last.time
                      ).toLocaleTimeString(
                        [],
                        {
                          hour:
                            '2-digit',

                          minute:
                            '2-digit'
                        }
                      )
                    : ''
                }
              </span>

            </button>

          `;

        }
      );

  }

  if(!html){

    html =
      `
      <div style="
        padding:20px;
        color:#667085;
        font-size:13px;
      ">
        データがありません。
      </div>
      `;

  }

  $('list').innerHTML =
    html;

  $('list')
    .querySelectorAll(
      '[data-peer]'
    )
    .forEach(
      element =>
        element.onclick =
          () =>
            selectPeer(
              element.dataset.peer
            )
    );

}


function avatarText(
  value
){

  return (
    String(
      value ||
      '?'
    )
    .trim()
    .slice(
      0,
      1
    )
    .toUpperCase()
  );

}


function selectPeer(
  peer
){

  state.selected =
    peer;

  renderChat(
    peer
  );

  renderList();

}


function renderChat(
  peer
){

  const name =
    contactName(
      peer
    );

  $('topName')
    .textContent =
    name;

  $('topAvatar')
    .textContent =
    avatarText(
      name
    );

  const connected =
    !!findDataConnection(
      peer
    );

  $('topStatus')
    .textContent =
    connected
      ? 'P2P接続済み'
      : '未接続';

  const chat =
    $('chat');

  chat.innerHTML =
    `
    <div class="notice">
      🔒 アプリ層暗号化
    </div>
    `;

  const messages =
    state.chats
      .filter(
        item =>
          item.peer ===
            peer
      );

  if(!messages.length){

    chat.innerHTML +=
      `
      <div class="empty">
        <b>
          ${esc(name)}
        </b>
        との会話を開始しましょう。
      </div>
      `;

  }

  messages.forEach(
    item => {

      const mine =
        item.from ===
          state.id;

      const bubble =
        document.createElement(
          'div'
        );

      bubble.className =
        `bubble ${
          mine
            ? 'mine'
            : 'theirs'
        }`;

      if(
        item.file
      ){

        const file =
          document.createElement(
            'div'
          );

        file.className =
          'file-msg';

        const icon =
          document.createElement(
            'span'
          );

        icon.textContent =
          '📎';

        const label =
          document.createElement(
            'span'
          );

        label.textContent =
          item.file.name;

        file.append(
          icon,
          label
        );

        if(
          item.file.url
        ){

          file.onclick =
            () =>
              window.open(
                item.file.url,
                '_blank'
              );

        }

        bubble.append(
          file
        );

      }else{

        const msg =
          document.createElement(
            'div'
          );

        msg.className =
          'msg';

        msg.textContent =
          item.text ||
          '';

        bubble.append(
          msg
        );

      }

      const meta =
        document.createElement(
          'div'
        );

      meta.className =
        'meta';

      meta.textContent =
        new Date(
          item.time
        ).toLocaleTimeString(
          [],
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        );

      bubble.append(
        meta
      );

      chat.append(
        bubble
      );

    }
  );

  chat.scrollTop =
    chat.scrollHeight;

}

$('micBtn')
  .onclick =
  () => {

    const track =
      state.localStream
        ?.getAudioTracks?.()
        ?.at(0);

    if(!track){

      toast(
        'マイクがありません'
      );

      return;

    }

    track.enabled =
      !track.enabled;

    $('micBtn')
      .textContent =
      track.enabled
        ? '🎙️'
        : '🔇';

  };

$('camBtn')
  .onclick =
  () => {

    const track =
      state.localStream
        ?.getVideoTracks?.()
        ?.at(0);

    if(!track){

      toast(
        'カメラがありません'
      );

      return;

    }

    track.enabled =
      !track.enabled;

    $('camBtn')
      .textContent =
      track.enabled
        ? '📷'
        : '🚫';

  };

$('fullBtn')
  .onclick =
  async () => {

    try{

      if(
        document.fullscreenElement
      ){

        await document.exitFullscreen();

      }else{

        await $('videoStage')
          .requestFullscreen();

      }

    }catch(error){

      addLog(
        'WARN',
        'fullscreen failed',
        errorMessage(error)
      );

    }

  };

$('hangBtn')
  .onclick =
  hangup;

$('loginBtn')
  .onclick =
  microsoftLogin;

$('modal')
  .onclick =
  event => {

    if(
      event.target ===
        $('modal')
    ){

      closeModal();

    }

  };

document
  .querySelectorAll(
    '.tabs button'
  )
  .forEach(
    button =>
      button.onclick =
        () => {

          document
            .querySelectorAll(
              '.tabs button'
            )
            .forEach(
              other =>
                other.classList.remove(
                  'active'
                )
            );

          button.classList.add(
            'active'
          );

          renderList();

        }
  );

$('search')
  .oninput =
  renderList;


/* =========================================================
   Microsoft state
   ========================================================= */

try{

  const savedAuth =
    JSON.parse(
      Store.get(
        STORAGE.auth,
        '{}'
      ) ||
      '{}'
    );

  if(
    savedAuth.accessToken
  ){

    state.msAuth =
      savedAuth;

    addLog(
      'INFO',
      'Microsoft auth state restored'
    );

  }

}catch(error){

  addLog(
    'WARN',
    'Microsoft auth state load failed',
    errorMessage(error)
  );

}


/* =========================================================
   Invite bootstrap
   ========================================================= */

function bootInvite(){

  try{

    const match =
      location.hash.match(
        /peer=(\d{6})/
      );

    if(
      match
    ){

      setTimeout(
        () => {

          openFriendModal();

          setTimeout(
            () => {

              if(
                $('peerInput')
              ){

                $('peerInput')
                  .value =
                  match[1];

              }

            },
            30
          );

        },
        100
      );

    }

  }catch(error){

    addLog(
      'ERROR',
      'invite bootstrap failed',
      errorMessage(error)
    );

  }

}


/* =========================================================
   IMPORTANT:
   Custom OFFER dispatcher wrapper
   ========================================================= */

const originalSignalHandler =
  handleSignal;

handleSignal =
  function(message){

    try{

      if(
        message?.type ===
          'OFFER' &&
        message.src &&
        message.payload
      ){

        const payload =
          message.payload;

        processOffer(
          message.src,
          payload
        );

        return;

      }

      originalSignalHandler(
        message
      );

    }catch(error){

      addLog(
        'ERROR',
        'wrapped signal handler failed',
        errorMessage(error)
      );

    }

  };


/* =========================================================
   Boot
   ========================================================= */

updatePersistenceStatus();

$('myId')
  .textContent =
  state.id;

addLog(
  'INFO',
  'Secure Chat boot',
  `PeerID=${state.id}`
);

addLog(
  'INFO',
  'SecureAI engine',
  'embedded-v5'
);

addLog(
  'INFO',
  'fallback',
  `enabled=${state.settings.fallbackEnabled}`
);

addLog(
  'INFO',
  'WebRTC',
  String(
    !!window.RTCPeerConnection
  )
);

addLog(
  'INFO',
  'Microsoft',
  'TENANT_ID=common'
);


async function boot(){

  try{

    /*
      OAuth callbackを最初に処理。
    */

    await handleMicrosoftCallback();

  }catch(error){

    addLog(
      'WARN',
      'OAuth callback processing failed',
      errorMessage(error)
    );

  }

  try{

    connectSignal();

  }catch(error){

    addLog(
      'ERROR',
      'signaling boot failed',
      errorMessage(error)
    );

  }

  try{

    renderList();

  }catch(error){

    addLog(
      'ERROR',
      'list render failed',
      errorMessage(error)
    );

  }

  bootInvite();

}


boot();


</script>
